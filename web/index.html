  lightning: buildLightning, radar: buildRadar, blank: buildBlank,
};

/* Active weather alerts, worst first. */
function renderAlerts(s){
  const host = document.getElementById("alerts");
  const list = (s.alerts && s.alerts.alerts) || [];
  if (!list.length) { host.className = ""; host.replaceChildren(); return; }
  host.className = "show";
  host.replaceChildren(...list.slice(0, 3).map(a => {
    const n = el("div", "alert sev-" + (a.severity || "unknown").toLowerCase());
    n.innerHTML = '<span class="ev">' + esc(a.event) + '</span>' +
                  '<span class="hl">' + esc(a.headline || "") + '</span>';
    return n;
  }));
}

/* ── settings: card order, which cards, and the token ────────────────── */
let cfg = null;                     // last /api/config payload
let paused = false;                 // hold the 2 s re-render while dragging

async function loadConfig(){
  try {
    const r = await fetch("api/config", {cache:"no-store"});
    if (r.ok) cfg = await r.json();
  } catch (e) { /* the dashboard still runs on the server's defaults */ }
  return cfg;
}

async function saveConfig(patch, statusEl){
  try {
    const r = await fetch("api/config", {
      method: "POST",
      headers: {"Content-Type": "application/json", "X-Tempest-Config": "1"},
      body: JSON.stringify(patch),
    });
    const body = await r.json().catch(() => ({}));
    if (!r.ok || body.ok === false) throw new Error(body.error || ("HTTP " + r.status));
    cfg = body;
    if (statusEl) { statusEl.className = "state ok"; statusEl.textContent = "Saved."; }
    poll();
    return true;
  } catch (e) {
    if (statusEl) { statusEl.className = "state bad"; statusEl.textContent = "Could not save — " + e.message; }
    return false;
  }
}

function renderSettings(){
  const host = document.getElementById("settings");
  const all = (cfg && cfg.cards) || [];
  const on = (cfg && cfg.slots) || [];
  // chosen cards first, in their order, then the rest
  const ordered = on.concat(all.filter(c => !on.includes(c)));

  const sheet = el("div","sheet");
  sheet.innerHTML = '<h2>Cards</h2>' +
    '<p class="note">Tick the cards you want, drag to reorder. Up to six. ' +
    'This layout is shared by every screen — the TV included.</p>';

  const list = el("div","cardlist");
  for (const name of ordered) {
    const row = el("div","cardrow");
    row.draggable = true;
    row.dataset.card = name;
    row.innerHTML = '<span class="grip">⠿</span>' +
      '<span class="nm">' + esc(name) + '</span>' +
      '<input type="checkbox"' + (on.includes(name) ? " checked" : "") + '>';
    list.appendChild(row);
  }
  wireRowDrag(list);
  sheet.appendChild(list);

  const status = el("div","state");
  const apply = el("button","primary","Save layout");
  apply.addEventListener("click", () => {
    const picked = [...list.querySelectorAll(".cardrow")]
      .filter(r => r.querySelector("input").checked)
      .map(r => r.dataset.card).slice(0, 6);
    if (!picked.length) {
      status.className = "state bad";
      status.textContent = "Pick at least one card.";
      return;
    }
    saveConfig({slots: picked}, status);
  });
  const applyRow = el("div","row");
  applyRow.append(apply, status);
  sheet.appendChild(applyRow);

  // ── token ─────────────────────────────────────────────────────────────
  const tokenSet = !!(cfg && cfg.token_set);
  const h = el("div");
  h.innerHTML = '<h2>WeatherFlow token</h2>' +
    '<p class="note">Optional. With it the dashboard backfills your station\'s ' +
    'real history, so 24-hour and monthly figures are right from the start ' +
    'instead of only counting from when this started running. Get one at ' +
    '<a href="https://tempestwx.com/settings/tokens" target="_blank" ' +
    'rel="noopener noreferrer" style="color:var(--accent)">tempestwx.com</a>. ' +
    'It is stored on the server and never sent back to a browser — including ' +
    'this one.</p>';
  sheet.appendChild(h);

  const field = document.createElement("input");
  field.type = "password";
  field.autocomplete = "off";
  field.spellcheck = false;
  field.placeholder = tokenSet ? "A token is configured — type to replace it"
                               : "Paste your personal access token";
  // Reveal toggle — you cannot spot a stray space in a field of dots.
  const eye = el("button", null, "");
  eye.type = "button";
  eye.setAttribute("aria-label", "Show token");
  eye.setAttribute("aria-pressed", "false");
  eye.style.cssText = "padding:.5em .7em;line-height:0";
  const EYE_OPEN = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none">' +
    '<path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z" ' +
    'stroke="currentColor" stroke-width="1.7"/>' +
    '<circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.7"/></svg>';
  const EYE_SHUT = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none">' +
    '<path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z" ' +
    'stroke="currentColor" stroke-width="1.7"/>' +
    '<circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.7"/>' +
    '<path d="M4 20 20 4" stroke="currentColor" stroke-width="1.7" ' +
    'stroke-linecap="round"/></svg>';
  eye.innerHTML = EYE_OPEN;
  eye.addEventListener("click", () => {
    const show = field.type === "password";
    field.type = show ? "text" : "password";
    eye.innerHTML = show ? EYE_SHUT : EYE_OPEN;
    eye.setAttribute("aria-label", show ? "Hide token" : "Show token");
    eye.setAttribute("aria-pressed", show ? "true" : "false");
    field.focus();
  });

  // Live check for the things that actually go wrong when pasting a token.
  const hint = el("div","state");
  field.addEventListener("input", () => {
    const v = field.value;
    if (!v) { hint.className = "state"; hint.textContent = ""; return; }
    const notes = [v.length + " characters"];
    let bad = false;
    if (v !== v.trim()) { notes.push("leading or trailing space — trimmed on save"); bad = true; }
    if (/\s/.test(v.trim())) { notes.push("contains a space in the middle"); bad = true; }
    if (/[\u2018\u2019\u201c\u201d]/.test(v)) { notes.push("contains a curly quote"); bad = true; }
    hint.className = "state" + (bad ? " bad" : " ok");
    hint.textContent = notes.join(" · ");
  });

  const tState = el("div","state", tokenSet ? "Status: configured." : "Status: not set.");
  const saveTok = el("button","primary","Save token");
  saveTok.addEventListener("click", async () => {
    if (!field.value.trim()) {
      tState.className = "state bad"; tState.textContent = "Nothing to save.";
      return;
    }
    const ok = await saveConfig({token: field.value}, tState);
    field.value = "";
    hint.className = "state"; hint.textContent = "";
    field.type = "password"; eye.innerHTML = EYE_OPEN;
    eye.setAttribute("aria-pressed", "false");
    if (ok) { tState.className = "state ok"; tState.textContent = "Saved. Backfill starting."; }
  });
  const clearTok = el("button",null,"Clear");
  clearTok.addEventListener("click", async () => {
    const ok = await saveConfig({token: ""}, tState);
    field.value = "";
    hint.className = "state"; hint.textContent = "";
    if (ok) { tState.className = "state"; tState.textContent = "Status: not set."; }
  });
  const tRow = el("div","row");
  tRow.append(field, eye, saveTok, clearTok);
  sheet.append(tRow, hint, tState);

  if (cfg && cfg.backfill && cfg.backfill.status && cfg.backfill.status !== "off") {
    const b = cfg.backfill;
    sheet.appendChild(el("div","state",
      "Backfill: " + b.status + (b.added ? " — " + b.added + " observations merged" : "") +
      (b.error ? " (" + b.error + ")" : "")));
  }
  host.replaceChildren(sheet);
}

/* Drag rows in the settings list. */
function wireRowDrag(list){
  let src = null;
  list.addEventListener("dragstart", e => {
    src = e.target.closest(".cardrow");
    if (!src) return;
    src.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
    try { e.dataTransfer.setData("text/plain", src.dataset.card); } catch (x) {}
  });
  list.addEventListener("dragend", () => {
    if (src) src.classList.remove("dragging");
    [...list.children].forEach(c => c.classList.remove("drag-over"));
    src = null;
  });
  list.addEventListener("dragover", e => {
    e.preventDefault();
    const over = e.target.closest(".cardrow");
    if (!over || over === src) return;
    [...list.children].forEach(c => c.classList.toggle("drag-over", c === over));
  });
  list.addEventListener("drop", e => {
    e.preventDefault();
    const over = e.target.closest(".cardrow");
    if (!over || !src || over === src) return;
    const rows = [...list.children];
    list.insertBefore(src, rows.indexOf(src) < rows.indexOf(over)
                           ? over.nextSibling : over);
    [...list.children].forEach(c => c.classList.remove("drag-over"));
  });
}

/* Drag the cards on the dashboard itself. */
function wireCardDrag(){
  let src = null;
  grid.addEventListener("dragstart", e => {
    src = e.target.closest(".card");
    if (!src) return;
    paused = true;                       // do not re-render mid-drag
    src.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
    try { e.dataTransfer.setData("text/plain", src.id); } catch (x) {}
  });
  grid.addEventListener("dragover", e => {
    if (!src) return;
    e.preventDefault();
    const over = e.target.closest(".card");
    [...grid.children].forEach(c => c.classList.toggle("drop-target",
                                                        c === over && c !== src));
  });
  grid.addEventListener("drop", e => {
    if (!src) return;
    e.preventDefault();
    const over = e.target.closest(".card");
    if (over && over !== src) {
      const kids = [...grid.children];
      grid.insertBefore(src, kids.indexOf(src) < kids.indexOf(over)
                             ? over.nextSibling : over);
    }
    [...grid.children].forEach(c => c.classList.remove("drop-target"));
  });
  grid.addEventListener("dragend", () => {
    if (src) src.classList.remove("dragging");
    [...grid.children].forEach(c => c.classList.remove("drop-target"));
    src = null;
    paused = false;
    const order = [...grid.children]
      .map(c => c.id.replace("card-", ""))
      .map(n => n === "bolt" ? "lightning" : n === "sky" ? "astronomy"
              : n === "pres" ? "pressure" : n === "temp" ? "temperature"
              : n === "rain" ? "rainfall" : n === "fc" ? "forecast" : n)
      .filter(n => (cfg && cfg.cards || []).includes(n));
    if (order.length) saveConfig({slots: order});
  });
}

/* The full ten days the forecast feed already returns — the Forecast card
   only has room for three. Each row carries a bar showing that day's range
   against the whole ten-day span, so a warm spell or a cold snap is visible
   at a glance rather than needing the numbers read. */
function renderOutlook(){
  const host = document.getElementById("outlook");
  const fc = (last && last.forecast) || {};
  const days = fc.days || [];
  if (!fc.available || !days.length) {
    host.replaceChildren(el("div","sheet",
      esc(fc.error || "Forecast unavailable")));
    return;
  }
  const lows = days.map(d => d.tmin_c).filter(v => v != null);
  const highs = days.map(d => d.tmax_c).filter(v => v != null);
  const lo = Math.min(...lows), hi = Math.max(...highs);
  const span = (hi - lo) || 1;

  const wrap = el("div","outlook");
  const head = el("div","sheet");
  head.style.cssText = "padding:0;background:none;border:0;margin-bottom:.6em";
  head.innerHTML = '<h2 style="margin:0">' +
    esc("Ten-day outlook" + (last.station_name ? " · " + last.station_name : "")) +
    '</h2>';
  wrap.appendChild(head);

  const sheet = el("div","sheet");
  const todayIso = new Date().toISOString().slice(0, 10);
  for (const d of days) {
    const w = wmo(d.code, true);
    const row = el("div", "day" + (d.date === todayIso ? " today" : ""));
    const l = d.tmin_c, h = d.tmax_c;
    const left = l == null ? 0 : ((l - lo) / span) * 100;
    const width = (l == null || h == null) ? 0 : Math.max(2, ((h - l) / span) * 100);
    row.innerHTML =
      '<span class="dow">' + esc(d.date === todayIso ? "Today" : weekday(d.date)) + '</span>' +
      '<span class="ico">' + wi(w.glyph) + '</span>' +
      '<span class="pop">' + (d.pop == null ? "" : esc(d.pop + "%")) + '</span>' +
      '<span class="bar"><span style="left:' + left.toFixed(1) +
        '%;width:' + width.toFixed(1) + '%"></span></span>' +
      '<span class="lo">' + esc(fg(temp(l))) + '</span>' +
      '<span class="hi">' + esc(fg(temp(h))) + '</span>';
    row.title = w.label;
    sheet.appendChild(row);
  }
  wrap.appendChild(sheet);
  host.replaceChildren(wrap);
}

/* ── render loop ─────────────────────────────────────────────────────── */
let last = null;
const grid = document.getElementById("grid");

function render(s){
  last = s;
  if (paused) return;                       // a drag is in progress
  if (document.body.classList.contains("show-map") ||
      document.body.classList.contains("show-settings") ||
      document.body.classList.contains("show-outlook")) {
    if (document.body.classList.contains("show-outlook")) renderOutlook();
    updateFooter(s);
    return;                                   // cards are hidden; skip the work
  }
  const scroll = window.scrollY;
  const slots = (s.slots && s.slots.length) ? s.slots
    : ["temperature","wind","pressure","rainfall","astronomy","forecast"];
  const cards = slots.map(name => {
    const c = (CARD_BUILDERS[name] || buildBlank)(s);
    c.draggable = true;
    c.title = "Drag to rearrange";
    return c;
  });
  grid.replaceChildren(...cards);
  // keep the grid balanced when fewer than six cards are shown
  if (window.matchMedia("(max-width:720px)").matches) {
    grid.style.removeProperty("grid-template-columns");
    grid.style.removeProperty("grid-template-rows");
  } else {
    const cols = Math.max(1, Math.min(3, Math.ceil(cards.length / 2)));
    grid.style.gridTemplateColumns = "repeat(" + cols + ",1fr)";
    grid.style.gridTemplateRows =
      "repeat(" + Math.ceil(cards.length / cols) + ",1fr)";
  }
  window.scrollTo(0, scroll);
  renderAlerts(s);
  updateFooter(s);
  fitCards();
}

function updateFooter(s){
  document.getElementById("footdot").className = "dot " + s.health;
  document.getElementById("station").textContent =
    s.station_name || (s.demo ? "Demo station" : "Waiting for a hub");
  const meta = [];
  if (s.obs.battery != null) meta.push(s.obs.battery.toFixed(2) + " V");
  const mode = s.demo ? "Demo"
    : {live:"Live", stale:"Stale", offline:"Offline", waiting:"Waiting"}[s.health];
  meta.push(mode + " · " + (s.last_type || "no packets") + " · UDP :" + s.port);
  if (s.age_s != null) meta.push("updated " + ago(s.age_s) + " ago");
  document.getElementById("meta").textContent = meta.join("   ·   ");

  const banner = document.getElementById("banner");
  if (s.source_error) {
    banner.textContent = s.source_error;
    banner.classList.add("show");
  } else if (s.health === "waiting" && s.uptime_s > 60 && !s.demo) {
    // The classic deployment failure: the host cannot see the broadcasts.
    banner.textContent = "No hub packets after " + ago(s.uptime_s) +
      " on UDP :" + s.port + " — the hub broadcasts, so this host must be on " +
      "the same subnet, and a Docker container must use host networking.";
    banner.classList.add("show");
  } else if (s.health === "offline") {
    banner.textContent = "No packets for " + ago(s.age_s) +
      " — the hub may be offline or off this subnet.";
    banner.classList.add("show");
  } else banner.classList.remove("show");
}

function tickClock(){
  const now = new Date();
  document.getElementById("clock").textContent =
    now.toLocaleTimeString([], {hour:"numeric", minute:"2-digit", second:"2-digit"});
  document.getElementById("date").textContent =
    now.toLocaleDateString([], {weekday:"short", month:"short", day:"numeric"});
}

/* The hub sends rapid_wind every ~3 s, but the full snapshot is only polled
   every 2 s. This asks for just the wind far more often — a few dozen bytes —
   so the compass tracks the station rather than the poll clock. */
async function pollWind(){
  try {
    const res = await fetch("api/wind", {cache:"no-store"});
    if (!res.ok) return;
    const w = await res.json();
    if (w.dir == null || windDial.shown == null) return;
    setWindTarget(w.dir);
    if (w.ms != null) windDial.speedTarget = w.ms;
    startWindDial();
    const dir = document.querySelector("#card-wind .wind-dir");
    if (dir) dir.innerHTML = '<span class="accent">' + compass(w.dir) +
                             '</span> ' + Math.round(w.dir) + "\u00b0";
  } catch (e) { /* the 2 s snapshot poll reports connection trouble */ }
}

let failures = 0;
async function poll(){
  try {
    const res = await fetch("api/state", {cache:"no-store"});
    if (!res.ok) throw new Error("HTTP " + res.status);
    const s = await res.json();
    if (!Object.keys(prefs).length) loadPrefs(s.units);
    failures = 0;
    render(s);
  } catch (e) {
    failures++;
    if (failures > 2) {
      const banner = document.getElementById("banner");
      banner.textContent = "Lost contact with the dashboard server — retrying…";
      banner.classList.add("show");
      document.getElementById("footdot").className = "dot offline";
    }
  }
}

/* On a phone each card is sized to the screen minus the footer. Guessing that
   height goes wrong as Safari shows and hides its toolbars, so measure the
   footer we actually rendered and hand it to the CSS. */
function measureChrome(){
  if (!window.matchMedia("(max-width:720px)").matches) return;
  const f = document.querySelector("footer");
  if (!f) return;
  // Just the footer: it is sticky, so it is the only thing overlaying the
  // scroll viewport. The grid gap is accounted for in the CSS.
  const chrome = Math.ceil(f.getBoundingClientRect().height);
  document.documentElement.style.setProperty("--chrome", chrome + "px");
}

/* ── chrome ──────────────────────────────────────────────────────────── */
function applyTheme(t){
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem("theme", t); } catch (e) {}
}
function toggleTheme(){
  applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
}
function setTv(on){
  document.body.classList.toggle("tv", on);
  const url = new URL(location.href);
  if (on) url.searchParams.set("tv", "1"); else url.searchParams.delete("tv");
  history.replaceState(null, "", url);
}

/* The map is a third-party embed (Windy — free, no account, no key). It is
   the one part of the dashboard that needs internet on the *viewing* device;
   everything else is served by the NAS. Nothing loads until first opened. */
function windyUrl(lat, lon, zoom){
  const q = new URLSearchParams({
    lat: lat.toFixed(4), lon: lon.toFixed(4),
    detailLat: lat.toFixed(4), detailLon: lon.toFixed(4),
    zoom: String(zoom), level: "surface", overlay: "radar", product: "radar",
    menu: "", message: "", marker: "true", calendar: "now",
    type: "map", location: "coordinates", detail: "",
    metricWind: prefs.wind === "km/h" ? "km/h" : prefs.wind === "kts" ? "kt"
                : prefs.wind === "m/s" ? "m/s" : "mph",
    metricTemp: prefs.temp === "°C" ? "°C" : "°F",
  });
  return "https://embed.windy.com/embed2.html?" + q.toString();
}

let mapLoaded = false;
function ensureMap(){
  if (mapLoaded) return;
  const host = document.getElementById("map");
  const lat = last && last.lat, lon = last && last.lon;
  if (lat == null || lon == null) {
    host.innerHTML = '<div class="placeholder">Set the station location on ' +
      'the server (--lat / --lon) to show the map.</div>';
    return;                                  // retry if coords arrive later
  }
  const f = document.createElement("iframe");
  f.src = windyUrl(lat, lon, 8);
  f.loading = "lazy";
  f.referrerPolicy = "no-referrer";
  f.title = "Weather radar map";
  host.replaceChildren(f);
  mapLoaded = true;
}

function toggleMap(force){
  const swap = () => {
    const on = force != null ? force : !document.body.classList.contains("show-map");
    document.body.classList.toggle("show-map", on);
    if (on) document.body.classList.remove("show-outlook", "show-settings");
    document.getElementById("map").setAttribute("aria-hidden", on ? "false" : "true");
    document.getElementById("mapBtn").setAttribute("aria-pressed", on ? "true" : "false");
    if (on) ensureMap();
  };
  if (document.startViewTransition) document.startViewTransition(swap);
  else swap();
}

function toggleSettings(force){
  const swap = () => {
    const on = force != null ? force
      : !document.body.classList.contains("show-settings");
    document.body.classList.toggle("show-settings", on);
    if (on) document.body.classList.remove("show-map", "show-outlook");
    document.getElementById("settings").setAttribute("aria-hidden", on ? "false" : "true");
    document.getElementById("setBtn").setAttribute("aria-pressed", on ? "true" : "false");
    if (on) renderSettings();
  };
  if (document.startViewTransition) document.startViewTransition(swap);
  else swap();
}

function toggleOutlook(force){
  const swap = () => {
    const on = force != null ? force
      : !document.body.classList.contains("show-outlook");
    document.body.classList.toggle("show-outlook", on);
    if (on) {
      document.body.classList.remove("show-map", "show-settings");
      renderOutlook();
    }
    document.getElementById("outlook").setAttribute("aria-hidden", on ? "false" : "true");
    document.getElementById("outBtn").setAttribute("aria-pressed", on ? "true" : "false");
  };
  if (document.startViewTransition) document.startViewTransition(swap);
  else swap();
}
document.getElementById("outBtn").addEventListener("click", () => toggleOutlook());

document.getElementById("setBtn").addEventListener("click", async () => {
  if (!cfg) await loadConfig();
  toggleSettings();
});
document.getElementById("mapBtn").addEventListener("click", () => toggleMap());
document.getElementById("themeBtn").addEventListener("click", toggleTheme);
document.getElementById("tvBtn").addEventListener("click",
  () => setTv(!document.body.classList.contains("tv")));
document.addEventListener("keydown", (e) => {
  if (e.key === "t") toggleTheme();
  if (e.key === "f") setTv(!document.body.classList.contains("tv"));
  if (e.key === "w") toggleMap();
  if (e.key === "d") toggleOutlook();
  if (e.key === "Escape" && document.body.classList.contains("show-outlook"))
    toggleOutlook(false);
  if (e.key === "s") { if (!cfg) loadConfig().then(() => toggleSettings());
                       else toggleSettings(); }
  if (e.key === "Escape" && document.body.classList.contains("show-settings"))
    toggleSettings(false);
  if (e.key === "Escape" && document.body.classList.contains("show-map"))
    toggleMap(false);
});

(function init(){
  let saved = null;
  try { saved = localStorage.getItem("theme"); } catch (e) {}
  applyTheme(saved === "light" ? "light" : "dark");
  if (new URLSearchParams(location.search).has("tv")) setTv(true);
  loadPrefs(null);
  tickClock();
  setInterval(tickClock, 1000);
  loadConfig();
  wireCardDrag();
  poll();
  setInterval(poll, 2000);
  setInterval(pollWind, 900);
  measureChrome();
  addEventListener("orientationchange", () => setTimeout(measureChrome, 250));
  let fitJob = null;
  addEventListener("resize", () => {
    measureChrome();
    clearTimeout(fitJob);
    fitJob = setTimeout(() => { fitCache.clear(); fitCards(); }, 120);
  });
})();
</script>
