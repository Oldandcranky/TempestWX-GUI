<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Tempest Weather Station</title>
<!-- ?v=2 because the first .ico went out with a week-long max-age and
     PNG payloads Safari would not read; this forces the refetch. -->
<link rel="icon" href="favicon.ico?v=2" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!-- Large icons for anything that pins the page as a tile or an app: TV
     browsers, Android, Chrome's install. The tab icons above are too small. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Tempest">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#050508">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#eceef2">
<style>
:root{
  --bg:#050508; --card:#0c0d14; --card-edge:#ffffff0f; --inset:#ffffff05;
  --inset-edge:#ffffff0a; --rule:#ffffff14;
  --text:#e8eaed; --muted:#8899aa; --label:#6b7084; --faint:#ffffff59;
  --accent:#ff8837; --amber:#ffab40; --cold:#00bcd4; --red:#ff5252;
  --green:#66bb6a; --yellow:#f5c518; --purple:#b388ff;
  --uv-low:#3ea72d; --uv-mod:#fff300; --uv-high:#f18b00;
  --uv-vhigh:#e53210; --uv-extreme:#b567a4;
  --radius:10px; --inset-radius:6px;
  --gap:8px; --pad:clamp(10px,1.4vw,18px);
  --fit:1;
}
html[data-theme="light"]{
  --bg:#eceef2; --card:#ffffff; --card-edge:#00000014; --inset:#00000006;
  --inset-edge:#0000000f; --rule:#0000001a;
  --text:#14161c; --muted:#5c6472; --label:#7d8593; --faint:#00000073;
  --accent:#d4620a; --amber:#c2700a; --cold:#00808f; --red:#d13030;
  --green:#2f8f34; --yellow:#a8860b; --purple:#7c4bcc;
}
/* Weather Icons — Erik Flowers, SIL OFL 1.1.
   Vendored in web/fonts/ so the dashboard needs no CDN on a private LAN.
   Licence: web/fonts/LICENSE-weather-icons.txt */
@font-face{
  font-family:weathericons;
  src:url("fonts/weathericons-regular-webfont.woff2") format("woff2");
  font-weight:normal;font-style:normal;font-display:swap;
}
.wi{
  font-family:weathericons,system-ui,-apple-system,"Segoe UI Symbol",sans-serif;
  font-style:normal;font-weight:normal;
  font-variant:normal;text-transform:none;line-height:1;
  display:inline-block;speak:never;
}
.card-head .wi{font-size:1.25em;width:1.3em;text-align:center;flex:0 0 auto}
.moonrow .wi{font-size:1.05em;margin-right:.25em;opacity:.85}
.phase .wi{font-size:1.5em}
.caption .wi{font-size:1.25em;vertical-align:-.15em;margin-right:.3em}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
body.tv{cursor:none}
body.tv .unit-toggle{cursor:default}

#app{display:flex;flex-direction:column;height:100%;padding:var(--gap);gap:var(--gap)}
#grid{
  flex:1; display:grid; gap:var(--gap);
  grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(2,1fr);
  min-height:0;
}
@media (max-width:1100px){#grid{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(3,1fr)}}


.card{
  background:var(--card); border:1px solid var(--card-edge);
  border-radius:var(--radius); display:flex; flex-direction:column;
  min-height:0; overflow:hidden; position:relative;
  container-type:size;            /* cqh / cqw below resolve against the card */

  /* Type is sized against the card, capped by its WIDTH as well as its
     height so an unusual aspect ratio cannot blow the text up, and finally
     multiplied by --fit, which the fit pass in JS trims if the content
     still does not clear the card on this platform's fonts. */
  --fs-hero:calc(clamp(min(2.55rem,6.375vmin),min(23cqh,17cqw),8.75rem)*var(--fit));
  --fs-unit:calc(clamp(min(.85rem,2.125vmin),min(6.5cqh,5cqw),2.5rem)*var(--fit));
  --fs-value:calc(clamp(min(.85rem,2.125vmin),min(6.5cqh,5.5cqw),2.5rem)*var(--fit));
  --fs-value-sm:calc(clamp(min(.7rem,1.75vmin),min(4.8cqh,4.2cqw),1.9rem)*var(--fit));
  --fs-title:calc(clamp(min(.55rem,1.375vmin),min(3.8cqh,3.4cqw),1.5rem)*var(--fit));
  --fs-label:calc(clamp(min(.55rem,1.375vmin),min(3.8cqh,3.4cqw),1.5rem)*var(--fit));
}
.card-head{
  display:flex; align-items:center; gap:8px; flex:0 0 auto;
  padding:clamp(4px,2.2cqh,14px) var(--pad) clamp(2px,1cqh,8px);
}
.card-head svg{width:1.15em;height:1.15em;flex:0 0 auto}
.card-title{
  font-size:var(--fs-title); font-weight:600; letter-spacing:.09em;
  text-transform:uppercase; color:var(--label);
}
.dot{width:.42em;height:.42em;border-radius:50%;margin-left:auto;background:var(--faint);flex:0 0 auto}
.dot.live{background:var(--green)} .dot.stale{background:var(--accent)}
.dot.offline{background:var(--red)} .dot.waiting{background:var(--faint)}

.card-body{
  flex:1; min-height:0; display:flex; flex-direction:column;
  justify-content:center; gap:clamp(2px,1.2cqh,9px);
  padding:0 var(--pad) clamp(4px,2cqh,14px);
}
.card-body > .mid{flex:1 1 auto;min-height:0}
.hero{text-align:center;line-height:1;white-space:nowrap}
.hero .v{font-size:var(--fs-hero);font-weight:700;letter-spacing:-.02em;line-height:1}
.hero .u{font-size:var(--fs-unit);font-weight:500;color:var(--label);margin-left:.14em}
.hero.amber .v{color:var(--amber)} .hero.cold .v{color:var(--cold)}
.hero.yellow .v{color:var(--yellow)}
.unit-toggle{cursor:pointer;-webkit-tap-highlight-color:transparent}
.unit-toggle:hover .v{filter:brightness(1.12)}

.row{
  background:var(--inset); border:1px solid var(--inset-edge);
  border-radius:var(--inset-radius); display:flex; align-items:stretch;
  padding:clamp(.15rem,1.2cqh,.6rem) calc(var(--pad)*.6); flex:0 0 auto;
}
.row.grow{flex:1 1 auto;min-height:0}
.cell{flex:1;display:flex;flex-direction:column;align-items:center;
      justify-content:center;gap:.22em;min-width:0;text-align:center}
.cell.inline{flex-direction:row;gap:.5em}
/* A card squeezed this short has no room for a line that only reports that
   nothing is wrong. Anything carrying actual news does not get this class. */
@container (max-height: 165px){ .caption.whenroom{display:none} }

/* Below this the label and value no longer fit side by side. */
@container (max-width: 430px){
  .row.n3 .cell.inline{flex-direction:column;gap:.12em}
  .row.n3 .cell.inline .k{font-size:calc(var(--fs-label)*.92)}
}
@container (max-width: 300px){
  .cell.inline{flex-direction:column;gap:.12em}
}
@container (max-width: 260px){
  .row{padding-inline:calc(var(--pad)*.35)}
}
.cell + .cell{border-left:1px solid var(--rule)}
.k{font-size:var(--fs-label);font-weight:600;letter-spacing:.085em;
   text-transform:uppercase;color:var(--label);white-space:nowrap}
.v{font-size:var(--fs-value);font-weight:600;white-space:nowrap;line-height:1.15}
.v.sm{font-size:var(--fs-value-sm)}
.v .u{font-size:.72em;font-weight:400;color:var(--label);margin-left:.18em}
.sub{font-size:var(--fs-label);color:var(--label);white-space:nowrap}
.cold{color:var(--cold)} .red{color:var(--red)} .accent{color:var(--accent)}
.uv-low{color:var(--uv-low)} .uv-mod{color:var(--uv-mod)}
.uv-high{color:var(--uv-high)} .uv-vhigh{color:var(--uv-vhigh)}
.uv-extreme{color:var(--uv-extreme)}
.green{color:var(--green)} .yellow{color:var(--yellow)} .muted{color:var(--label)}
/* Up to three lines, then an ellipsis: for a list too long to fit on one.
   Two was enough on a wide card and cut the last plants off a narrow one. */
.caption.wrap2{
  white-space:normal;display:-webkit-box;-webkit-line-clamp:3;
  -webkit-box-orient:vertical;overflow:hidden;
}
.caption{
  text-align:center;font-size:var(--fs-label);font-weight:600;line-height:1.3;
  flex:0 0 auto;
  letter-spacing:.085em;text-transform:uppercase;color:var(--label);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.chip{
  display:inline-block;padding:.15em .6em;border-radius:5px;
  background:var(--inset);border:1px solid var(--inset-edge);
  font-size:var(--fs-label);font-weight:600;letter-spacing:.085em;
  text-transform:uppercase;color:var(--label);
}
.uv-chip{border:none}
.stack{display:flex;flex-direction:column;align-items:center;gap:.2em}

svg.plot{width:100%;height:100%;display:block;overflow:visible}

/* ── The internet card has two sides ─────────────────────────────────────
   The glance view stays the front; the corner button turns it over to the
   test history. Both faces are built every render, so the flip is a CSS
   transform rather than a rebuild — and because the grid is replaced every
   two seconds, a card that is rendered already-flipped simply starts that
   way and does not re-animate. */
.card.flip{position:relative}
.flipper{position:absolute;inset:0}
/* The turned-away face is collapsed, not rotated away in 3-D.
   A 3-D flip needs transform-style:preserve-3d to survive on .card, which also
   carries container-type:size; a browser that reads that as containment
   flattens the context, and then backface-visibility hides nothing — both
   faces paint at once and the one turned away comes out mirrored. scaleX has
   no such dependency: it is a plain 2-D transform, a zero-width box paints
   nothing, and no text can ever render backwards. The two halves are staggered
   so one face has finished collapsing before the other opens, which reads as a
   flip without needing a third dimension. */
.face{
  position:absolute;inset:0;display:flex;flex-direction:column;
  transform-origin:50% 50%;transition:transform .24s ease-in-out;
}
.face.back{transform:scaleX(0)}
.face.front{transform:scaleX(1);transition-delay:.24s}
.card.flipped .face.front{transform:scaleX(0);transition-delay:0s}
.card.flipped .face.back{transform:scaleX(1);transition-delay:.24s}
@media (prefers-reduced-motion:reduce){.face{transition:none}}
/* The header turns the card over, so it has to look like it does. */
/* The flip button is a hint that a card does something, and the one part a
   keyboard can reach. It was hidden on the TV for a while as clutter; the
   owner preferred it back. */
/* Forecast and Internet act on a tap anywhere, but they are draggable cards
   first, so they keep the grab cursor; the flip button lighting up on hover
   is the hint. The outlook is not draggable, so it can say "click" outright. */
body:not(.tv) #card-fc:hover .flipbtn,
body:not(.tv) #card-internet.flip:hover .flipbtn{color:var(--accent)}
body:not(.tv) #outlook .card{cursor:pointer}
body:not(.tv) #outlook .card:hover .flipbtn{color:var(--accent)}

/* Speed against the plan rate. Colour carries the reading, so the bar itself
   stays thin — it sits under a figure that is already the headline, and is
   there to be caught out of the corner of the eye, not studied. */
.gauge{
  width:78%;height:clamp(4px,1.1cqh,10px);margin-top:.55em;
  background:var(--inset);border:1px solid var(--inset-edge);
  border-radius:999px;overflow:hidden;flex:0 0 auto;
}
.gauge .fill{height:100%;border-radius:999px}
.gauge .fill.green{background:var(--green)}
.gauge .fill.yellow{background:var(--yellow)}
.gauge .fill.red{background:var(--red)}

/* A way out to another page: a button in everything but element. */
.linkbtn{
  flex:0 0 auto;align-self:center;margin-top:.35em;padding:.3em .85em;
  border:1px solid var(--rule);border-radius:999px;
  font-size:var(--fs-label);font-weight:600;letter-spacing:.06em;
  color:var(--label);text-decoration:none;white-space:nowrap;
  -webkit-tap-highlight-color:transparent;
}
.linkbtn:hover{color:var(--accent);border-color:var(--accent)}
body.tv .linkbtn{display:none}

.flipbtn{
  background:none;border:0;padding:0;margin-left:.1em;line-height:0;
  color:var(--faint);cursor:pointer;-webkit-tap-highlight-color:transparent;
}
.flipbtn:hover{color:var(--accent)}
.flipbtn svg{width:1.05em;height:1.05em;display:block}
/* Axis labels ride on top of the plot as HTML: the SVG is stretched to the
   card, so text inside it would be stretched too. */
.netplot{position:relative;display:block}
.netplot .ax{position:absolute;font-size:var(--fs-label);color:var(--faint);
             line-height:1;white-space:nowrap}

/* Wind card backdrop: a tree that leans and rustles with the real wind. */
.card{position:relative}
.tree{
  position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);
  width:min(76cqw,60cqh,26rem);aspect-ratio:200/220;
  opacity:.42;pointer-events:none;z-index:0;
}
.tree svg{width:100%;height:100%;display:block}

/* The storm behind the Lightning card: rings at 5, 10, 20 and 30 miles with
   you at the middle of the bottom edge, and a cloud sitting on the ring that
   matches the nearest recent strike. The rings keep their shape whatever the
   card's proportions, so a distance read off one is honest. */
.stormsky{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
/* The rings live in the card's spare middle, clear of the hero above and the
   figures below; only the flash covers the whole card. */
.stormsky .band{position:absolute;left:0;right:0;top:42%;bottom:13%}
.stormsky svg{width:100%;height:100%;display:block}
.stormsky .bolt{animation:boltflash var(--flash,6s) steps(1,end) infinite}
@keyframes boltflash{
  0%,4%{opacity:1} 5%,9%{opacity:.15} 10%,14%{opacity:1} 15%,100%{opacity:.15}
}
/* A strike close by lights the whole card for an instant. Faint, brief, and
   never on a display that has asked for less motion. */
.stormsky .sheet{
  position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 100%,
    rgba(245,197,24,.20), rgba(245,197,24,.06) 45%, transparent 70%);
  opacity:0;animation:sheetflash var(--flash,6s) steps(1,end) infinite;
}
@keyframes sheetflash{
  0%,3%{opacity:1} 4%,8%{opacity:.25} 9%,12%{opacity:.9} 13%,100%{opacity:0}
}
@media (prefers-reduced-motion:reduce){
  .stormsky .bolt,.stormsky .sheet{animation:none}
  .stormsky .sheet{opacity:0}
}

/* Rain falling behind the Rainfall card while it is actually raining — the
   tree's idea again: the picture says it before the number does. Drops are
   plain elements, not SVG, and the duck and the ark are images, all inside
   a box that clips to the card, so nothing can paint outside it. Every
   animation takes its phase from the clock (a negative delay), because the
   card is rebuilt every two seconds and would otherwise restart the rain. */
.rainsky{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.rainsky .drop{
  position:absolute;top:-12cqh;display:block;width:max(1px,.3cqw);height:var(--len);
  border-radius:1px;
  background:linear-gradient(to bottom,rgba(150,215,255,0),rgba(150,215,255,var(--op)));
  transform:rotate(var(--rot));
  animation:rainfall var(--dur) linear infinite;animation-delay:var(--delay);
}
@keyframes rainfall{
  from{transform:translate(0,0) rotate(var(--rot))}
  to{transform:translate(var(--dx),124cqh) rotate(var(--rot))}
}
/* Hail falls, bounces once off the bottom of the card, and melts away. */
.rainsky .drop.hail{
  width:1.1cqh;height:1.1cqh;border-radius:50%;
  background:rgba(235,245,255,.8);animation-name:hailfall;
}
@keyframes hailfall{
  0%{transform:translate(0,0);opacity:1}
  80%{transform:translate(calc(var(--dx)*.8),108cqh)}
  88%{transform:translate(calc(var(--dx)*.85),103cqh)}
  96%{transform:translate(calc(var(--dx)*.9),108cqh);opacity:.8}
  100%{transform:translate(calc(var(--dx)*.9),108cqh);opacity:0}
}
/* Pouring: a puddle along the bottom, and something floating on it. */
.rainscene{position:absolute;left:0;right:0;bottom:0;height:var(--water)}
.rainscene .water{position:absolute;left:0;right:0;top:2.2cqh;bottom:0;
                  background:rgba(0,188,212,.26)}
.rainscene .waves{position:absolute;left:0;right:0;top:0;height:2.4cqh;
                  background-repeat:repeat-x;background-size:6cqh 100%;
                  animation:waves 3s linear infinite}
@keyframes waves{to{background-position-x:6cqh}}
/* See-through, like the tree: the duck floats right behind the bottom row of
   figures, and grey text on solid yellow did not read. */
.rainscene .floater{position:absolute;left:0;height:var(--fh);opacity:.6;
                    bottom:calc(100% - var(--fh) * var(--sink));
                    animation:bob 2.6s ease-in-out infinite}
@keyframes bob{
  0%,100%{transform:translateY(0) rotate(-3deg)}
  50%{transform:translateY(-.9cqh) rotate(3deg)}
}
.rainscene .duck{--fh:min(15cqh,17cqw);--sink:.3;left:62%}
.rainscene .sail{position:absolute;left:0;top:0;bottom:0;width:0;
                 animation:sail 48s linear infinite}
@keyframes sail{from{left:-42%}to{left:104%}}
.rainscene .ark{--fh:min(28cqh,22cqw);--sink:.24}
/* Snow drifts rather than falls: slow, swaying, pushed a long way sideways
   by wind that would barely bend rain. */
.rainsky .flake{
  position:absolute;top:-6cqh;display:block;width:var(--size);height:var(--size);
  border-radius:50%;background:rgba(245,248,255,var(--op));
  animation:snowfall var(--dur) linear infinite;animation-delay:var(--delay);
}
@keyframes snowfall{
  0%{transform:translate(0,0)}
  25%{transform:translate(calc(var(--dx)*.25 + var(--sway)),31cqh)}
  50%{transform:translate(calc(var(--dx)*.5),62cqh)}
  75%{transform:translate(calc(var(--dx)*.75 - var(--sway)),93cqh)}
  100%{transform:translate(var(--dx),124cqh)}
}
/* Freezing rain: paler drops, and icicles along the top of the card that
   catch the light now and then. */
.rainsky .drop.icy{
  background:linear-gradient(to bottom,rgba(225,242,255,0),rgba(225,242,255,var(--op)));
}
.rainsky .icicles{position:absolute;left:0;top:0;width:100%;height:4.5cqh;opacity:.6}
.rainsky .icicles .glint{animation:glint 2.6s ease-in-out infinite}
@keyframes glint{0%,100%{opacity:0}50%{opacity:1}}
/* A snowbank along the bottom, for the snowman to stand in and the yeti to
   wade through. */
.snowscene{position:absolute;left:0;right:0;bottom:0;height:var(--drift)}
.snowscene .bank{position:absolute;left:0;right:0;top:2cqh;bottom:0;
                 background:rgba(236,242,250,.2)}
.snowscene .crest{position:absolute;left:0;right:0;top:0;height:2.2cqh;
                  background-repeat:repeat-x;background-size:16cqh 100%}
/* Heavy snow: the snowman builds himself — base, middle, head, then the hat,
   scarf, carrot and arms — stands a while, and melts back to start again. */
.snowman{position:absolute;left:58%;bottom:calc(100% - 3cqh);
         height:min(34cqh,28cqw);width:auto;opacity:.78}
.snowman g{transform-box:fill-box;transform-origin:50% 100%;
           animation-duration:24s;animation-timing-function:ease-out;
           animation-iteration-count:infinite}
.snowman .sm-base{animation-name:smBase}
.snowman .sm-mid{animation-name:smMid}
.snowman .sm-head{animation-name:smHead}
.snowman .sm-dress{animation-name:smDress}
@keyframes smBase{0%{transform:scale(0)}8%,92%{transform:scale(1)}100%{transform:scale(0)}}
@keyframes smMid{0%,8%{transform:scale(0)}16%,92%{transform:scale(1)}100%{transform:scale(0)}}
@keyframes smHead{0%,16%{transform:scale(0)}24%,92%{transform:scale(1)}100%{transform:scale(0)}}
@keyframes smDress{0%,24%{opacity:0}32%,92%{opacity:1}100%{opacity:0}}
/* A blizzard: a yeti in a scarf trudges across, the way the ark sails. */
.snowscene .sail{position:absolute;left:0;top:0;bottom:0;width:0;
                 animation:sail 36s linear infinite}
.snowscene .yeti{position:absolute;left:0;height:var(--fh);opacity:.7;
                 --fh:min(34cqh,26cqw);bottom:calc(100% - var(--fh) * .1);
                 animation:trudge .9s ease-in-out infinite}
@keyframes trudge{
  0%,100%{transform:translateY(0) rotate(-4deg)}
  50%{transform:translateY(-.8cqh) rotate(4deg)}
}
@media (prefers-reduced-motion:reduce){
  .rainsky .drop,.rainsky .flake{display:none}
  .rainscene *,.snowscene *,.snowman g,.rainsky .icicles *{animation:none!important}
  .rainscene .sail,.snowscene .sail{left:30%}
}

/* /testall says what it is showing, so no one takes a preview for weather. */
#testtag{display:none}
/* In the middle of the footer, which is empty on a wide screen, so it covers
   no card; a phone's footer is full, so there it sits at the top instead. */
body.testall #testtag{
  display:block;position:fixed;bottom:max(10px,env(safe-area-inset-bottom));left:50%;
  transform:translateX(-50%);z-index:50;white-space:nowrap;border:0;
  cursor:pointer;font-family:inherit;-webkit-tap-highlight-color:transparent;
  padding:.35em .9em;border-radius:999px;font-size:clamp(12px,1.1vw,20px);
  font-weight:600;letter-spacing:.06em;color:var(--bg);background:var(--accent);
  box-shadow:0 2px 12px rgba(0,0,0,.4);
}
body.testall #testtag:hover{filter:brightness(1.12)}
/* Wider on the TV for a remote's pointer, but no taller: any taller and it
   rises out of the footer onto the cards. */
body.tv.testall #testtag{padding-inline:1.6em}
@media (max-width:720px){
  body.testall #testtag{bottom:auto;top:max(8px,env(safe-area-inset-top))}
}

/* The rain gauge behind the Rainfall card. Cold blue, kept faint: it is a
   backdrop to read the figures against, not a thing to look at. */
.rainfill{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.rainfill .level{
  position:absolute;left:0;right:0;bottom:0;
  background:linear-gradient(to top,rgba(0,188,212,.28),rgba(0,188,212,.07));
  border-top:1px solid rgba(0,188,212,.5);
  transition:height .8s ease-out;
}
/* The band between what fell and what normally falls. A hairline is the
   wrong encoding for a wall display — one pixel of grey on blue measured
   1.6:1, against a floor of 3:1 — so the difference is an area instead,
   and its size is how far off normal you are. Blue above, and a dry warm
   tint for the shortfall below, in the empty card the water never reached. */
.rainfill .gap{position:absolute;left:0;right:0;transition:all .8s ease-out}
.rainfill .gap.over{background:rgba(0,188,212,.34)}
  /* Fading upward, the way the water itself is drawn. A flat slab of
     amber over the blue read as mud rather than as absence. */
.rainfill .gap.under{
  background:linear-gradient(to top,rgba(255,171,64,.20),rgba(255,171,64,.03));
}
.rainfill .pace{
  position:absolute;left:0;right:0;
  border-top:2px dashed rgba(232,234,237,.6);   /* 6.2:1 on card, 5.3:1 on blue */
  transition:bottom .8s ease-out;
}
.tree .crown{transform-origin:50% 88%;animation:sway var(--sway,6s) ease-in-out infinite}
.tree .crown .leafA{transform-origin:50% 88%;animation:sway calc(var(--sway,6s)*.72) ease-in-out infinite}
@keyframes sway{
  0%,100%{transform:rotate(calc(var(--lean,2deg) * -1))}
  50%    {transform:rotate(var(--lean,2deg))}
}
/* The Pollen card's face fills whatever space the card has going spare —
   it is the middle spacer, so it shrinks with the card instead of covering it.
   A little more present than the wind card's tree, which has to sit behind
   the numbers; this one has its own room. */
.pollenface{opacity:.55;pointer-events:none;overflow:hidden}
.pollenface svg{height:100%;width:auto;max-width:100%;display:block}
/* Pivot at the neck, so the sneeze throws the head rather than sliding it.
   Almost all of the cycle is spent still: it is punctuation, not a fidget. */
.pollenface .head{
  transform-origin:50% 82%;
  animation:achoo var(--achoo,14s) ease-in-out infinite;
}
.pollenface.calm .head{animation:none}
@keyframes achoo{
  0%,86%,100%{transform:rotate(0deg) translateY(0)}
  90%        {transform:rotate(-7deg) translateY(-4px)}
  94%        {transform:rotate(9deg)  translateY(5px)}
  97%        {transform:rotate(-2deg) translateY(1px)}
}
@media (prefers-reduced-motion:reduce){
  .tree .crown,.tree .crown .leafA{animation:none}
  .pollenface .head{animation:none}
}
.card-body,.card-head{position:relative;z-index:1}

.badge{
  display:inline-block;padding:.1em .5em;border-radius:4px;
  font-size:var(--fs-label);font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;line-height:1.5;
}
.body-sun{
  width:.95em;height:.95em;border-radius:50%;background:var(--yellow);
  box-shadow:0 0 0 .5em color-mix(in srgb, var(--yellow) 16%, transparent),
             0 0 1.4em color-mix(in srgb, var(--yellow) 45%, transparent);
}
.body-moon{width:.62em;height:.62em;border-radius:50%;background:var(--muted);opacity:.85}
/* forecast card */
.fc-now{text-align:center;flex:0 0 auto}
.fc-cond{font-size:var(--fs-value-sm);font-weight:600;color:var(--muted)}
.fc-line{display:flex;align-items:center;justify-content:center;gap:.25em;
         line-height:1}
.fc-line .wi{font-size:calc(var(--fs-hero)*.62)}
.fc-temp{font-size:var(--fs-hero);font-weight:700;letter-spacing:-.02em}
.fc-unit{font-size:var(--fs-unit);font-weight:500;color:var(--label);
         align-self:flex-start;margin-top:.35em}
.fc-strip{display:flex;gap:calc(var(--gap)*.75);flex:0 0 auto}
.fc-day{
  flex:1;min-width:0;text-align:center;background:var(--inset);
  border:1px solid var(--inset-edge);border-radius:var(--inset-radius);
  padding:clamp(.15rem,1.2cqh,.5rem) .2rem;
  display:flex;flex-direction:column;align-items:center;gap:.1em;
}
.fc-day .k{font-size:var(--fs-label);font-weight:600;letter-spacing:.085em;
           text-transform:uppercase;color:var(--label)}
.fc-ico .wi{font-size:calc(var(--fs-value)*1.25);color:var(--muted)}
.fc-hl{font-size:var(--fs-value-sm);font-weight:600;white-space:nowrap}
.fc-hl .sep{color:var(--faint);margin:0 .18em}
.fc-pop{font-size:var(--fs-label);color:var(--cold);min-height:1em}
.moonrow{display:flex;align-items:center;justify-content:space-around;gap:.6em;
         flex:0 0 auto}
#card-sky .card-body{gap:clamp(1px,.8cqh,6px)}
#card-sky .mid.arc{min-height:clamp(40px,20cqh,190px)}
.moonrow .item{display:flex;flex-direction:column;align-items:center;gap:.1em}
.moonrow .k{font-size:var(--fs-label)}
.moonrow .t{font-size:var(--fs-value-sm);font-weight:600;color:var(--muted)}
.phase{display:flex;align-items:center;justify-content:center;gap:.45em}
.phase svg{width:1.15em;height:1.15em;flex:0 0 auto}
.corners{display:flex;justify-content:space-between;flex:0 0 auto;font-size:var(--fs-label);
         color:var(--faint);letter-spacing:.06em;text-transform:uppercase}
.headicon{margin-left:auto;display:flex;align-items:center;gap:.5em}
.headicon svg{width:1.1em;height:1.1em;color:var(--label)}
.ribbon{position:relative;width:100%;height:2.9em;flex:0 0 auto;overflow:hidden}
.ribbon .strip{
  position:absolute;inset:0;width:100%;
  transform:translate3d(calc(50% - var(--shift,0%)),0,0);
  will-change:transform;
}
.ribbon .base{position:absolute;left:-200%;right:-200%;bottom:.45em;height:1px;
              background:var(--rule)}
.ribbon .tick{position:absolute;bottom:.45em;width:1px;background:var(--rule)}
.ribbon .tick.major{height:.6em;background:var(--muted)}
.ribbon .tick.mid{height:.36em;background:var(--rule)}
.ribbon .tick.minor{height:.2em;opacity:.65}
.ribbon .lab{position:absolute;top:0;transform:translateX(-50%);
             font-size:var(--fs-value-sm);font-weight:700;color:var(--faint)}
.ribbon .lab.near{color:var(--text)}
.ribbon .mark{position:absolute;left:50%;bottom:.05em;transform:translateX(-50%);
              width:0;height:0;border-left:.42em solid transparent;
              border-right:.42em solid transparent;
              border-bottom:.42em solid var(--accent)}
.mid{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.mid.trace{flex:0 1 auto;height:clamp(52px,28cqh,155px);min-height:0}
/* Temperature has no slot of its own to swap into, so its trace takes the
   room going spare and no more — the lesson from the Pollen face, where
   reasoning about space rather than letting flex hand it over produced an
   overlap. The cap stops it ballooning on a tall phone card. */
.mid.temptrace{max-height:clamp(40px,20cqh,120px)}
.mid.arc{flex:1 1 auto;min-height:0}

footer{
  flex:0 0 auto;display:flex;align-items:center;gap:14px;white-space:nowrap;
  padding:6px calc(var(--pad)*.6) 2px;
  font-size:clamp(11px,.95vw,15px);
  border-top:1px solid var(--card-edge);
}
footer .clock{font-weight:700;font-size:1.5em}
footer .date{color:var(--label)}
footer .spacer{flex:1}
/* min-width:0 matters: without it a nowrap flex item cannot shrink below
   its text, so the long status line pushed the buttons off the edge. */
footer .meta{color:var(--faint);white-space:nowrap;overflow:hidden;
             text-overflow:ellipsis;min-width:0;flex:0 1 auto}
footer .controls{display:flex;gap:6px;flex:0 0 auto;margin-left:auto}
footer button{
  background:none;border:1px solid var(--card-edge);color:var(--label);
  border-radius:6px;padding:.25em .6em;font:inherit;font-size:.9em;
  cursor:pointer;
}
footer button:hover{color:var(--text)}
body.tv footer .controls{display:none}
/* Read from a couch: everything steps up, not just the hero. */
body.tv{
  --fs-hero:clamp(3rem,6.6vw,7rem);
  --fs-unit:clamp(1rem,1.9vw,2.2rem);
  --fs-value:clamp(1.1rem,2vw,2.4rem);
  --fs-value-sm:clamp(.95rem,1.45vw,1.8rem);
  --fs-title:clamp(.75rem,1.05vw,1.3rem);
  --fs-label:clamp(.7rem,.95vw,1.2rem);
}

/* Weather map. The iframe is only created the first time it is opened, so
   nothing contacts a third party until you ask for it. */
#map{display:none;flex:1 1 auto;min-height:min(60dvh,420px);
     border-radius:var(--radius);overflow:hidden;
     border:1px solid var(--card-edge);background:var(--card)}
#map iframe{width:100%;height:100%;border:0;display:block}
#map .placeholder{display:flex;height:100%;align-items:center;
                  justify-content:center;color:var(--label);
                  font-size:clamp(12px,1.1vw,16px);text-align:center;padding:2em}
body.show-map #grid{display:none}
body.show-map #map{display:block}

/* Native cross-fade between the two states — no library, no keyframable
   JS. Browsers without the View Transitions API just swap instantly. */
@keyframes vt-out{to{opacity:0;transform:scale(.97)}}
@keyframes vt-in{from{opacity:0;transform:scale(1.03)}}
@media (prefers-reduced-motion:no-preference){
  ::view-transition-old(root){animation:vt-out .28s cubic-bezier(.4,0,.2,1) both}
  ::view-transition-new(root){animation:vt-in .36s cubic-bezier(.4,0,.2,1) both}
}
@media (prefers-reduced-motion:reduce){
  ::view-transition-old(root),::view-transition-new(root){animation:none}
}

#alerts{display:none;flex-direction:column;gap:6px}
#alerts.show{display:flex}
.alert{
  padding:.5em .9em;border-radius:var(--inset-radius);
  font-size:clamp(12px,1.05vw,17px);font-weight:600;
  border:1px solid currentColor;display:flex;gap:.6em;align-items:baseline;
  justify-content:center;flex-wrap:wrap;row-gap:.15em;
}
/* On a phone the line wraps, centred, rather than cut the end time off —
   that was the whole complaint. Only a part wider than a line on its own
   gets an ellipsis, the office before the time; the event name never does. */
.alert .ev{text-transform:uppercase;letter-spacing:.06em;flex:0 0 auto;white-space:nowrap}
.alert .hl{font-weight:400;opacity:.85;overflow:hidden;text-overflow:ellipsis;
           white-space:nowrap;min-width:0;flex:0 1 auto}
.alert .src{font-weight:400;opacity:.6;overflow:hidden;text-overflow:ellipsis;
            white-space:nowrap;min-width:0;flex:0 1000 auto}
/* Extreme is filled, not outlined: at TV distance a tornado warning must not
   read as the same thing as a small-craft advisory. */
.alert.sev-extreme{color:var(--bg);background:var(--red);border-color:var(--red);
                   animation:alertpulse 2s ease-in-out infinite}
.alert.sev-extreme .hl{opacity:.92}
.alert.sev-severe{color:var(--red)}
.alert.sev-moderate{color:var(--accent)}
.alert.sev-minor{color:var(--yellow)}
.alert.sev-unknown{color:var(--muted)}
@keyframes alertpulse{50%{opacity:.72}}
@media (prefers-reduced-motion:reduce){.alert.sev-extreme{animation:none}}
body.tv .alert{font-size:clamp(15px,1.5vw,26px)}

/* ── Burn-in mitigation ──────────────────────────────────────────────
   This page is meant to sit on a TV for months, and a static layout with
   bright fixed numbers is exactly what damages an OLED. The whole app drifts
   through a few pixels on a slow cycle — far too slow to notice while
   reading, but enough that no pixel holds the same value indefinitely. The
   period is deliberately not a round number so it never syncs with the
   2-second refresh. */
@keyframes drift{
  0%   {transform:translate(0,0)}
  25%  {transform:translate(var(--drift),calc(var(--drift) * -.6))}
  50%  {transform:translate(calc(var(--drift) * .3),var(--drift))}
  75%  {transform:translate(calc(var(--drift) * -1),calc(var(--drift) * .4))}
  100% {transform:translate(0,0)}
}
:root{--drift:4px}
#app{animation:drift 617s ease-in-out infinite;will-change:transform}
/* A TV sits further away and runs hotter, so give it more room to move and
   pull the peak luminance back a little — both reduce the risk. */
body.tv{--drift:8px}
body.tv #app{filter:brightness(.92)}
body.no-drift #app{animation:none}

#settings{display:none;flex:1;min-height:0;overflow:auto;padding:4px 2px}
/* ── Ten-day outlook ─────────────────────────────────────────────────────
   One card the size of the whole grid, built from the same pieces as the
   six small ones: the Forecast card's day strip, stretched to all ten days,
   under a range plot drawn the way the Temperature trace is. It fills the
   page because it IS a card — the type sizes against it like any other. */
/* The Internet page: the same idea as the ten-day outlook — one card the size
   of the grid — but its week of tests is fetched when the page is opened
   rather than ridden along with every snapshot. */
#netpage{display:none;flex:1;min-height:0}
body.show-net #grid{display:none}
body.show-net #netpage{display:flex}
#netpage .card{flex:1;min-width:0}
#netpage .netplots{flex:1 1 auto;min-height:42cqh;display:flex;flex-direction:column;
                   gap:clamp(4px,1.4cqh,14px)}
#netpage .card-body > .row{flex:0 0 auto}
/* Labels ride over the plot, so they need a little card behind them or the
   lines run through the text. */
#netpage .netplot .ax,#netpage .netplot .tag{background:var(--card);padding:0 .3em;
                                             border-radius:3px}
#netpage .netplot{position:relative;flex:1 1 0;min-height:0}
#netpage .netplot .ax{position:absolute;left:.4em;font-size:var(--fs-label);
                      color:var(--faint);line-height:1;white-space:nowrap}
#netpage .netplot .ax.hi{top:.2em} #netpage .netplot .ax.lo{bottom:.2em}
#netpage .netplot .ax.mid{top:50%;transform:translateY(-50%)}
#netpage .netplot .tag{position:absolute;right:.4em;top:.2em;
                       font-size:var(--fs-label);letter-spacing:.06em;
                       text-transform:uppercase;color:var(--label)}
/* The recent tests, one per row: what the card cannot show and the tracker
   shows too slowly to glance at. */
#netpage .tests{flex:0 1 auto;min-height:0;overflow:hidden;display:flex;
                flex-direction:column;gap:2px;font-size:var(--fs-label)}
#netpage .tests .row{display:grid;grid-template-columns:auto 1fr 1fr 1fr 1fr auto;
                     gap:.6em;align-items:baseline;padding:.15em .4em;
                     border-radius:var(--inset-radius)}
#netpage .tests .row.head{color:var(--label);letter-spacing:.06em;
                          text-transform:uppercase}
#netpage .tests .row.bad{background:color-mix(in srgb,var(--red) 12%,transparent)}
#netpage .tests .row .n{text-align:right;font-variant-numeric:tabular-nums}
#netpage .tests .row a{color:var(--label);text-decoration:none}
#netpage .tests .row a:hover{color:var(--accent)}
body.tv #netpage .tests .row a{display:none}
@media (max-width:720px){
  #netpage{display:block;flex:none;overflow:auto;-webkit-overflow-scrolling:touch}
  body.show-net #netpage{display:block}
  #netpage .card{container-type:inline-size;min-height:100%;overflow:visible}
  #netpage .netplot{flex:0 0 auto;height:clamp(120px,22dvh,220px)}
  /* Six columns will not fit a phone: the middle four carry the reading. */
  #netpage .tests .row{grid-template-columns:auto 1fr 1fr 1fr}
  #netpage .tests .row .drop,#netpage .tests .row a{display:none}
}

#outlook{display:none;flex:1;min-height:0}
body.show-outlook #grid{display:none}
body.show-outlook #outlook{display:flex}
#outlook .card{flex:1;min-width:0}
/* The plot takes whatever the strip leaves. */
#outlook .outplot{position:relative;flex:1 1 auto;min-height:0}
#outlook .outplot .ax{
  position:absolute;left:.4em;font-size:var(--fs-label);color:var(--faint);
  line-height:1;white-space:nowrap;letter-spacing:.06em;
}
#outlook .outplot .ax.norm{color:var(--label);transform:translateY(.2em)}
#outlook .outplot .ax.norm.above{transform:translateY(calc(-100% - .2em))}
#outlook .outplot .ax.norm.end{left:auto;right:.4em}
/* Ten across is a lot of columns. The high/low pair is the widest thing in
   each one, so it is capped by the card's width as well as the usual size —
   a 1280-wide screen gives each day 128px, and two three-digit figures
   at full size do not fit that. */
#outlook .fc-strip{flex:0 0 auto}
#outlook .fc-day{gap:.18em;padding-block:clamp(.3rem,1.6cqh,.9rem)}
#outlook .fc-day .date{font-size:calc(var(--fs-label)*.9);color:var(--faint);
                       white-space:nowrap}
#outlook .fc-ico .wi{font-size:min(calc(var(--fs-value)*1.35),4.2cqw)}
#outlook .fc-hl{font-size:min(var(--fs-value-sm),1.65cqw)}
#outlook .fc-day.today{border-color:var(--accent);background:
  color-mix(in srgb,var(--accent) 7%,var(--inset))}
#outlook .fc-day.today .k{color:var(--text)}
@media (max-width:720px){
  /* A phone cannot show ten columns, so each day turns sideways into a
     row — and the rows are made readable rather than made to fit, with
     the card scrolling inside its screen. That needs the card to grow with
     its content, which container-type:size forbids (height only ever comes
     from being stretched), so this one card contains inline-size only. Its
     cqh-based type then resolves against the viewport instead, and the
     cqw cap in every phone size keeps that from mattering. */
  /* flex:none, or flex-basis 0 in the auto-height phone #app lets the box
     size to its content and the whole page scrolls instead of the card. */
  #outlook{display:block;flex:none;overflow:auto;-webkit-overflow-scrolling:touch}
  body.show-outlook #outlook{display:block}
  #outlook .card{container-type:inline-size;min-height:100%;overflow:visible}
  #outlook .card-body{justify-content:flex-start;gap:clamp(6px,1.4dvh,14px)}
  #outlook .outplot{flex:0 0 auto;height:clamp(130px,26dvh,240px)}
  #outlook .fc-strip{flex-direction:column;gap:calc(var(--gap)*.75)}
  /* Day over date in one column: side by side, the two plus a full-size
     high/low overran a 375px row and the fit pass shrank everything to
     make it fit — the opposite of what the rows are for. */
  #outlook .fc-day{
    display:grid;grid-template-columns:4.2em auto 1fr auto;
    grid-template-rows:auto auto;column-gap:.6em;row-gap:0;
    align-items:center;padding:.5em .7em;text-align:left;
  }
  #outlook .fc-day .k{grid-area:1/1;font-size:var(--fs-label);align-self:end}
  #outlook .fc-day .date{grid-area:2/1;font-size:var(--fs-label);align-self:start}
  #outlook .fc-ico{grid-area:1/2/3/3}
  #outlook .fc-ico .wi{font-size:calc(var(--fs-value)*1.2)}
  #outlook .fc-hl{grid-area:1/3/3/4;font-size:calc(var(--fs-value)*.9);text-align:center}
  #outlook .fc-pop{grid-area:1/4/3/5;font-size:var(--fs-label);text-align:right;
                   min-width:2.6em}
  #outlook .caption{padding-bottom:.4em}
}
/* Records card: the whole span the station has ever seen, with this month
   and today marked on it. */
/* Everything inside is sized in em, which inherits the body's font size
   and so ignored the fit pass entirely: on a short card the type shrank
   to the 0.6 floor around a gauge that never moved, and the card
   overflowed anyway. Tying its font size to --fit makes the whole block
   shrink with the rest. */
.gauge-span{position:relative;width:100%;padding:.2em 0 1.5em;
            font-size:calc(1em*var(--fit))}
.gauge-span .track{
  position:relative;height:.9em;border-radius:.45em;overflow:hidden;
  background:linear-gradient(90deg,#2f6fd0 0%,#00bcd4 22%,#66bb6a 42%,
             #f5c518 62%,#ff8837 80%,#ff5252 100%);
  opacity:.85;
}
.gauge-span .month{
  position:absolute;top:-.18em;bottom:-.18em;border-radius:.5em;
  border:2px solid var(--text);opacity:.55;
}
.gauge-span .now{
  position:absolute;top:-.45em;width:0;height:0;
  border-left:.42em solid transparent;border-right:.42em solid transparent;
  border-top:.5em solid var(--text);transform:translateX(-50%);
}
.gauge-span .nowlab{
  position:absolute;top:1.15em;transform:translateX(-50%);white-space:nowrap;
  font-size:var(--fs-label);font-weight:700;color:var(--text);
}
.gauge-span .end{
  position:absolute;top:1.15em;font-size:var(--fs-label);color:var(--label);
}
.gauge-span .end.lo{left:0} .gauge-span .end.hi{right:0}

body.show-settings #grid{display:none}
body.show-settings #settings{display:block}
.sheet{
  max-width:640px;margin:0 auto;background:var(--card);
  border:1px solid var(--card-edge);border-radius:var(--radius);
  padding:clamp(14px,2vw,26px);
}
.sheet h2{font-size:clamp(13px,1.2vw,18px);font-weight:600;letter-spacing:.09em;
          text-transform:uppercase;color:var(--label);margin-bottom:.8em}
.sheet h2:not(:first-child){margin-top:1.6em}
.sheet p.note{font-size:clamp(11px,1vw,14px);color:var(--label);
              margin:-.4em 0 1em;line-height:1.5}
.cardlist{display:flex;flex-direction:column;gap:6px}
.cardrow{
  display:flex;align-items:center;gap:.7em;padding:.55em .7em;
  background:var(--inset);border:1px solid var(--inset-edge);
  border-radius:var(--inset-radius);cursor:grab;
  font-size:clamp(12px,1.1vw,16px);
}
.cardrow.drag-over{border-color:var(--accent)}
.cardrow.dragging{opacity:.4}
.cardrow .grip{color:var(--faint);letter-spacing:.15em;cursor:grab}
.cardrow .nm{flex:1;text-transform:capitalize}
.cardrow input{width:1.05em;height:1.05em;accent-color:var(--accent)}
.sheet .row{display:flex;gap:.6em;align-items:center;flex-wrap:wrap}
.sheet input[type=password],.sheet input[type=text]{
  flex:1;min-width:220px;background:var(--inset);color:var(--text);
  border:1px solid var(--inset-edge);border-radius:var(--inset-radius);

}
.sheet button{
  background:var(--inset);color:var(--text);border:1px solid var(--inset-edge);
  border-radius:var(--inset-radius);padding:.55em 1.1em;font:inherit;
  font-size:clamp(12px,1.1vw,16px);cursor:pointer;
}
.sheet button.primary{background:var(--accent);color:#101014;border-color:transparent;
                      font-weight:600}
.sheet button:hover{border-color:var(--accent)}
.state{font-size:clamp(11px,1vw,14px);color:var(--label);min-height:1.4em}
.state.ok{color:var(--green)} .state.bad{color:var(--red)}
.card[draggable="true"]{cursor:grab}
.card.dragging{opacity:.45;outline:2px dashed var(--accent)}
.card.drop-target{outline:2px solid var(--accent)}

#banner{
  display:none;padding:.5em 1em;border-radius:var(--inset-radius);
  background:var(--card);border:1px solid var(--red);color:var(--red);
  font-size:var(--fs-value-sm);text-align:center;
}
#banner.show{display:block}


/* ── Phones. Last in the sheet deliberately: these override the card
   defaults above, which are declared at the same specificity. ── */
@media (max-width:720px){
  /* One card per screen.
     This must be dvh, not svh. svh is the viewport with the toolbars SHOWN,
     so the moment Safari collapses its address bar on a downward scroll the
     screen grows, every card is suddenly shorter than it, and the next one
     appears alongside. Scroll back up, the toolbar returns and it looks
     right again — which is exactly the asymmetry that gave this away.
     dvh tracks the live viewport, so the two stay in step. vh is declared
     first as the fallback for browsers without dvh. */
  /* Only ONE element may scroll, and it must be the one carrying the
     snap. Declaring overflow on both html and body left the snap on a
     element that was not the scroller, so nothing ever snapped. */
  html{height:auto;overflow-y:auto;scroll-snap-type:y mandatory;
       -webkit-overflow-scrolling:touch}
  body{height:auto;overflow:visible;scroll-snap-type:y mandatory}
  #app{height:auto;min-height:100vh;min-height:100dvh}
  /* One card per screen, exactly.
     The footer is sticky, so it overlays the bottom --chrome pixels of the
     viewport. A card is therefore given (screen - footer - gap), which makes
     card + gap land precisely on the next screen: the following card starts
     exactly where the footer begins, so it is never left peeking. */
  #app{padding-top:0;padding-bottom:0}
  #grid{
    grid-template-columns:1fr !important;
    grid-template-rows:none !important;
    grid-auto-rows:calc(100vh - var(--chrome) - var(--gap));
    grid-auto-rows:calc(100dvh - var(--chrome) - var(--gap));
    gap:var(--gap);
    padding:0;
  }
  html{scroll-padding-top:0}
  /* --chrome is measured at runtime from the real footer, because Safari's
     toolbars make any guess wrong on some device or other. */
  :root{--chrome:4.6rem}
  .card{scroll-snap-align:start;scroll-snap-stop:always}

  /* A phone card is narrow but nearly a screen tall. Sizing type mostly by
     width leaves the middle stranded in empty space, so lean on width much
     harder here and spread the rows out to fill. */
  .card{
    --fs-hero:calc(clamp(2.6rem,min(21cqh,27cqw),5.5rem)*var(--fit));
    --fs-unit:calc(clamp(1rem,min(6.5cqh,8cqw),2rem)*var(--fit));
    --fs-value:calc(clamp(1rem,min(6.5cqh,8.5cqw),2rem)*var(--fit));
    --fs-value-sm:calc(clamp(.9rem,min(5cqh,6.4cqw),1.7rem)*var(--fit));
    --fs-title:calc(clamp(.7rem,min(3.6cqh,4.2cqw),1.15rem)*var(--fit));
    --fs-label:calc(clamp(.7rem,min(3.6cqh,4.2cqw),1.15rem)*var(--fit));
  }
  .card-body{justify-content:space-evenly;gap:clamp(4px,1.6cqh,18px)}
  .mid{min-height:0}

  /* The sub-lines in a two-column row ran into each other: a flex child
     will not shrink below its content unless told to. */
  .cell{min-width:0;padding-inline:.3em}
  /* Only the sub-line may be clipped. A truncated label ("FE…") tells you
     nothing, and a truncated value is worse than a smaller one. */
  .cell .sub{max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .cell .k,.cell .v{overflow:visible;text-overflow:clip}

  /* Four columns is one more than a phone card has room for, and the internet
     card is the only one that asks for it. At full size the first cell's label
     and its value both cross the divider into the next. Trim the type for that
     row rather than the words — a shorter label would have to lose meaning,
     and this is narrow screens only, so the wall display keeps its full size. */
  .row.n4 .k{font-size:calc(var(--fs-label)*.88)}
  .row.n4 .v{font-size:calc(var(--fs-value-sm)*.88)}

  /* Three label/value pairs will not sit side by side on a phone, so stack
     each pair instead of shrinking them into ellipsis. */
  .row.n3 .cell.inline{flex-direction:column;gap:.08em}
  .row.n3 .cell.inline .k{font-size:calc(var(--fs-label)*.9)}

  /* A phone card is tall, and a growing plot would take half the screen with
     most of it empty axis. Cap it and let the figures below have the room. */
  .card-body > .netplot{flex:0 0 auto;height:clamp(140px,30cqh,320px)}

  /* Summary lines are long. On a narrow card let them wrap rather than
     truncate — there is plenty of height to spare. */
  .caption{white-space:normal;overflow:visible;line-height:1.35}

  /* The tree was drawn for a wide desktop card; at this width it swallowed
     the compass and the readout. */
  .tree{width:min(46cqw,24cqh);opacity:.24;top:56%}

  /* Keep the flexible middle from opening a canyon between the rows. */
  .mid{flex:0 1 auto}
  .mid.arc,#card-sky .mid.arc{flex:1 1 auto;min-height:clamp(56px,16cqh,150px)}
  .ribbon{height:3.4em}
  footer{position:sticky;bottom:0;background:var(--bg);z-index:5}
  #map,#settings,#outlook{height:calc(100vh - var(--chrome) - var(--gap));
                          height:calc(100dvh - var(--chrome) - var(--gap));
                          min-height:320px}
  /* iOS 26 Safari draws its address bar over the top of the page, see-through,
     and snapping to the first card left the banner just above it: blurred
     behind the glass, where no one reads it. The bottom of the screen is
     proven visible — the footer lives there — so on a phone the alerts sit
     directly above the footer, sticky, on every card rather than only the
     first. order moves them without touching the markup; measureChrome()
     counts them into --chrome, so a card still fills exactly one screen. */
  #alerts{order:1;position:sticky;bottom:var(--foot,0px);z-index:5;
          background:var(--bg);padding-bottom:6px}
  footer{order:2}

  /* No room for everything on a 360px footer. Keep the clock, the health
     dot, the station and the buttons; drop the long status string, which is
     the one thing repeated elsewhere on the cards. */
  footer{gap:8px}
  footer #meta{display:none}
  footer .date{overflow:hidden;text-overflow:ellipsis}
  footer .clock{font-size:1.25em}
  footer button{padding:.3em .45em}
}
</style>
</head>
<body>
<div id="app">
  <div id="banner"></div>
  <button id="testtag" type="button" aria-live="polite" title="Next (→), back (←)"></button>
  <div id="alerts"></div>
  <div id="grid"></div>
  <div id="map" aria-hidden="true"></div>
  <div id="settings" aria-hidden="true"></div>
  <div id="outlook" aria-hidden="true"></div>
  <div id="netpage" aria-hidden="true"></div>
  <footer>
    <span class="clock" id="clock">--:--:--</span>
    <span class="date" id="date"></span>
    <span class="dot" id="footdot"></span>
    <span class="meta" id="station"></span>
    <span class="spacer"></span>
    <span class="meta" id="meta"></span>
    <span class="controls">
      <button id="mapBtn" title="Weather map (w)" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none"
             style="vertical-align:-.12em">
          <path d="M9 3.5 3.5 5.8v14.7L9 18.2l6 2.3 5.5-2.3V3.5L15 5.8Z"
                stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M9 3.5v14.7M15 5.8v14.7" stroke="currentColor"
                stroke-width="1.8"/>
        </svg>
      </button>
      <button id="outBtn" title="10-day outlook (d)" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none"
             style="vertical-align:-.12em">
          <rect x="3" y="5" width="18" height="16" rx="2.5"
                stroke="currentColor" stroke-width="1.8"/>
          <path d="M3 10h18M8 3v4M16 3v4" stroke="currentColor"
                stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
      <button id="netBtn" title="Internet, the last week (n)" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none"
             style="vertical-align:-.12em">
          <path d="M7 14V6M7 6 4.5 8.5M7 6l2.5 2.5M17 10v8M17 18l2.5-2.5M17 18l-2.5-2.5"
                stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                stroke-linejoin="round"/>
        </svg>
      </button>
      <button id="setBtn" title="Settings (s)" aria-pressed="false">⚙</button>
      <button id="themeBtn" title="Light / dark (t)">◐</button>
      <button id="tvBtn" title="TV layout (f)">TV</button>
    </span>
  </footer>
</div>

<script>
"use strict";

/* ── unit handling ───────────────────────────────────────────────────── */
const UNITS = {
  temp: ["°F","°C","K"], wind: ["mph","km/h","m/s","kts"],
  pres: ["inHg","hPa","kPa","mmHg"], rain: ["in","mm"], dist: ["mi","km"],
};
const prefs = {};

function loadPrefs(serverUnits){
  for (const k of Object.keys(UNITS)) {
    let v = null;
    // Rain is the exception: its figure is no longer a tap target, so there
    // is no way back from a stored choice. It follows the server setting,
    // which is what a viewer who once tapped it to mm would want now.
    if (k !== "rain")
      try { v = localStorage.getItem("unit."+k); } catch (e) { /* private mode */ }
    if (!UNITS[k].includes(v)) v = (serverUnits && serverUnits[k]) || UNITS[k][0];
    prefs[k] = v;
  }
}
function cycle(kind){
  const list = UNITS[kind];
  prefs[kind] = list[(list.indexOf(prefs[kind]) + 1) % list.length];
  try { localStorage.setItem("unit."+kind, prefs[kind]); } catch (e) {}
  if (last) render(last);
}

const temp = (c) => c == null ? null
  : prefs.temp === "°F" ? c*9/5+32 : prefs.temp === "K" ? c+273.15 : c;
const tempDelta = (c) => c == null ? null : (prefs.temp === "°F" ? c*9/5 : c);
const wind = (ms) => ms == null ? null
  : prefs.wind === "mph" ? ms*2.23694 : prefs.wind === "km/h" ? ms*3.6
  : prefs.wind === "kts" ? ms*1.94384 : ms;
const pres = (mb) => mb == null ? null
  : prefs.pres === "inHg" ? mb*0.02953 : prefs.pres === "kPa" ? mb*0.1
  : prefs.pres === "mmHg" ? mb*0.750062 : mb;
const rain = (mm) => mm == null ? null : (prefs.rain === "in" ? mm/25.4 : mm);
const dist = (km) => km == null ? null : (prefs.dist === "mi" ? km*0.621371 : km);
const presDp = () => ({inHg:3, kPa:2})[prefs.pres] ?? 1;
const rainDp = () => prefs.rain === "in" ? 2 : 1;

const DASH = "—";
const fx = (v, dp=1) => v == null ? DASH : v.toFixed(dp);
const fg = (v, dp=1) => v == null ? DASH : String(Number(v.toFixed(dp)));
const sign = (v, dp=1) => v == null ? DASH : (v > 0 ? "+" : "") + v.toFixed(dp);
const DIRS = ["N","NNE","NE","ENE","E","ESE","SE","SSE",
              "S","SSW","SW","WSW","W","WNW","NW","NNW"];
const compass = (d) => d == null ? DASH : DIRS[Math.round(d/22.5) % 16];

function clock(ts){
  if (ts == null) return DASH;
  const d = new Date(ts*1000);
  return d.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
}
function dayClock(ts){
  if (ts == null) return DASH;
  const d = new Date(ts*1000), now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const t = d.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
  return sameDay ? t : d.toLocaleDateString([], {weekday:"short"}) + " " + t;
}
function shortDate(ts){
  if (ts == null) return DASH;
  return new Date(ts*1000).toLocaleDateString([], {month:"short", day:"numeric"});
}
function gap(sec){
  if (sec == null) return DASH;
  sec = Math.max(0, Math.round(sec));
  if (sec < 3600) return Math.round(sec/60)+"m";
  return Math.floor(sec/3600)+"h"+String(Math.round(sec%3600/60)).padStart(2,"0")+"m";
}
function ago(sec){
  if (sec == null) return DASH;
  sec = Math.max(0, Math.round(sec));
  if (sec < 60) return sec+"s";
  if (sec < 3600) return Math.floor(sec/60)+"m "+String(sec%60).padStart(2,"0")+"s";
  return Math.floor(sec/3600)+"h "+String(Math.floor(sec%3600/60)).padStart(2,"0")+"m";
}
const uvClass = (uv) => uv == null ? "muted"
  : uv < 3 ? "uv-low" : uv < 6 ? "uv-mod" : uv < 8 ? "uv-high"
  : uv < 11 ? "uv-vhigh" : "uv-extreme";

/* ── tiny DOM helpers ────────────────────────────────────────────────── */
const el = (tag, cls, html) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html != null) n.innerHTML = html;
  return n;
};
const esc = (s) => String(s).replace(/[&<>]/g, (c) =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function hero(value, unit, tone, kind){
  const n = el("div", "hero" + (tone ? " "+tone : "") + (kind ? " unit-toggle" : ""));
  n.innerHTML = '<span class="v">'+esc(value)+'</span><span class="u">'+esc(unit)+'</span>';
  if (kind) n.addEventListener("click", () => cycle(kind));
  return n;
}
function cells(items, opts){
  const row = el("div", "row n" + items.length +
                 (opts && opts.grow ? " grow" : ""));
  for (const it of items) {
    const c = el("div", "cell" + (it.inline ? " inline" : ""));
    c.appendChild(el("span", "k", it.raw ? it.k : esc(it.k)));
    const v = el("span", "v" + (it.small ? " sm" : "") + (it.tone ? " "+it.tone : ""));
    v.innerHTML = esc(it.v) + (it.u ? '<span class="u">'+esc(it.u)+'</span>' : "");
    c.appendChild(v);
    if (it.sub) c.appendChild(el("span", "sub" +
        (it.subTone ? " " + it.subTone : ""), esc(it.sub)));
    row.appendChild(c);
  }
  return row;
}
const caption = (text, tone) =>
  el("div", "caption" + (tone ? " "+tone : ""), esc(text));

/* ── Weather Icons glyphs (see @font-face above) ─────────────────────── */
const WI = {"day-sunny":"\uf00d","night-clear":"\uf02e","day-sunny-overcast":"\uf00c","night-alt-partly-cloudy":"\uf081","day-cloudy":"\uf002","night-alt-cloudy":"\uf086","cloudy":"\uf013","fog":"\uf014","sprinkle":"\uf01c","sleet":"\uf0b5","rain":"\uf019","rain-mix":"\uf017","snow":"\uf01b","showers":"\uf01a","thunderstorm":"\uf01e","storm-showers":"\uf01d","na":"\uf07b","thermometer":"\uf055","strong-wind":"\uf050","barometer":"\uf079","raindrop":"\uf078","lightning":"\uf016","sunrise":"\uf051","sunset":"\uf052","moonrise":"\uf0c9","moonset":"\uf0ca","day-sunny":"\uf00d","wind-beaufort-0":"\uf0b7","wind-beaufort-1":"\uf0b8","wind-beaufort-2":"\uf0b9","wind-beaufort-3":"\uf0ba","wind-beaufort-4":"\uf0bb","wind-beaufort-5":"\uf0bc","wind-beaufort-6":"\uf0bd","wind-beaufort-7":"\uf0be","wind-beaufort-8":"\uf0bf","wind-beaufort-9":"\uf0c0","wind-beaufort-10":"\uf0c1","wind-beaufort-11":"\uf0c2","wind-beaufort-12":"\uf0c3"};
const WI_PHASES = ["\uf095","\uf096","\uf097","\uf098","\uf099","\uf09a","\uf09b","\uf09c","\uf09d","\uf09e","\uf09f","\uf0a0","\uf0a1","\uf0a2","\uf0a3","\uf0a4","\uf0a5","\uf0a6","\uf0a7","\uf0a8","\uf0a9","\uf0aa","\uf0ab","\uf0ac","\uf0ad","\uf0ae","\uf0af","\uf0b0"];

/* One <i> carrying a glyph. aria-hidden: the value beside it carries meaning. */
function wi(name, style){
  const ch = WI[name];
  if (!ch) return "";
  return '<i class="wi" aria-hidden="true"' +
         (style ? ' style="'+style+'"' : '') + '>' + ch + '</i>';
}

/* The font has the full 28-glyph lunation, so pick by the Moon's real age. */
function wiMoon(ageDays){
  if (ageDays == null) return WI_PHASES[0];
  const SYN = 29.530588853;
  const i = Math.floor(((ageDays % SYN) / SYN) * 28) % 28;
  return WI_PHASES[i];
}

/* ── card icons ──────────────────────────────────────────────────────── */
function card(id, title, glyph, tone, health){
  const c = el("div", "card"); c.id = "card-"+id;
  const head = el("div", "card-head");
  head.innerHTML =
    (typeof glyph === "string" && glyph.length === 1
       ? '<i class="wi" aria-hidden="true" style="color:var(--'+tone+')">'+glyph+'</i>'
       : wi(glyph, "color:var(--"+tone+")")) +
    '<span class="card-title">'+esc(title)+'</span>'+
    '<span class="dot '+health+'"></span>';
  c.appendChild(head);
  const body = el("div", "card-body");
  c.appendChild(body);
  return {card:c, body:body};
}

/* A card's dot for a card fed by a fetcher rather than by the hub.

   Every fetcher keeps its last good reading and sets `error` when a refresh
   fails, so available-with-an-error is exactly "what you are looking at is
   old" — the state you would otherwise never catch, because a card showing
   yesterday's pollen count looks identical to one showing today's. Nothing
   at all is grey rather than red: the card body already says why in words,
   and red is worth keeping for the station itself going quiet. */
function srcHealth(src){
  if (!src || !src.available) return "waiting";
  return src.error ? "stale" : "live";
}

/* ── decorative + computed graphics ──────────────────────────────────── */

/* A stylised tree behind the wind card. Lean and sway speed come from the
   actual wind, so the card reads as "windy" before you read the number. */
function tree(windMs){
  const ms = windMs == null ? 0 : windMs;
  // Below about 7 m/s this is what it always was; past that it used to stop,
  // so a gale bent the tree no further than a stiff breeze and only shook it
  // faster. It keeps leaning now, to 20° at around 37 mph.
  const lean = Math.min(20, 1 + ms * 1.15).toFixed(2);      // degrees
  const period = Math.max(0.8, 6.5 - ms * 0.55).toFixed(2); // seconds
  const n = el("div", "tree");
  n.style.setProperty("--lean", lean + "deg");
  n.style.setProperty("--sway", period + "s");
  n.innerHTML =
    '<svg viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg">' +
      '<g fill="none" stroke="#4a3a2b" stroke-linecap="round">' +
        '<path d="M100 220 C97 186 95 158 99 128" stroke-width="10"/>' +
        '<path d="M99 156 C87 145 78 140 69 137" stroke-width="4.5"/>' +
        '<path d="M99 146 C111 134 122 129 131 126" stroke-width="4.5"/>' +
      '</g>' +
      '<g class="crown">' +
        '<ellipse cx="100" cy="96" rx="52" ry="40" fill="#2b4420"/>' +
        '<ellipse cx="70"  cy="110" rx="30" ry="24" fill="#243a1b"/>' +
        '<ellipse cx="132" cy="108" rx="28" ry="23" fill="#243a1b"/>' +
        '<g class="leafA">' +
          '<ellipse cx="94"  cy="72" rx="35" ry="27" fill="#365427"/>' +
          '<ellipse cx="124" cy="84" rx="24" ry="19" fill="#3e5f2c"/>' +
          '<ellipse cx="76"  cy="88" rx="22" ry="17" fill="#3e5f2c"/>' +
          '<ellipse cx="104" cy="58" rx="20" ry="15" fill="#456a31"/>' +
        '</g>' +
      '</g>' +
    '</svg>';
  return n;
}

/* Rain behind the Rainfall card.

   The weather service's own bands, in mm/h: light below 2.5, moderate to
   7.6, heavy to 50, violent above. Heavy is duck weather — a puddle rises
   along the bottom of the card and a duck in a rain hat bobs on it. Violent
   rain is rare here, and gets the ark: Noah on the bow with his staff, two
   giraffes, an elephant and a lion at the windows, and the dove with its
   olive branch, sailing slowly across. The rain leans with the wind. */
const RAIN_TIERS = [[50, "violent"], [7.6, "heavy"], [2.5, "moderate"], [0.01, "light"]];
const RAIN_LOOK = {
  light:    {n: 16, len: 3.5, dur: 1.9,  op: .45},
  moderate: {n: 32, len: 5,   dur: 1.25, op: .55},
  heavy:    {n: 56, len: 7,   dur: .8,   op: .6},
  violent:  {n: 76, len: 9,   dur: .58,  op: .65},
};
const rainTier = (mmh) => { for (const [min, t] of RAIN_TIERS) if (mmh >= min) return t; return null; };
const svgURI = (s) => "data:image/svg+xml," + encodeURIComponent(s);

const DUCK_IMG = svgURI(
  "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 48'>" +
  "<path d='M8 32 L2 23 L13 29 Z' fill='#f4c430'/>" +
  "<ellipse cx='30' cy='35' rx='22' ry='10' fill='#f4c430'/>" +
  "<path d='M19 33 Q28 26 37 33 Q28 39 19 33 Z' fill='#dda91c'/>" +
  "<circle cx='44' cy='21' r='9' fill='#f4c430'/>" +
  "<path d='M52 21 Q61 20 61 24 Q57 26 51 24 Z' fill='#f28c28'/>" +
  "<circle cx='46.5' cy='19' r='1.7' fill='#222'/><circle cx='47.1' cy='18.4' r='.55' fill='#fff'/>" +
  // a sou'wester: it is duck weather, but he is taking no chances
  "<path d='M35 15 Q44 3 53 15 Z' fill='#2f6fb3'/>" +
  "<path d='M32 15 H56' stroke='#2f6fb3' stroke-width='2.4' stroke-linecap='round'/>" +
  "</svg>");

const ARK_IMG = svgURI(
  "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 72'>" +
  // the dove, and the olive branch it brought back
  "<path d='M80 7 q4 -4 8 0 q4 -4 8 0' fill='none' stroke='#f4f4f4' stroke-width='1.6' stroke-linecap='round'/>" +
  "<path d='M92 8 l4 3' stroke='#6aa84f' stroke-width='1.3'/><circle cx='96.5' cy='11.5' r='1.2' fill='#6aa84f'/>" +
  // two giraffes, who do not fit below deck
  "<path d='M79 40 L81 22 L84.5 22 L84 40 Z' fill='#d9a441'/>" +
  "<ellipse cx='84.5' cy='21' rx='3.4' ry='2.1' fill='#d9a441'/>" +
  "<path d='M88 40 L91 14 L95 14 L93.5 40 Z' fill='#e5b24a'/>" +
  "<ellipse cx='95.5' cy='13' rx='4' ry='2.4' fill='#e5b24a'/>" +

function iciclesSVG(now){
  let path = "", glints = "";
  for (let i = 0; i < 20; i++) {
    const x = i * 5, len = 4 + ((i * 7) % 5) * 1.2;
    path += "M" + x + " 0 L" + (x + 2.5) + " " + len + " L" + (x + 5) + " 0 Z";
    if (i % 4 === 1) glints += '<circle class="glint" cx="' + (x + 2.5) + '" cy="' +
      (len - 0.6) + '" r=".7" fill="#fff" style="animation-delay:' +
      (-((now + i * 0.7) % 2.6)).toFixed(2) + 's"/>';
  }
  return '<svg class="icicles" viewBox="0 0 100 10" preserveAspectRatio="none" aria-hidden="true">' +
    '<path d="' + path + '" fill="rgba(210,235,255,.55)"/>' + glints + '</svg>';
}

const SNOW_LOOK = {
  snow:      {n: 28,  size: [0.5, 1.4], dur: 8,   op: .8},
  heavysnow: {n: 60,  size: [0.5, 1.4], dur: 5.5, op: .85},
  blizzard:  {n: 110, size: [0.4, 1.0], dur: 1.8, op: .8},
};

function snowSky(tier, windMs, windDir){
  const look = SNOW_LOOK[tier];
  // Snow falls at about a metre a second, so the same wind that barely bends
  // rain carries it a long way sideways. A blizzard is sideways by definition.
  const east = windMs && windDir != null ? -Math.sin(windDir * Math.PI / 180) * windMs : 0;
  let ang = Math.atan2(east, 1.2) * 180 / Math.PI;
  if (tier === "blizzard") ang = Math.sign(ang || 1) * Math.max(38, Math.min(60, Math.abs(ang)));
  else ang = Math.max(-35, Math.min(35, ang));
  const dx = Math.tan(ang * Math.PI / 180) * 124;
  const now = Date.now() / 1000;
  let html = "";
  for (let i = 0; i < look.n; i++) {
    const f = (i * 0.6180339887) % 1, g = (i * 0.7548776662) % 1;
    const dur = look.dur * (0.8 + g * 0.4);
    const delay = -((now + f * dur * 5) % dur);
    const size = look.size[0] + g * (look.size[1] - look.size[0]);
    const x = ang > 5 ? -60 + f * 160 : ang < -5 ? f * 160 : f * 100;
    html += '<i class="flake" style="left:' + x.toFixed(1) + '%;--size:' + size.toFixed(2) +
      'cqh;--op:' + look.op + ';--dur:' + dur.toFixed(2) + 's;--delay:' + delay.toFixed(2) +
      's;--dx:' + dx.toFixed(1) + 'cqh;--sway:' + (2 + g * 3).toFixed(1) + 'cqw"></i>';
  }
  if (tier === "heavysnow" || tier === "blizzard") {
    html += '<div class="snowscene" style="--drift:' + (tier === "blizzard" ? 14 : 10) + 'cqh">' +
      '<div class="bank"></div>' +
      '<div class="crest" style="background-image:url(\'' + DRIFT_IMG + '\')"></div>' +
      (tier === "heavysnow"
        ? snowmanSVG((-(now % 24)).toFixed(2))
        : '<div class="sail" style="animation-delay:' + (-(now % 36)).toFixed(2) + 's">' +
            '<img class="yeti" alt="" src="' + YETI_IMG + '" style="animation-delay:' +
            (-(now % 0.9)).toFixed(2) + 's"></div>') +
      '</div>';
  }
  const w = el("div", "rainsky");
  w.dataset.tier = tier;
  w.innerHTML = html;
  return w;
}

/* Snow, sleet and freezing rain, which the Tempest cannot tell from rain or
   cannot see at all. The nearest NWS station says what is falling; the
   forecast model's present weather stands in when that station has gone
   quiet. Either is believed only when the Tempest's own thermometer says it
   is cold enough here — the airport can be twenty miles away. */
const SNOW_BELOW_C = 1.7;             // 35 °F
const WMO_WINTER = {
  71: ["snow", "light"], 73: ["snow", "moderate"], 75: ["snow", "heavy"],
  77: ["snow", "light"], 85: ["snow", "light"], 86: ["snow", "heavy"],
  56: ["freezing_rain", "light"], 57: ["freezing_rain", "heavy"],
  66: ["freezing_rain", "light"], 67: ["freezing_rain", "heavy"],
};

function skyNow(s){
  if (TEST_RAIN && TEST_RAIN.sky) return TEST_RAIN.sky;
  const t = s.obs && s.obs.temp_c;
  if (t == null || t > SNOW_BELOW_C) return null;
  const po = s.precip_obs || {};
  const now = s.now || Date.now() / 1000;
  const fresh = po.available && po.observed_at && Math.abs(now - po.observed_at) < 7200;
  let kind = null, intensity = null, source = null;
  if (fresh) {
    kind = po.kind; intensity = po.intensity;
    source = po.station_name || po.station || "NWS";
  } else {
    const cur = s.forecast && s.forecast.available ? s.forecast.current : null;
    const w = cur ? WMO_WINTER[cur.code] : null;
    if (w) { kind = w[0]; intensity = w[1]; source = "forecast"; }
  }
  const blizzard = ((s.alerts && s.alerts.alerts) || []).some(a => /blizzard/i.test(a.event || ""));
  const gale = (s.obs.wind_gust_ms || 0) >= 15.6;          // 35 mph, the blizzard line
  if (kind === "snow")
    return {tier: blizzard || (intensity === "heavy" && gale) ? "blizzard"
                : intensity === "heavy" ? "heavysnow" : "snow", source};
  if (blizzard && fresh && po.blowing) return {tier: "blizzard", source};
  if (kind === "freezing_rain") return {tier: "freezing", source, heavy: intensity === "heavy"};
  if (kind === "sleet") return {tier: "sleet", source};
  return null;
}

const SKY_WORDS = {heavy: "Duck weather", violent: "Consider building an ark",
                   heavysnow: "Snowman weather", blizzard: "Stay inside"};
function skyCaption(tier, source){
  if (SKY_WORDS[tier]) return SKY_WORDS[tier];
  const say = {snow: "Snowing", freezing: "Freezing rain", sleet: "Sleet"}[tier];
  return say ? say + (source ? " · " + source : "") : null;
}

// ?testrain=light|moderate|heavy|violent|hail — shows the graphic without
// waiting for the weather, like ?testalert. The figures stay real.
const RAIN_PRESETS = {light: [1.2, 1], moderate: [5, 1], heavy: [20, 1],
                      violent: [60, 1], hail: [6, 2]};
const SKY_PRESETS = {snow: {tier: "snow"}, heavysnow: {tier: "heavysnow"},
                     blizzard: {tier: "blizzard"}, freezing: {tier: "freezing"},
                     sleet: {tier: "sleet"}};
const rainPreset = (name) => {
  const n = (name || "heavy").toLowerCase();
  if (SKY_PRESETS[n]) return {sky: Object.assign({source: "nearest airport"}, SKY_PRESETS[n])};
  const p = RAIN_PRESETS[n] || RAIN_PRESETS.heavy;
  return {rate: p[0], type: p[1]};
};
let TEST_RAIN = (() => {           // let: /testall changes it as it loops
  const q = new URLSearchParams(location.search);
  return q.has("testrain") ? rainPreset(q.get("testrain")) : null;
})();

function rainSky(rate, ptype, windMs, windDir, as){
  const hail = ptype === 2 || ptype === 3;
  const icy = as === "freezing";
  const tier = rainTier(rate) || (hail ? "moderate" : null);
  if (!tier) return null;
  const look = RAIN_LOOK[tier];
  // Slant from the part of the wind blowing east or west, against a fall of
  // about 7 m/s. The direction is where the wind comes from, so it blows
  // toward the opposite side; east is to the right.
  const east = windMs && windDir != null ? -Math.sin(windDir * Math.PI / 180) * windMs : 0;
  const ang = Math.max(-40, Math.min(40, Math.atan2(east, 7) * 180 / Math.PI));
  const dx = Math.tan(ang * Math.PI / 180) * 124;
  const now = Date.now() / 1000;
  let html = "";
  for (let i = 0; i < look.n; i++) {
    const f = (i * 0.6180339887) % 1, g = (i * 0.7548776662) % 1;
    const isHail = hail && (ptype === 2 || i % 3 === 0);
    const dur = (isHail ? 1.1 : look.dur) * (0.85 + g * 0.3);
    const delay = -((now + f * dur * 7) % dur);
    // Start drops upwind of the card when they drift, or the far side stays dry.
    const x = ang > 5 ? -45 + f * 145 : ang < -5 ? f * 145 : f * 100;
    html += '<i class="drop' + (isHail ? " hail" : icy ? " icy" : "") + '" style="left:' + x.toFixed(1) +
      '%;--len:' + look.len + 'cqh;--op:' + look.op + ';--dur:' + dur.toFixed(2) +
      's;--delay:' + delay.toFixed(2) + 's;--dx:' + dx.toFixed(1) + 'cqh;--rot:' +
      (-ang).toFixed(1) + 'deg"></i>';
  }
  if (icy) html += iciclesSVG(now);
  if (!as && (tier === "heavy" || tier === "violent")) {
    const depth = tier === "violent" ? 22 : 8 + Math.min(1, (rate - 7.6) / 42.4) * 12;
    const bob = (-(now % 2.6)).toFixed(2);
    html += '<div class="rainscene" style="--water:' + depth.toFixed(1) + 'cqh">' +
      '<div class="water"></div>' +
      '<div class="waves" style="background-image:url(\'' + WAVE_IMG + '\');' +
        'animation-delay:' + (-(now % 3)).toFixed(2) + 's"></div>' +
      (tier === "heavy"
        ? '<img class="floater duck" alt="" src="' + DUCK_IMG + '" style="animation-delay:' + bob + 's">'
        : '<div class="sail" style="animation-delay:' + (-(now % 48)).toFixed(2) + 's">' +
            '<img class="floater ark" alt="" src="' + ARK_IMG + '" style="animation-delay:' + bob + 's">' +
          '</div>') +
      '</div>';
  }
  const w = el("div", "rainsky");
  w.dataset.tier = as || tier;
  w.innerHTML = html;
  return w;
}

/* The Lightning card's picture.

   The card is empty almost always, so the quiet state has to be worth looking
   at: rings at 5, 10, 20 and 30 miles, you at the centre of the bottom edge,
   and a horizon. A storm puts a cloud on the ring matching the nearest recent
   strike, flashing as often as the strikes come. Overhead — inside five miles
   in the last ten minutes — the cloud fills the sky and the whole card lights
   with each strike. After a week with nothing, Franklin's kite is still up
   the tree where he left it.

   The Tempest reports how far a strike was, never which way, so where the
   cloud sits around the ring means nothing. It is placed from the strike's
   own timestamp: fixed for that strike, rather than skipping about every two
   seconds as the card is rebuilt. */
const STORM_RINGS_MI = [5, 10, 20, 30];
const STORM_OVERHEAD_MI = 5;
const STORM_QUIET_DAYS = 7;

/* ?teststorm=overhead|nearby|quiet|kite, the same idea as ?testrain. */
let TEST_STORM = (() => {
  const q = new URLSearchParams(location.search);
  return q.has("teststorm") ? stormPreset(q.get("teststorm")) : null;
})();
function stormPreset(name){
  const now = Date.now() / 1000;
  switch ((name || "nearby").toLowerCase()) {
    case "overhead": return {kind: "overhead", mi: 3.1, age: 120,
                             last: {ts: now - 120, dist_km: 5}};
    case "quiet":    return {kind: "quiet", kite: false, mi: null, age: 3 * 86400,
                             last: {ts: now - 3 * 86400, dist_km: 30}};
    case "kite":     return {kind: "quiet", kite: true, mi: null, age: 12 * 86400,
                             last: {ts: now - 12 * 86400, dist_km: 22}};
    default:         return {kind: "nearby", mi: 13.5, age: 1500,
                             last: {ts: now - 1500, dist_km: 21.7}};
  }
}

function stormState(d, now){
  if (TEST_STORM) return TEST_STORM;
  const last = d.strike_last || null;
  const age = last && last.ts ? now - last.ts : null;
  const nearMi = d.strike_nearest_km == null ? null : d.strike_nearest_km / 1.609;
  const lastMi = last && last.dist_km != null ? last.dist_km / 1.609 : null;
  if (age != null && age < 600 && (nearMi != null && nearMi <= STORM_OVERHEAD_MI))
    return {kind: "overhead", mi: nearMi, age, last};
  if (age != null && age < 3 * 3600)
    return {kind: "nearby", mi: nearMi != null ? nearMi : lastMi, age, last};
  const stale = age == null || age > STORM_QUIET_DAYS * 86400;
  return {kind: "quiet", kite: stale, mi: null, age, last};
}

function stormSky(st, strikes1h){
  const w = el("div", "stormsky");
  const R = 50;                                  // the 30-mile ring, in units
  const ring = (mi) => R * mi / 30;
  let art = "";
  for (const mi of STORM_RINGS_MI)
    art += '<circle cx="50" cy="58" r="' + ring(mi).toFixed(1) + '" fill="none" ' +
      'stroke="var(--label)" stroke-width=".7" opacity=".35" ' +
      (mi === 30 ? '' : 'stroke-dasharray="2 3" ') + 'vector-effect="non-scaling-stroke"/>';
  art += '<path d="M0 58 H100" stroke="var(--label)" stroke-width=".7" opacity=".3" ' +
         'vector-effect="non-scaling-stroke"/>';
  art += '<circle cx="50" cy="58" r="1.5" fill="var(--label)" opacity=".8"/>';  // the station
  art += '<text x="1.5" y="14" fill="var(--faint)" font-size="4" letter-spacing=".3">30 mi</text>';

  const cloud = (cx, cy, scale, bolt) =>
    '<g transform="translate(' + cx.toFixed(1) + ' ' + cy.toFixed(1) + ') scale(' + scale + ')">' +
      '<ellipse cx="0" cy="0" rx="11" ry="5.2" fill="#2a2f3d"/>' +
      '<ellipse cx="-5" cy="-2.6" rx="6" ry="4.4" fill="#333a4a"/>' +
      '<ellipse cx="4.5" cy="-2.2" rx="7" ry="4.8" fill="#39405240"/>' +
      '<ellipse cx="4.5" cy="-2.2" rx="7" ry="4.8" fill="#333a4a"/>' +
      (bolt ? '<path class="bolt" d="M1 4 L-3.5 11 L0 11 L-2 17 L5 9 L1.4 9 L4 4 Z" ' +
              'fill="var(--yellow)"/>' : "") +
    '</g>';

  if (st.kind === "overhead") {
    art += cloud(50, 22, 1.9, true);
  } else if (st.kind === "nearby" && st.mi != null) {
    // A fixed angle for this strike: from its own timestamp, so the cloud
    // stays put between renders.
    const seed = st.last && st.last.ts ? st.last.ts : 0;
    const ang = (25 + (Math.abs(Math.sin(seed)) * 130)) * Math.PI / 180;
    const r = ring(Math.max(2, Math.min(30, st.mi)));
    art += cloud(50 + r * Math.cos(ang), 58 - r * Math.sin(ang), 0.95, true);
  } else {
    art += cloud(76, 20, 0.85, false);           // a harmless one, passing by
    if (st.kite) {
      // Franklin's kite, still up the tree.
      art += '<g transform="translate(15 58) scale(1.1)">' +
        '<path d="M0 0 V-13" stroke="#6b4a2b" stroke-width="1.6" stroke-linecap="round"/>' +
        '<ellipse cx="0" cy="-17" rx="7.5" ry="6" fill="#2b4420"/>' +
        '<ellipse cx="-4" cy="-14" rx="4.5" ry="3.6" fill="#243a1b"/>' +
        '<ellipse cx="4.5" cy="-14.5" rx="4" ry="3.4" fill="#243a1b"/>' +
        '<g transform="translate(6.5 -22) rotate(18)">' +
          '<path d="M0 -5 L4 0 L0 5 L-4 0 Z" fill="#d9483b"/>' +
          '<path d="M0 -5 V5 M-4 0 H4" stroke="#8f2f27" stroke-width=".5"/>' +
          '<path d="M0 5 Q2 9 -1 12 Q-4 15 -1 18" stroke="#c9c2a8" stroke-width=".7" fill="none"/>' +
        '</g></g>';
    }
  }

  // How often the sky lights: a strike or two an hour is occasional, a storm
  // overhead is most of the time.
  const rate = Math.max(0, strikes1h || 0);
  const flash = st.kind === "overhead" ? Math.max(2.5, 9 - rate * 0.6)
              : st.kind === "nearby" ? Math.max(6, 18 - rate * 1.2) : 0;
  w.innerHTML = '<div class="band"><svg viewBox="0 0 100 60" ' +
    'preserveAspectRatio="xMidYMax meet" aria-hidden="true">' + art + '</svg></div>' +
    (st.kind === "overhead" ? '<div class="sheet"></div>' : "");
  if (flash) {
    w.style.setProperty("--flash", flash.toFixed(1) + "s");
    // Phase from the clock, so a rebuild does not restart the storm.
    const off = (-(Date.now() / 1000 % flash)).toFixed(2) + "s";
    for (const e of w.querySelectorAll(".bolt, .sheet")) e.style.animationDelay = off;
  }
  w.dataset.storm = st.kind + (st.kite ? " kite" : "");
  return w;
}

/* A face that dresses for the pollen count, behind the Pollen card.

   The same idea as the wind card's tree: the picture should tell you the
   reading before the number does. The worst of the three indices picks the
   gear — nothing, a tissue, a surgical mask, a respirator, a hood — and sets
   how often it sneezes, from not at all to every few seconds. The eyes redden
   on the way up.

   Everything is drawn on one head so the tiers differ only in what is worn,
   which is the joke: the same person, having a progressively worse day. */
function pollenFace(worst){
  const i = worst == null ? 0 : Math.max(0, Math.min(5, Math.round(worst)));
  // It IS the card's middle spacer rather than a layer floating over the card.
  // Floated, it had to guess how much room the layout had left, and it guessed
  // from the two roomiest cases: on any card shorter than about 470px it sat
  // across the caption and the figures. As the spacer, flex hands it exactly
  // what is going spare and it cannot overlap anything by construction.
  const n = el("div", "mid pollenface" + (i ? "" : " calm"));
  // Nothing in the air, nothing to sneeze at; from there they crowd together.
  if (i) n.style.setProperty("--achoo", (17 - i * 2.4).toFixed(1) + "s");

  const skin = "#c9a687", dark = "#2e2620";
  const flush = (i / 5 * 0.8).toFixed(2);        // how bloodshot, 0 to .8

  // Worn over the face. Ordered so each tier reads as more desperate.
  const gear = [
    // 0 — nothing at all, and a faint smile about it
    '<path d="M86 140 Q100 150 114 140" fill="none" stroke="' + dark +
      '" stroke-width="3" stroke-linecap="round"/>',
