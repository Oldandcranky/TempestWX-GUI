    // 1-2 — a tissue, pinched at the nose and flaring below it. Drawn as the
    // gesture rather than the object: a rectangle over the mouth reads as
    // tape, not as someone holding a kleenex.
    '<path d="M100 116 C86 128 70 140 66 168 C84 178 118 178 136 166 ' +
      'C130 138 114 127 100 116 Z" fill="#f4f6f9"/>' +
    '<g stroke="#d3dae2" stroke-width="2.2" fill="none" stroke-linecap="round">' +
      '<path d="M99 122 L80 164"/><path d="M101 122 L103 172"/>' +
      '<path d="M102 122 L124 162"/></g>' +
    '<g fill="#b98f70">' +          // fingers, pinching it shut
      '<rect x="88" y="112" width="9" height="16" rx="4.5"/>' +
      '<rect x="101" y="112" width="9" height="16" rx="4.5"/></g>',
    null,                                        // 2 shares the tissue
    // 3 — a surgical mask
    '<path d="M62 118 Q100 112 138 118 L134 152 Q100 172 66 152 Z" fill="#9fd3e0"/>' +
    '<g stroke="#7fb9c8" stroke-width="2.4" fill="none">' +
      '<path d="M64 130 Q100 124 136 130"/><path d="M65 142 Q100 136 135 142"/></g>' +
    '<g stroke="#7fb9c8" stroke-width="3" fill="none" stroke-linecap="round">' +
      '<path d="M62 120 Q44 126 46 112"/><path d="M138 120 Q156 126 154 112"/></g>',
    // 4 — a respirator, valve and all
    '<path d="M60 116 Q100 108 140 116 Q142 146 100 172 Q58 146 60 116 Z" ' +
      'fill="#eceff3"/>' +
    '<path d="M60 116 Q100 126 140 116" fill="none" stroke="#c3c9d2" stroke-width="2.5"/>' +
    '<circle cx="100" cy="148" r="11" fill="#c3c9d2"/>' +
    '<circle cx="100" cy="148" r="5" fill="#8c949f"/>' +
    '<g stroke="#c3c9d2" stroke-width="4" fill="none" stroke-linecap="round">' +
      '<path d="M60 120 L34 106"/><path d="M140 120 L166 106"/></g>',
    // 5 — full hood, and giving up on the outdoors
    '<path d="M40 120 Q40 44 100 44 Q160 44 160 120 L160 178 Q100 194 40 178 Z" ' +
      'fill="#d8c23f"/>' +
    '<path d="M56 96 Q100 84 144 96 L144 134 Q100 148 56 134 Z" fill="#2b3440" ' +
      'opacity=".88"/>' +
    '<path d="M60 100 Q100 90 140 100" fill="none" stroke="#7b8798" stroke-width="3"/>' +
    '<path d="M44 168 Q100 182 156 168" fill="none" stroke="#b9a52f" stroke-width="5"/>',
  ];
  const worn = gear[i] || gear[1];               // 2 falls back to the tissue
  const hooded = i >= 5;

  n.innerHTML =
    '<svg viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg">' +
      '<g class="head">' +
        '<path d="M58 220 Q60 184 100 178 Q140 184 142 220 Z" fill="#3a4352"/>' +
        '<circle cx="46" cy="120" r="9" fill="' + skin + '"/>' +
        '<circle cx="154" cy="120" r="9" fill="' + skin + '"/>' +
        '<circle cx="100" cy="116" r="54" fill="' + skin + '"/>' +
        (hooded ? "" :
          '<path d="M50 104 Q56 58 100 58 Q144 58 150 104 Q138 82 100 80 ' +
            'Q62 82 50 104 Z" fill="' + dark + '"/>') +
        // eyes, with the irritation under them
        '<g class="eyes">' +
          '<ellipse cx="80" cy="124" rx="11" ry="6" fill="var(--red)" ' +
            'opacity="' + flush + '"/>' +
          '<ellipse cx="120" cy="124" rx="11" ry="6" fill="var(--red)" ' +
            'opacity="' + flush + '"/>' +
          '<circle cx="80" cy="116" r="5" fill="' + dark + '"/>' +
          '<circle cx="120" cy="116" r="5" fill="' + dark + '"/>' +
        '</g>' +
        worn +
      '</g>' +
    '</svg>';
  return n;
}

/* Moon glyph: the lit limb is an outer semicircle closed by the terminator
   ellipse, so the shape follows the real illuminated fraction. */
function moonGlyph(illum, waxing, tone){
  const R = 9, f = Math.max(0, Math.min(1, illum == null ? 0 : illum));
  const rx = (R * Math.abs(1 - 2 * f)).toFixed(2);
  const outer = waxing ? 1 : 0;
  const inner = (f > 0.5) ? outer : 1 - outer;
  const d = "M 0 " + (-R) + " A " + R + " " + R + " 0 1 " + outer +
            " 0 " + R + " A " + rx + " " + R + " 0 1 " + inner + " 0 " + (-R) + " Z";
  return '<svg viewBox="-11 -11 22 22" aria-hidden="true">' +
           '<circle r="' + R + '" fill="none" stroke="var(--rule)" stroke-width="1"/>' +
           '<path d="' + d + '" fill="' + (tone || "var(--muted)") + '"/>' +
         '</svg>';
}

/* WMO weather codes, as Open-Meteo reports them, mapped to a label and a
   Weather Icons glyph (day and night variants where the font has both). */
const WMO = {
  0:["Clear","day-sunny","night-clear"],
  1:["Mainly clear","day-sunny-overcast","night-alt-partly-cloudy"],
  2:["Partly cloudy","day-cloudy","night-alt-cloudy"],
  3:["Overcast","cloudy","cloudy"],
  45:["Fog","fog","fog"], 48:["Rime fog","fog","fog"],
  51:["Light drizzle","sprinkle","sprinkle"],
  53:["Drizzle","sprinkle","sprinkle"],
  55:["Heavy drizzle","sprinkle","sprinkle"],
  56:["Freezing drizzle","sleet","sleet"], 57:["Freezing drizzle","sleet","sleet"],
  61:["Light rain","rain","rain"], 63:["Rain","rain","rain"],
  65:["Heavy rain","rain","rain"],
  66:["Freezing rain","rain-mix","rain-mix"], 67:["Freezing rain","rain-mix","rain-mix"],
  71:["Light snow","snow","snow"], 73:["Snow","snow","snow"],
  75:["Heavy snow","snow","snow"], 77:["Snow grains","snow","snow"],
  80:["Rain showers","showers","showers"], 81:["Rain showers","showers","showers"],
  82:["Heavy showers","showers","showers"],
  85:["Snow showers","snow","snow"], 86:["Snow showers","snow","snow"],
  95:["Thunderstorm","thunderstorm","thunderstorm"],
  96:["Storm with hail","storm-showers","storm-showers"],
  99:["Storm with hail","storm-showers","storm-showers"],
};
function wmo(code, isDay){
  const e = WMO[code];
  if (!e) return {label:"—", glyph:"na"};
  return {label:e[0], glyph: isDay === false ? e[2] : e[1]};
}

/* ── the six cards ───────────────────────────────────────────────────── */
function buildTemperature(s){
  const d = s.derived, o = s.obs;
  const {card:c, body:b} = card("temp","Temperature","thermometer","amber",s.health);
  b.appendChild(hero(fg(temp(o.temp_c)), prefs.temp, "amber", "temp"));
  // Three degrees C, roughly five F: a still night reads flat instead of
  // having the sensor's last decimal stretched across the card.
  b.appendChild(trace24(s.series && s.series.temp_c,
    {floor:3, tone:"amber", cls:"temptrace", empty:"Building a baseline",
     band:s.temp_normal_c}));
  b.appendChild(cells([
    {k:"Min", v:fg(temp(d.temp_min && d.temp_min.v)), u:d.temp_min ? prefs.temp : "", tone:"cold",
     sub:d.temp_min ? clock(d.temp_min.t) : ""},
    {k:"Max", v:fg(temp(d.temp_max && d.temp_max.v)), u:d.temp_max ? prefs.temp : "", tone:"red",
     sub:d.temp_max ? clock(d.temp_max.t) : ""},
  ]));
  const tr = tempDelta(d.temp_1h_delta_c);
  const d24 = tempDelta(d.temp_24h_delta_c);
  b.appendChild(cells([
    {k:"24hr", v:sign(d24), u:d24 == null ? "" : prefs.temp, inline:true, small:true},
    {k:"Trend", v:sign(tr), u:tr == null ? "" : prefs.temp+"/hr", inline:true,
     small:true, tone: tr == null ? "" : tr > 0 ? "red" : "cold"},
  ]));
  b.appendChild(cells([
    {k:"Feels", v:fg(temp(d.feels_c)), u:d.feels_c == null ? "" : prefs.temp, inline:true, small:true},
    {k:"Humid", v:o.rh == null ? DASH : Math.round(o.rh), u:o.rh == null ? "" : "%", inline:true, small:true},
    {k:"Dew", v:fg(temp(d.dew_c)), u:d.dew_c == null ? "" : prefs.temp, inline:true, small:true},
  ]));
  if (d.comfort) b.appendChild(caption("☀ " + d.comfort, "yellow"));
  return c;
}

function buildWind(s){
  const d = s.derived, o = s.obs, r = s.rapid || {};
  const {card:c, body:b} = card("wind","Wind","strong-wind","cold",s.health);
  c.insertBefore(tree(o.wind_avg_ms), c.firstChild);

  const rangeTxt = (d.wind_min_1h_ms == null || d.wind_max_1h_ms == null) ? ""
    : "Range " + fg(wind(d.wind_min_1h_ms)) + " – " + fg(wind(d.wind_max_1h_ms));
  const avgTxt = d.wind_avg_1h_ms == null ? ""
    : "Avg " + fg(wind(d.wind_avg_1h_ms)) + " " + compass(d.wind_dir_1h);
  b.appendChild(cells([
    {k:"Wind", v:fg(wind(o.wind_avg_ms)), u:prefs.wind, small:true,
     sub:[avgTxt || compass(o.wind_dir), rangeTxt].filter(Boolean).join("  ·  ")},
    {k:"Gust", v:fg(wind(o.wind_gust_ms)), u:prefs.wind, small:true, tone:"accent",
     sub:d.gust_max ? "Max " + fg(wind(d.gust_max.v)) + " · " + clock(d.gust_max.t) : ""},
  ]));

  const liveMs = r.speed_ms != null ? r.speed_ms : o.wind_avg_ms;
  const liveDir = r.dir_deg != null ? r.dir_deg : o.wind_dir;
  if (liveMs != null) windDial.speedTarget = liveMs;
  const shownMs = windDial.speed != null ? windDial.speed : liveMs;
  b.appendChild(hero(fg(wind(shownMs)), prefs.wind, "cold", "wind"));
  b.appendChild(ribbon(liveDir));
  const dir = el("div","caption wind-dir");
  dir.style.fontSize = "var(--fs-value)";
  dir.style.letterSpacing = "0";
  dir.innerHTML = liveDir == null ? DASH
    : '<span class="accent">'+compass(liveDir)+'</span> '+Math.round(liveDir)+"°";
  b.appendChild(dir);

  if (d.beaufort != null) {
    const bf = el("div","caption");
    bf.innerHTML = wi("wind-beaufort-"+d.beaufort) + " " +
                   esc(("Beaufort "+d.beaufort+": "+d.beaufort_name).toUpperCase());
    b.appendChild(bf);
  }
  const bits = [];
  if (d.wind_run_m) bits.push("Run "+(prefs.dist === "mi"
    ? (d.wind_run_m/1609.344).toFixed(1)+" mi"
    : (d.wind_run_m/1000).toFixed(1)+" km"));
  const st = [];
  if (d.steadiness_today_pct != null) st.push(Math.round(d.steadiness_today_pct)+"% today");
  if (d.steadiness_pct != null) st.push(Math.round(d.steadiness_pct)+"% 3h");
  if (st.length) bits.push("Steady "+st.join("·"));
  b.appendChild(caption(bits.join("  ·  ") || "Collecting wind run"));
  return c;
}

/* The compass strip. It is drawn once across three full turns and then slid
   under a fixed centre marker, so the card reads like a compass rose rather
   than snapping to a new position on every poll. */
const windDial = {target:null, shown:null, vel:0, raf:null,
                  smooth:null, speed:null, speedTarget:null};
const RIB_SPAN = 150;                       // degrees visible across the card
const RIB_TURNS = 3;
const RIB_STEP = 5.625;               // one tick per 5.625°, four per point                        // 1080° of ticks, so it never runs out

function shortestDelta(from, to){
  return ((to - from) % 360 + 540) % 360 - 180;
}

let ribbonNode = null;                      // built once, then reused

function buildRibbon(){
  const pct = 100 / RIB_SPAN;               // one degree, as % of the window
  const box = el("div","ribbon");
  const strip = el("div","strip");
  strip.appendChild(el("div","base"));
  const near = (deg, step) => Math.min(deg % step, step - (deg % step)) < 0.01;
  const frag = document.createDocumentFragment();
  for (let deg = 0; deg <= 360*RIB_TURNS; deg += RIB_STEP) {
    const major = near(deg, 45), mid = !major && near(deg, 22.5);
    const tick = el("div", "tick " + (major ? "major" : mid ? "mid" : "minor"));
    tick.style.left = (deg*pct).toFixed(3) + "%";
    frag.appendChild(tick);
    if (major) {
      const lab = el("div","lab", compass(((deg % 360)+360)%360));
      lab.style.left = (deg*pct).toFixed(3) + "%";
      frag.appendChild(lab);
    }
  }
  strip.appendChild(frag);
  box.appendChild(strip);
  box.appendChild(el("div","mark"));
  return box;
}

function ribbon(bearing){
  const wrap = el("div","mid");
  if (bearing == null && windDial.shown == null) {
    wrap.appendChild(el("div","sub","no direction yet"));
    return wrap;
  }
  if (!ribbonNode) ribbonNode = buildRibbon();
  wrap.appendChild(ribbonNode);            // moved, not rebuilt

  const mid = 360 * Math.floor(RIB_TURNS/2);
  if (bearing != null) {
    if (windDial.shown == null) {
      windDial.shown = mid + bearing;
      windDial.target = windDial.shown;
      windDial.smooth = bearing;
    } else {
      setWindTarget(bearing);
    }
  }
  startWindDial();
  return wrap;
}

/* Damp gust-to-gust jitter before it reaches the dial, so the needle drifts
   with the wind instead of twitching on every packet. */
function setWindTarget(bearing){
  if (windDial.shown == null) return;
  if (windDial.smooth == null) windDial.smooth = bearing;
  const step = shortestDelta(windDial.smooth, bearing);
  windDial.smooth = (windDial.smooth + step * 0.5 + 360) % 360;
  windDial.target = windDial.shown +
                    shortestDelta(((windDial.shown % 360) + 360) % 360,
                                  windDial.smooth);
}

function startWindDial(){
  if (windDial.raf != null) return;
  let last = performance.now();
  const step = (now) => {
    const dt = Math.min(0.1, (now - last)/1000);
    last = now;
    const strip = document.querySelector("#card-wind .strip");
    if (!strip || windDial.target == null) { windDial.raf = null; return; }
    const diff = windDial.target - windDial.shown;
    if (Math.abs(diff) < 0.01 && Math.abs(windDial.vel) < 0.01) {
      windDial.shown = windDial.target;
      windDial.vel = 0;
    } else {
      // critically damped spring: no overshoot, no abrupt stop
      const w = 4.2;
      windDial.vel += (-2*w*windDial.vel - w*w*(-diff)) * dt;
      windDial.shown += windDial.vel * dt;
    }
    // The pattern repeats every 360°, so re-centre invisibly when we drift.
    const mid = 360 * Math.floor(RIB_TURNS/2);
    if (windDial.shown > mid + 540) { windDial.shown -= 360; windDial.target -= 360; }
    if (windDial.shown < mid - 540) { windDial.shown += 360; windDial.target += 360; }
    strip.style.setProperty("--shift", (windDial.shown*(100/RIB_SPAN)).toFixed(3) + "%");

    if (windDial.speedTarget != null) {
      if (windDial.speed == null) windDial.speed = windDial.speedTarget;
      windDial.speed += (windDial.speedTarget - windDial.speed)
                        * Math.min(1, dt * 3.2);
      const v = document.querySelector("#card-wind .hero .v");
      if (v) v.textContent = fg(wind(windDial.speed));
    }
    windDial.raf = requestAnimationFrame(step);
  };
  windDial.raf = requestAnimationFrame(step);
}

function buildPressure(s){
  const d = s.derived, o = s.obs;
  const {card:c, body:b} = card("pres","Pressure","barometer","accent",s.health);
  const lo = d.pres_min ? d.pres_min.v : null, hi = d.pres_max ? d.pres_max.v : null;
  // Four millibars is about an ordinary day's swing, so a settled one
  // reads flat and a real front still has room to run off the top.
  b.appendChild(trace24(s.series && s.series.pres_mb,
    {floor:4, tone:"accent", cls:"trace", empty:"Building a baseline"}));
  b.appendChild(hero(o.pres_mb == null ? DASH : pres(o.pres_mb).toFixed(presDp()),
                     prefs.pres, null, "pres"));
  const rate = d.pres_1h_delta_mb == null ? null
    : pres(o.pres_mb) - pres(o.pres_mb - d.pres_1h_delta_mb);
  const arrow = rate == null ? "" : rate > 0.0005 ? "↗" : rate < -0.0005 ? "↘" : "→";
  b.appendChild(caption(rate == null ? "Building a baseline"
    : sign(rate, presDp())+" "+prefs.pres+"/hr  "+arrow, "green"));
  b.appendChild(caption(d.pres_trend || "Steady",
    d.pres_arrow === "down" ? "accent" : "green"));
  const span = (hi != null && lo != null) ? pres(hi) - pres(lo) : null;
  b.appendChild(cells([
    {k:"Min", v:lo == null ? DASH : pres(lo).toFixed(presDp()), tone:"cold",
     small:true, sub:d.pres_min ? clock(d.pres_min.t) : ""},
    {k:"24hr", v:span == null ? DASH : span.toFixed(presDp()), small:true,
     sub:prefs.pres},
    {k:"Max", v:hi == null ? DASH : pres(hi).toFixed(presDp()), tone:"red",
     small:true, sub:d.pres_max ? clock(d.pres_max.t) : ""},
  ]));
  b.appendChild(caption(d.pres_outlook || ""));
  return c;
}

/* Twenty-four hours of one reading, drawn small. The Pressure card shows
   where its figure has come from because the figure itself means nothing to
   anyone — 1014 mb is not a fact most people can hold — while six hours of
   falling means a front. Temperature is the opposite: everybody can read the
   number, and what the shape adds is the day around it, whether this 58°F is
   on the way up or what is left of a warm afternoon.

   Deliberately no fill under the line: the floor is an arbitrary minimum
   rather than zero, so shading down to it would give every wiggle a mass it
   has not earned.

   `floor` is the smallest range the scale will show, in whatever units the
   rows are in. Without one, a settled day gets stretched to fill the card
   and sensor noise reads as weather. */
function trace24(rows, {floor, tone, cls, empty, band}){
  const W = 100, H = 46, pad = 4;
  const wrap = el("div", "mid " + cls);
  const pts = (rows || []).filter(r => r && r[1] != null);
  if (pts.length < 2) {
    wrap.appendChild(caption(empty));
    return wrap;
  }
  const t0 = pts[0][0], t1 = pts[pts.length - 1][0];
  const span = Math.max(1, t1 - t0);
  const x = (t) => (t - t0) / span * W;

  let lo = Infinity, hi = -Infinity;
  for (const p of pts) { lo = Math.min(lo, p[1]); hi = Math.max(hi, p[1]); }

  // The band has to sit inside the scale, or a day far warmer than normal
  // pushes it off the top — which is exactly the day you want to see it.
  let bHi = null, bLo = null;
  if (band) {
    bHi = pts.map(p => monthlyAt(band.hi, new Date(p[0] * 1000)));
    bLo = pts.map(p => monthlyAt(band.lo, new Date(p[0] * 1000)));
    for (const v of bHi) hi = Math.max(hi, v);
    for (const v of bLo) lo = Math.min(lo, v);
  }

  if (hi - lo < floor) {
    const mid = (hi + lo) / 2;
    lo = mid - floor / 2; hi = mid + floor / 2;
  }
  const y = (v) => H - pad - (v - lo) / (hi - lo) * (H - 2 * pad);

  // Break the line across a hole in the history rather than drawing a
  // straight run that claims the reading held steady through a restart.
  const step = span / (pts.length - 1);
  let d = "", prev = null;
  for (const p of pts) {
    d += (prev != null && p[0] - prev < step * 3 ? "L" : "M") +
         x(p[0]).toFixed(2) + " " + y(p[1]).toFixed(2) + " ";
    prev = p[0];
  }

  // Six-hour rules, counted back from now, so "falling since when" is
  // readable off the plot without any axis labels.
  let rules = "";
  for (let h = 6; h * 3600 < span; h += 6) {
    const rx = x(t1 - h * 3600).toFixed(2);
    rules += '<line x1="'+rx+'" y1="0" x2="'+rx+'" y2="'+H+'" '+
      'stroke="var(--rule)" stroke-dasharray="1 3" vector-effect="non-scaling-stroke"/>';
  }

  // Normal for the time of year, as a band rather than a line: a day crosses
  // its own mean twice before breakfast, so one line would say nothing. The
  // trace leaving the top is a day warmer than it ought to be.
  let bandArt = "";
  if (bHi) {
    const at = (v, i) => x(pts[i][0]).toFixed(2) + " " + y(v).toFixed(2);
    const top = bHi.map(at), bot = bLo.map(at);
    const edge = (pt) => '<path d="M'+pt.join("L")+'" fill="none" '+
      'stroke="var(--label)" stroke-width="1" stroke-dasharray="3 3" '+
      'opacity=".55" vector-effect="non-scaling-stroke"/>';
    bandArt = '<path d="M'+top.join("L")+'L'+bot.slice().reverse().join("L")+'Z" '+
                'fill="var(--label)" fill-opacity=".10" stroke="none"/>'+
              edge(top) + edge(bot);
  }

  wrap.innerHTML =
    '<svg class="plot" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+
      bandArt+
      rules+
      '<path d="'+d.trim()+'" fill="none" stroke="var(--'+tone+')" stroke-width="2.4" '+
        'stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>'+
    '</svg>';
  return wrap;
}

function buildRainfall(s){
  const d = s.derived;
  const {card:c, body:b} = card("rain","Rainfall","raindrop","cold",s.health);
  const raining = (s.obs.rain_mm || 0) > 0;
  const yearIn = d.rain_year_mm == null ? null : d.rain_year_mm / 25.4;

  // The card's full height is a normal year. The mark is what a normal year
  // would have delivered by now, counted from the day the record actually
  // starts — which on a station installed in May is not the first of
  // January. That is what lets the gauge stay honest on a part year: the
  // fill is low because the record is short, and the mark is just as low,
  // so the two still read against each other.
  const monthly = s.rain_monthly_in;
  const annual = monthly ? monthly.reduce((a, b) => a + b, 0) : 0;
  const now = new Date(), y = now.getFullYear(), jan1 = new Date(y, 0, 1);
  let start = jan1;
  if (d.rain_from) {
    const p = d.rain_from.split("-").map(Number);
    const from = new Date(p[0], p[1] - 1, p[2]);
    if (from > start) start = from;
  }
  // floor, not round: start is midnight and now is partway through a day,
  // so rounding counts a thirteen-day record as fourteen.
  const days = Math.floor((now - start) / 864e5) + 1;
  const expect = monthly ? normalBetween(monthly, start, now) : 0;
  // Under a fortnight the ratio is noise — a single thunderstorm reads as
  // 400% of normal — so the card says how little it has instead.
  const enough = monthly && d.rain_from && days >= 14 && expect > 0;
  c.insertBefore(rainFill(enough ? yearIn : null, annual, expect / (annual || 1)),
                 c.firstChild);

  // What is falling, behind the figures and over the gauge. Winter first —
  // snow, sleet and freezing rain from the nearest NWS station — then the
  // Tempest's own rain and hail.
  const wo = s.obs.wind_avg_ms, wd = s.obs.wind_dir;
  const winter = skyNow(s);
  let sky;
  if (winter && winter.tier === "sleet") sky = rainSky(6, 2, wo, wd, "sleet");
  else if (winter && winter.tier === "freezing") sky = rainSky(winter.heavy ? 5 : 1.2, 1, wo, wd, "freezing");
  else if (winter) sky = snowSky(winter.tier, wo, wd);
  else {
    const t = TEST_RAIN && TEST_RAIN.rate != null ? TEST_RAIN : null;
    sky = rainSky(t ? t.rate : (d.rain_rate_mm_h || 0),
                  t ? t.type : (s.obs.precip_type || 0), wo, wd);
  }
  if (sky) c.insertBefore(sky, c.children[1]);
  const joke = sky ? skyCaption(sky.dataset.tier, winter && winter.source) : null;
  const snowing = !!winter && /snow|blizzard/.test(winter.tier);

  // a rate dial in the card header, like the reference
  const dial = el("span","headicon");
  const frac = Math.max(0, Math.min(1, rain(d.rain_rate_mm_h) / (prefs.rain === "in" ? 0.5 : 12)));
  dial.innerHTML =
    '<svg viewBox="0 0 24 24" fill="none">' +
      '<circle cx="12" cy="12" r="9" stroke="var(--rule)" stroke-width="2"/>' +
      '<path d="M12 12 L12 4.5" stroke="' + (raining ? "var(--cold)" : "var(--label)") +
        '" stroke-width="2" stroke-linecap="round" ' +
        'transform="rotate(' + (frac*270 - 135).toFixed(0) + ' 12 12)"/>' +
      '<circle cx="12" cy="12" r="1.6" fill="var(--label)"/>' +
    '</svg>';
  c.querySelector(".card-head").insertBefore(dial, c.querySelector(".dot"));

  const head = el("div");
  const chip = el("span","chip");
  chip.innerHTML =
    '<svg viewBox="0 0 24 24" style="width:.85em;height:.85em;vertical-align:-.1em;' +
    'margin-right:.35em"><path d="M12 3.2 7.4 10a5.4 5.4 0 1 0 9.2 0Z" fill="none" ' +
    'stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg>Raw';
  head.appendChild(chip);
  b.appendChild(head);

  // The year is the headline, and it is not a tap target: the rain unit
  // follows the server setting so a stray tap cannot switch the wall display
  // into millimetres.
  b.appendChild(hero(fx(rain(d.rain_year_mm), rainDp()), prefs.rain,
                     raining ? "cold" : null, null));

  // Say what the total is measured against, and — more important — say when
  // the record actually starts. A week-old install must not let seven days of
  // rain pose as a year of it.
  if (joke) {
    // What is falling outranks the year-to-date comparison while it falls.
    b.appendChild(caption(joke + (TEST_RAIN ? " · preview" : ""), "cold"));
    if (snowing) {
      // The totals below are rain: snow barely registers on the Tempest, and
      // may arrive later as a burst of "rain" when it melts on the sensor.
      const note = el("div", "sub");
      note.style.textAlign = "center";
      note.textContent = "The gauge under-counts snow";
      b.appendChild(note);
    }
  }
  else if (enough) {
    // The fill says how much of a year's rain has fallen; this says whether
    // that is a lot or a little for the stretch it covers, which is the
    // question people mean when they look at the gauge.
    const pct = Math.round(yearIn / expect * 100);
    b.appendChild(caption(pct + "% of normal " + (start > jan1
      ? "since " + start.toLocaleDateString(undefined,
          {month: "short", day: "numeric"})
      : "this year"), pct < 85 ? "yellow" : null));
  }
  else if (monthly)
    b.appendChild(caption(d.rain_from ? "Only since " + d.rain_from
                                      : "No rain recorded yet", "yellow"));
  else
    b.appendChild(caption(raining ? "Raining now" : "Currently dry",
                          raining ? "cold" : null));

  b.appendChild(el("div","mid"));
  b.appendChild(cells([
    {k:"Rate",  v:fx(rain(d.rain_rate_mm_h), rainDp()), u:prefs.rain+"/hr",
     inline:true, small:true, tone:raining ? "cold" : ""},
    {k:"Today", v:fx(rain(d.rain_today_mm), rainDp()), u:prefs.rain, inline:true, small:true},
    {k:"Yday",  v:fx(rain(d.rain_yday_mm), rainDp()),  u:prefs.rain, inline:true, small:true},
  ]));
  b.appendChild(cells([
    {k:"Month", v:fx(rain(d.rain_month_mm), rainDp()), u:prefs.rain, inline:true, small:true},
    {k:"Year",  v:fx(rain(d.rain_year_mm), rainDp()),  u:prefs.rain, inline:true, small:true},
  ]));
  return c;
}

/* The year's rain filling the card like a rain gauge, against a normal year
   where you are (TEMPEST_RAIN_NORMAL, in inches — NOAA publishes the figure).

   The fill is the literal fraction, so early in the year it is honestly
   nearly empty. That on its own would read as a drought every January, which
   is what the dashed pace line is for: it sits where a normal year would be
   by today, so above the line is a wet year and below it a dry one. Without
   a normal configured there is nothing to fill against and the card just
   shows its figures. */
/* A monthly figure read for one particular day. Monthly normals are
   mid-month values, so interpolate between the two nearest midpoints rather
   than stepping on the 1st: by 30 September the September figure is already
   most of the way to October's, and here that is thirteen degrees. */
function monthlyAt(vals, dt){
  const y = dt.getFullYear(), m = dt.getMonth();
  const mid = (mm) => new Date(y, mm, 15);
  const after = dt >= mid(m);
  const a = after ? m : (m + 11) % 12;
  const from = after ? mid(m) : mid(m - 1);
  const to   = after ? mid(m + 1) : mid(m);
  const t = Math.max(0, Math.min(1, (dt - from) / (to - from)));
  return vals[a] + (vals[(a + 1) % 12] - vals[a]) * t;
}

/* Normal rainfall between two dates, in inches, from twelve monthly figures
   pro-rated by the days in each month. A day at a time rather than arithmetic
   on month boundaries: at most 365 turns, and obviously right. */
function normalBetween(monthly, start, end){
  let total = 0;
  const d = new Date(start);
  while (d <= end) {
    total += monthly[d.getMonth()] /
             new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    d.setDate(d.getDate() + 1);
  }
  return total;
}

function rainFill(gotIn, normalIn, pace){
  const n = el("div","rainfill");
  if (!normalIn || gotIn == null) return n;
  const clamp = (v) => Math.max(0, Math.min(1, v));
  const got = clamp(gotIn / normalIn), want = clamp(pace);

  const level = el("div","level");
  level.style.height = (got * 100).toFixed(1) + "%";
  n.appendChild(level);

  // The gap between the two, as a band. Above normal it brightens the top of
  // the water; below, it tints the dry card the water has not reached.
  const gap = el("div", "gap " + (got >= want ? "over" : "under"));
  gap.style.bottom = (Math.min(got, want) * 100).toFixed(1) + "%";
  gap.style.height = (Math.abs(got - want) * 100).toFixed(1) + "%";
  n.appendChild(gap);

  const mark = el("div","pace");
  mark.style.bottom = (want * 100).toFixed(1) + "%";
  n.appendChild(mark);
  return n;
}

function buildSky(s){
  const d = s.derived, o = s.obs, sun = s.sun || {}, moon = s.moon || {};
  const {card:c, body:b} =
    // Sun and moon are worked out here from the location and the clock, with
    // nothing to fetch and nothing to fail, so this dot has only one honest
    // colour. The hub going quiet is not this card's news.
    card("sky","Astronomy", wiMoon(moon.age_days), "yellow", "live");
  if (sun.rise && sun.set) {
    b.appendChild(cells([
      {k:wi("sunrise")+" Sunrise", v:clock(sun.rise), tone:"accent", small:true, raw:true},
      {k:sun.next_label || "Next", v:gap(sun.next_s), small:true},
      {k:wi("sunset")+" Sunset", v:clock(sun.set), tone:"cold", small:true, raw:true},
    ]));
  } else {
    const note = sun.kind === "up" ? "Midnight sun — no sunset today"
      : sun.kind === "down" ? "Polar night — no sunrise today"
      : "Set --lat and --lon on the server for sun times";
    b.appendChild(caption(note));
  }

  const a = skyArc(sun, moon); a.classList.add("arc"); b.appendChild(a);

  b.appendChild(cells([
    {k:"UV index", v:o.uv == null ? DASH : o.uv.toFixed(1),
     tone:uvClass(o.uv), small:true, sub:d.uv_category || "", subTone:uvClass(o.uv)},
    {k:"Brightness", v:o.lux == null ? DASH : Math.round(o.lux).toLocaleString(),
     small:true, sub:"lux"},
    {k:"Radiation", v:o.solar == null ? DASH : Math.round(o.solar),
     small:true, sub:"W/m²"},
  ]));

  if (moon.rose || moon.next_rise) {
    const row = el("div","moonrow");
    const add = (k, t) => {
      const i = el("div","item");
      i.appendChild(el("span","k", k));      // k already carries a glyph

      i.appendChild(el("span","t", esc(t)));
      row.appendChild(i);
    };
    add(wi("moonrise")+"Rose", clock(moon.rose));
    add(wi("moonset")+"Set", clock(moon.set));
    add(wi("moonrise")+"Rises", moon.next_rise ? dayClock(moon.next_rise) : DASH);
    b.appendChild(row);
  }

  const phase = el("div","phase");
  phase.innerHTML = '<i class="wi" aria-hidden="true">' + wiMoon(moon.age_days) + '</i>' +
    '<span class="caption" style="letter-spacing:.085em">' +
    esc((moon.name || "") + "  ·  " + Math.round((moon.illum || 0)*100) + "% lit") +
    '</span>';
  b.appendChild(phase);

  if (moon.new || moon.full) {
    const cor = el("div","corners");
    cor.appendChild(el("span", null, "New: " + shortDate(moon.new)));
    cor.appendChild(el("span", null, "Full: " + shortDate(moon.full)));
    b.appendChild(cor);
  }
  return c;
}

function skyArc(sun, moon){
  // The curves are drawn in a stretched SVG so they always span the card, but
  // the Sun and Moon are HTML dots on top — a non-uniform viewBox would squash
  // a circle into an ellipse on tall cards.
  const wrap = el("div","mid");
  wrap.style.position = "relative";
  const W = 100, H = 42, horizon = H - 3, amp = horizon - 3;
  const curve = (x0, x1) => {
    let p = "";
    for (let i = 0; i <= 40; i++) {
      const f = i/40, x = x0 + (x1-x0)*f;
      p += (i ? "L" : "M") + x.toFixed(2) + " " +
           (horizon - amp*Math.sin(Math.PI*f)).toFixed(2) + " ";
    }
    return p;
  };
  const now = Date.now()/1000;
  const hasMoon = moon && moon.rose && moon.set && moon.set > moon.rose;

  wrap.innerHTML =
    '<svg class="plot" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+
      '<line x1="0" y1="'+horizon+'" x2="'+W+'" y2="'+horizon+'" '+
        'stroke="var(--rule)" vector-effect="non-scaling-stroke"/>'+
      (hasMoon ? '<path d="'+curve(-18,118)+'" fill="none" stroke="var(--inset-edge)" '+
        'stroke-width="1.1" stroke-dasharray="2 2" vector-effect="non-scaling-stroke"/>' : "")+
      '<path d="'+curve(0,W)+'" fill="none" stroke="var(--inset-edge)" '+
        'stroke-width="1.4" vector-effect="non-scaling-stroke"/>'+
    '</svg>';

  const place = (frac, x0, x1, cls, html) => {
    const x = x0 + (x1-x0)*frac;          // already a 0..1 fraction of width
    const y = horizon - amp*Math.sin(Math.PI*frac);
    const n = el("div", cls, html);
    n.style.position = "absolute";
    n.style.left = (x*100).toFixed(2) + "%";
    n.style.top = (y/H*100).toFixed(2) + "%";
    n.style.transform = "translate(-50%,-50%)";
    wrap.appendChild(n);
  };

  if (hasMoon) {
    const mf = (now - moon.rose)/(moon.set - moon.rose);
    if (mf >= 0 && mf <= 1) place(mf, -0.18, 1.18, "body-moon", "");
  }
  if (sun && sun.rise && sun.set && sun.set > sun.rise) {
    const f = (now - sun.rise)/(sun.set - sun.rise);
    if (f >= 0 && f <= 1) place(f, 0, 1, "body-sun", "");
    else {
      const note = el("div","caption");
      note.style.position = "absolute";
      note.style.left = "50%"; note.style.top = "42%";
      note.style.transform = "translate(-50%,-50%)";
      note.textContent = "Below horizon";
      wrap.appendChild(note);
    }
  }
  return wrap;
}

/* Forecast. The hub cannot predict anything, so this is the one card fed
   from outside — Open-Meteo, fetched by the server, cached, and failing soft.
   Where the station measures a value better than a model can (wind, feels
   like, humidity) the card shows the station's own reading. */
function buildForecast(s){
  const fc = s.forecast || {};
  const {card:c, body:b} = card("fc","Forecast","day-sunny","yellow",srcHealth(s.forecast));
  headAction(c, "Show the ten-day outlook", () => toggleOutlook(true));

  if (!fc.available) {
    b.appendChild(el("div","mid"));
    b.appendChild(caption(fc.error || "Forecast unavailable"));
    b.appendChild(el("div","mid"));
    return c;
  }

  const cur = fc.current || {};
  const days = fc.days || [];
  const today = days[0] || {};
  const cond = wmo(cur.code, cur.is_day);
  const d = s.derived, o = s.obs;

  const head = el("div","fc-now");
  const nowC = o.temp_c != null ? o.temp_c : cur.temp_c;
  head.innerHTML =
    '<div class="fc-cond">' + esc(cond.label) + '</div>' +
    '<div class="fc-line">' +
      wi(cond.glyph, "color:var(--yellow)") +
      '<span class="fc-temp">' + esc(fg(temp(nowC))) + '</span>' +
      '<span class="fc-unit">' + esc(prefs.temp) + '</span>' +
    '</div>';
  b.appendChild(head);

  b.appendChild(cells([
    {k:"Wind", v:fg(wind(o.wind_avg_ms)), u:o.wind_avg_ms == null ? "" : prefs.wind,
     small:true, inline:true},
    {k:"Feels", v:fg(temp(d.feels_c)), u:d.feels_c == null ? "" : prefs.temp,
     small:true, inline:true},
    {k:"Precip", v:today.pop == null ? DASH : today.pop, u:today.pop == null ? "" : "%",
     small:true, inline:true},
  ]));
  b.appendChild(cells([
    {k:"High", v:fg(temp(today.tmax_c)), u:today.tmax_c == null ? "" : prefs.temp,
     tone:"red", small:true, inline:true},
    {k:"Low", v:fg(temp(today.tmin_c)), u:today.tmin_c == null ? "" : prefs.temp,
     tone:"cold", small:true, inline:true},
    {k:"Humid", v:o.rh == null ? DASH : Math.round(o.rh), u:o.rh == null ? "" : "%",
     small:true, inline:true},
  ]));

  const strip = el("div","fc-strip");
  for (const day of days.slice(1, 4)) {
    const w = wmo(day.code, true);
    const cell = el("div","fc-day");
    cell.innerHTML =
      '<div class="k">' + esc(weekday(day.date)) + '</div>' +
      '<div class="fc-ico">' + wi(w.glyph) + '</div>' +
      '<div class="fc-hl"><span class="red">' + esc(fg(temp(day.tmax_c))) +
        '</span><span class="sep">/</span><span class="cold">' +
        esc(fg(temp(day.tmin_c))) + '</span></div>' +
      '<div class="fc-pop">' + (day.pop == null ? "" : esc(day.pop + "%")) + '</div>';
    strip.appendChild(cell);
  }
  b.appendChild(strip);
  return c;
}

function weekday(iso){
  if (!iso) return "";
  const [y, m, dd] = iso.split("-").map(Number);
  return new Date(y, m - 1, dd).toLocaleDateString([], {weekday:"short"});
}

/* Guarantee the content clears the card, whatever the platform's fonts do.
   Sizing by container query gets close, but font metrics differ between
   machines — the same card that fits with Inter on a Mac can overflow with
   a fallback face elsewhere, and `overflow:hidden` then slices the text.
   So after laying out we measure, and trim --fit until it genuinely fits.
   Results are cached per card size, so the steady state costs one read. */
const fitCache = new Map();
const FIT_MIN = 0.6;

function fitCards(){
  for (const card of document.querySelectorAll(".card")) {
    // A two-sided card holds two bodies; only the one facing out is worth
    // measuring, and each side is sized on its own.
    const flipped = card.classList.contains("flipped");
    const body = card.querySelector(flipped ? ".face.back .card-body"
                                            : ".card-body");
    if (!body) continue;
    const w = card.clientWidth, h = card.clientHeight;
    if (!w || !h) continue;
    const key = card.id + (flipped ? "#back" : "");
    const cached = fitCache.get(key);
    let fit = (cached && cached.w === w && cached.h === h) ? cached.fit : 1;
    card.style.setProperty("--fit", fit);

    // Width as well as height. Measuring only height let a long word run off
    // the side of a card unnoticed — the Pollen card's "Very high" needed 457
    // pixels of a 372 pixel card on a phone and was simply clipped, with the
    // fit left at 1 because nothing was too tall.
    const overflows = () => body.scrollHeight > body.clientHeight + 1
                         || body.scrollWidth  > body.clientWidth  + 1;

    let guard = 0;
    while (overflows() && fit > FIT_MIN && guard++ < 14) {
      fit = Math.max(FIT_MIN, Math.round((fit - 0.035) * 1000) / 1000);
      card.style.setProperty("--fit", fit);
    }
    // reclaim room if the card grew again
    while (fit < 1 && guard++ < 26) {
      const next = Math.min(1, Math.round((fit + 0.02) * 1000) / 1000);
      card.style.setProperty("--fit", next);
      if (overflows()) {
        card.style.setProperty("--fit", fit);
        break;
      }
      fit = next;
    }
    fitCache.set(key, {w, h, fit});
  }
}

let radarNode = null;                        // one iframe, reused

function buildRadar(s){
  const {card:c, body:b} = card("radar","Radar","na","cold",s.health);
  c.querySelector(".card-head .wi").outerHTML =
    '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" ' +
    'style="color:var(--cold)"><circle cx="12" cy="12" r="8.5" ' +
    'stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="4" ' +
    'stroke="currentColor" stroke-width="1.8"/><path d="M12 12 19 7" ' +
    'stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
  if (s.lat == null || s.lon == null) {
    b.appendChild(el("div","mid"));
    b.appendChild(caption("Set the station location for radar"));
    b.appendChild(el("div","mid"));
    return c;
  }
  if (!radarNode) {
    radarNode = el("div","radar-host");
    radarNode.style.cssText = "flex:1;min-height:0;border-radius:6px;overflow:hidden";
    const f = document.createElement("iframe");
    f.src = windyUrl(s.lat, s.lon, 7);
    f.loading = "lazy";
    f.referrerPolicy = "no-referrer";
    f.title = "Weather radar";
    f.style.cssText = "width:100%;height:100%;border:0;display:block";
    radarNode.appendChild(f);
  }
  b.appendChild(radarNode);                 // moved, never rebuilt
  return c;
}

function buildLightning(s){
  const d = s.derived;
  const {card:c, body:b} = card("bolt","Lightning","lightning","yellow",s.health);
  const st = stormState(d, s.now || Date.now() / 1000);
  c.insertBefore(stormSky(st, d.strikes_1h), c.firstChild);
  const n = d.strikes_today || 0;
  b.appendChild(hero(String(n), "today", n ? "yellow" : null));
  // Close by, the card says so plainly. It is the one weather on here that
  // matters in the next ten minutes.
  // The preview has no reading of its own, so the distance comes from
  // whichever of the two knows it.
  const nearKm = d.strike_nearest_km != null ? d.strike_nearest_km
               : st.mi != null ? st.mi * 1.609 : null;
  const said =
    st.kind === "overhead" ? ["Overhead · " + fg(dist(nearKm)) + " " + prefs.dist, "yellow"]
  : st.kind === "nearby" ? ["Storm nearby", "yellow"]
  : st.kite && st.last && st.last.ts ? ["Nothing since " + shortDate(st.last.ts), "label"]
  : [n ? "Strikes detected" : "No activity detected", n ? "yellow" : "label"];
  b.appendChild(caption(said[0], said[1]));
  b.appendChild(el("div","mid"));
  const last = d.strike_last;
  b.appendChild(cells([
    {k:"Nearest", v:fg(dist(d.strike_nearest_km)),
     u:d.strike_nearest_km == null ? "" : prefs.dist, small:true,
     tone:(d.strike_nearest_km != null && d.strike_nearest_km < 10) ? "accent" : ""},
    {k:"Last strike", v:last ? clock(last.ts) : DASH, small:true,
     sub:last ? fg(dist(last.dist_km))+" "+prefs.dist : ""},
  ]));
  b.appendChild(cells([
    {k:"Last hour", v:String(d.strikes_1h || 0), small:true},
    {k:"Last 3 hr", v:String(d.strikes_3h || 0), small:true},
    {k:"Avg dist", v:fg(dist(s.obs.strike_dist_km)),
     u:s.obs.strike_dist_km == null ? "" : prefs.dist, small:true, tone:"label"},
  ]));
  return c;
}

/* Hottest and coldest. Live readings widen today's high and low, and the
   nightly sweep fills the rest of the year from the station's own record,
   so this means something from the first run rather than only counting
   from whenever the dashboard was last restarted. */
function buildRecords(s){
  const r = s.records || {};
  const {card:c, body:b} = card("records","Records","thermometer","red",s.health);
  const year = r.year, month = r.month, all = r.all;

  if (!year) {
    b.appendChild(el("div","mid"));
    b.appendChild(caption("Collecting — records build as history arrives"));
    b.appendChild(el("div","mid"));
    return c;
  }

  const nice = iso => {
    if (!iso) return "";
    const [y, m, d] = iso.split("-").map(Number);
    return new Date(y, m - 1, d).toLocaleDateString([], {month:"short", day:"numeric"});
  };

  // the year's extremes lead, since that is the span people mean
  b.appendChild(cells([
    {k:"Hottest", v:fg(temp(year.hi[0])), u:prefs.temp, tone:"red",
     sub:nice(year.hi[1])},
    {k:"Coldest", v:fg(temp(year.lo[0])), u:prefs.temp, tone:"cold",
     sub:nice(year.lo[1])},
  ]));

  // The graphic: every temperature the station has ever recorded, as one
  // band. The outlined section is this month, the marker is right now — so
  // you can see at a glance where today sits in the station's whole life.
  const lo = (all || year).lo[0], hi = (all || year).hi[0];
  const span = (hi - lo) || 1;
  const pct = v => Math.max(0, Math.min(100, ((v - lo) / span) * 100));
  const g = el("div","gauge-span");
  const now = s.obs.temp_c;
  let inner = '<div class="track"></div>';
  if (month) {
    const a = pct(month.lo[0]), bb = pct(month.hi[0]);
    inner += '<div class="month" style="left:' + a.toFixed(1) +
             '%;width:' + Math.max(1.5, bb - a).toFixed(1) + '%"></div>';
  }
  if (now != null) {
    inner += '<div class="now" style="left:' + pct(now).toFixed(1) + '%"></div>' +
             '<div class="nowlab" style="left:' + pct(now).toFixed(1) + '%">' +
             esc(fg(temp(now)) + prefs.temp) + '</div>';
  }
  inner += '<span class="end lo">' + esc(fg(temp(lo)) + prefs.temp) + '</span>' +
           '<span class="end hi">' + esc(fg(temp(hi)) + prefs.temp) + '</span>';
  g.innerHTML = inner;
  b.appendChild(g);

  if (month) {
    b.appendChild(cells([
      {k:"Month high", v:fg(temp(month.hi[0])), u:prefs.temp, tone:"red",
       small:true, sub:nice(month.hi[1])},
      {k:"Month low", v:fg(temp(month.lo[0])), u:prefs.temp, tone:"cold",
       small:true, sub:nice(month.lo[1])},
    ]));
  }
  if (all && all.days > (year.days || 0)) {
    b.appendChild(cells([
      {k:"All-time high", v:fg(temp(all.hi[0])), u:prefs.temp, tone:"red",
       small:true, sub:nice(all.hi[1])},
      {k:"All-time low", v:fg(temp(all.lo[0])), u:prefs.temp, tone:"cold",
       small:true, sub:nice(all.lo[1])},
    ]));
  }

  const onRecord = (all && all.days) || year.days || 0;
  b.appendChild(caption(onRecord + (onRecord === 1 ? " day" : " days") +
                        " on record"));
  return c;
}

/* US EPA air quality bands. Open-Meteo covers North America for this, even
   though its pollen model does not. */
const AQI_BANDS = [
  [50,  "Good",                           "#3ea72d"],
  [100, "Moderate",                       "#d8c400"],
  [150, "Unhealthy for sensitive groups", "#f18b00"],
  [200, "Unhealthy",                      "#e53210"],
  [300, "Very unhealthy",                 "#8f3f97"],
  [1e9, "Hazardous",                      "#a02036"],
];
function aqiBand(v){
  if (v == null) return ["—", "var(--muted)"];
  for (const [limit, label, colour] of AQI_BANDS)
    if (v <= limit) return [label, colour];
  return ["—", "var(--muted)"];
}

function buildAirQuality(s){
  const a = s.air || {};
  const {card:c, body:b} = card("air","Air quality","fog","green",srcHealth(s.air));
  if (!a.available) {
    b.appendChild(el("div","mid"));
    b.appendChild(caption(a.error || "Air quality unavailable"));
    b.appendChild(el("div","mid"));
    return c;
  }
  const aqi = a.us_aqi;
  const [label, colour] = aqiBand(aqi);

  const hero = el("div","hero");
  hero.innerHTML = '<span class="v" style="color:' + colour + '">' +
    esc(aqi == null ? DASH : Math.round(aqi)) + '</span>' +
    '<span class="u">US AQI</span>';
  b.appendChild(hero);
  b.appendChild(caption(label, null));
  b.querySelector(".caption").style.color = colour;

  // where this sits on the scale, 0 to 300
  const g = el("div","gauge-span");
  const pos = aqi == null ? null : Math.max(0, Math.min(100, (aqi / 300) * 100));
  let inner = '<div class="track" style="background:linear-gradient(90deg,' +
    '#3ea72d 0%,#3ea72d 16%,#d8c400 17%,#d8c400 33%,#f18b00 34%,#f18b00 50%,' +
    '#e53210 51%,#e53210 66%,#8f3f97 67%,#8f3f97 100%)"></div>';
  if (pos != null) {
    inner += '<div class="now" style="left:' + pos.toFixed(1) + '%"></div>';
  }
  inner += '<span class="end lo">0</span><span class="end hi">300+</span>';
  g.innerHTML = inner;
  b.appendChild(g);

  const n = v => v == null ? DASH : (v >= 100 ? Math.round(v) : v.toFixed(1));
  b.appendChild(cells([
    {k:"PM2.5", v:n(a.pm2_5), small:true, sub:"µg/m³"},
    {k:"PM10",  v:n(a.pm10),  small:true, sub:"µg/m³"},
    {k:"Ozone", v:n(a.ozone), small:true, sub:"µg/m³"},
  ]));
  b.appendChild(caption("Open-Meteo", "faint"));
  return c;
}

/* Tomorrow.io reports each pollen type on a 0-5 index. */
const POLLEN_WORDS = ["None", "Very low", "Low", "Medium", "High", "Very high"];
const POLLEN_COLOURS = ["var(--muted)", "var(--uv-low)", "var(--uv-low)",
                        "var(--uv-mod)", "var(--uv-high)", "var(--uv-vhigh)"];
function pollenWord(v){
  if (v == null) return ["—", "var(--muted)"];
  const i = Math.max(0, Math.min(5, Math.round(v)));
  return [POLLEN_WORDS[i], POLLEN_COLOURS[i]];
}

function buildPollen(s){
  const p = s.pollen || {};
  const {card:c, body:b} = card("pollen","Pollen","sprinkle","green",srcHealth(s.pollen));
  if (!p.available) {
    b.appendChild(el("div","mid"));
    b.appendChild(caption(p.error || "Pollen unavailable"));
    const note = el("div","sub");
    note.style.textAlign = "center";
    note.textContent = /key/i.test(p.error || "")
      ? "Check the key, and that the Pollen API is enabled on that project."
      : "No free keyless source covers North America. Add a Google Pollen key in settings.";
    b.appendChild(note);
    b.appendChild(el("div","mid"));
    return c;
  }

  const cats = p.categories || {};
  // Prefer Google's own wording; fall back to the index only if absent.
  const vals = [["tree", p.tree], ["grass", p.grass], ["weed", p.weed]]
                 .filter(x => x[1] != null);
  const worstKey = vals.length
    ? vals.reduce((a, x) => x[1] > a[1] ? x : a)[0] : null;
  const worstVal = worstKey ? (worstKey === "tree" ? p.tree
                    : worstKey === "grass" ? p.grass : p.weed) : null;
  const word = worstKey ? (cats[worstKey] || pollenWord(worstVal)[0]) : DASH;
  const colour = pollenWord(worstVal)[1];

  const hero = el("div","hero");
  hero.innerHTML = '<span class="v" style="color:' + colour + '">' +
    esc(word) + '</span>';
  b.appendChild(hero);
  b.appendChild(caption(worstKey ? "Highest: " + worstKey : "No pollen reported"));
  b.appendChild(pollenFace(worstVal));

  const one = (label, key, v) => ({
    k: label,
    v: v == null ? DASH : (cats[key] || pollenWord(v)[0]),
    small: true,
    sub: v == null ? "out of season" : (Math.round(v) + " / 5"),
  });
  const row = cells([one("Tree", "tree", p.tree),
                     one("Grass", "grass", p.grass),
                     one("Weed", "weed", p.weed)]);
  const cellVals = row.querySelectorAll(".cell .v");
  [p.tree, p.grass, p.weed].forEach((v, i) => {
    if (cellVals[i]) cellVals[i].style.color =
      v == null ? "var(--faint)" : pollenWord(v)[1];
  });
  b.appendChild(row);

  // Which plants are actually releasing right now is the useful part.
  const plants = p.plants || [];
  // Eight plants in season is a long line, and captions are one line with an
  // ellipsis — so this one may take two, which is enough for a whole season's
  // worth at any card size. The title carries the full list either way.
  const inSeason = caption(
    plants.length ? "In season: " + plants.map(x => x.name).join(" · ")
                  : "Nothing in season",
    plants.length ? "muted wrap2" : "faint");
  if (plants.length) inSeason.title = plants.map(x => x.name).join(", ");
  b.appendChild(inSeason);
  b.appendChild(caption("Google Pollen", "faint"));
  return c;
}

function buildHardware(s){
  const h = s.hardware || {};
  const st = h.station || {}, hub = h.hub || {};
  const {card:c, body:b} = card("hardware","Station","na","cyan",s.health);
  // no weather glyph suits hardware; draw a battery instead
  const icon = c.querySelector(".card-head .wi");
  if (icon) icon.outerHTML =
    '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" ' +
    'style="color:var(--cyan)"><rect x="2" y="7" width="17" height="10" ' +
    'rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M21 10.5v3" ' +
    'stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>' +
    '<rect x="4.5" y="9.5" width="8" height="5" rx="1" fill="currentColor"/></svg>';

  const v = h.battery_v, pctv = h.battery_pct;
  const tone = pctv == null ? "text" : pctv > 0.4 ? "green"
             : pctv > 0.15 ? "accent" : "red";
  b.appendChild(hero(v == null ? DASH : v.toFixed(2), "V",
                     null, "var(--" + tone + ")"));

  // charge level, and which way it is going
  const g = el("div","gauge-span");
  g.innerHTML = '<div class="track" style="background:var(--rule)">' +
    '<div style="position:absolute;left:0;top:0;bottom:0;width:' +
    ((pctv == null ? 0 : pctv * 100).toFixed(1)) + '%;background:var(--' +
    tone + ');border-radius:.45em"></div></div>' +
    '<span class="end lo">2.35 V</span><span class="end hi">2.80 V</span>';
  b.appendChild(g);

  const d24 = h.battery_24h_delta;
  b.appendChild(caption(
    pctv == null ? "Waiting for a reading"
    : (Math.round(pctv * 100) + "% charge" +
       (d24 == null ? "" : d24 > 0.005 ? " · charging"
        : d24 < -0.005 ? " · discharging" : " · steady")),
    tone === "green" ? "green" : tone === "red" ? "red" : "accent"));

  const dbm = x => x == null ? DASH : Math.round(x) + " dBm";
  b.appendChild(cells([
    {k:"Firmware", v:st.firmware == null ? DASH : String(st.firmware), small:true,
     sub:"station"},
    {k:"Uptime", v:h.station_uptime || DASH, small:true, sub:"station"},
    {k:"Signal", v:dbm(st.rssi), small:true, sub:"to hub"},
  ]));
  b.appendChild(cells([
    {k:"Hub fw", v:hub.firmware == null ? DASH : String(hub.firmware), small:true},
    {k:"Hub up", v:h.hub_uptime || DASH, small:true},
    {k:"Hub signal", v:dbm(hub.rssi), small:true, sub:"to wifi"},
  ]));

  const faults = h.faults || [];
  const sensors = caption(
    faults.length ? faults.join(" · ")
    : (st.sensor_status == null ? "Sensor status not reported yet"
                                : "All sensors reporting"),
    faults.length ? "red" : "green");
  // Thirteen cards on a short display leaves this one about 160 pixels, and
  // the fit pass bottoms out still overflowing. The line that goes first is
  // the one that only says nothing is wrong. A fault keeps its line at any
  // size — that is the whole point of it.
  if (!faults.length) sensors.classList.add("whenroom");
  b.appendChild(sensors);
  return c;
}

/* Internet health, from Speedtest Tracker. Speed is the headline because it
   is what people look for, but the wording underneath is driven by packet
   loss, jitter and latency under load — a line can test fast and still be
   unusable, and those are the numbers that say so. */
/* A window in words: "6h", "7 days". Past a couple of days, hours are
   arithmetic the reader should not have to do. */
function spanWords(hours){
  const h = Math.round(hours || 0) || 24;
  return h >= 48 ? Math.round(h / 24) + " days" : h + "h";
}
const NET_TONE = {good:"green", degraded:"accent", down:"red", unknown:"muted"};
const NET_WORD = {good:"No problems", degraded:"Degraded", down:"Down",
                  unknown:"Unknown"};
const BLOAT_BAD = 100;                 // ms added under load — matches the server
const netMb = v => v == null ? DASH
  : (v >= 100 ? String(Math.round(v)) : v.toFixed(1));

/* Which side of the internet card is showing. The grid is rebuilt every two
   seconds, so this cannot live in the DOM: the class is put on the live node
   when you press the button, which is what runs the transition, and put back
   on each rebuilt node, which is what makes it survive. */
let netFlipped = false;
let netFlipTimer = null;
const NET_FLIP_SEC = 30;    // a wall display finds its way back on its own

function netFlip(on){
  netFlipped = on;
  const live = document.getElementById("card-internet");
  if (live) live.classList.toggle("flipped", on);
  clearTimeout(netFlipTimer);
  if (on) netFlipTimer = setTimeout(() => netFlip(false), NET_FLIP_SEC*1000);
  // The two sides are fitted independently but share the card's --fit, so
  // refit at the half-turn, while the card is edge-on: doing it now would
  // resize the face still facing the room. Sooner than the 2 s re-render.
  setTimeout(fitCards, 250);        // half of the CSS transition
}

const FLIP_ICON =
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
    'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3.5V9h-5.5"/></svg>';

/* The label belongs to the face, not to the flip state: a face always means
   the same thing, and a state-derived label would go stale between renders. */
function flipBtn(label, action){
  const b = el("button", "flipbtn", FLIP_ICON);
  b.type = "button";
  b.draggable = false;              // do not start a card drag from the button
  b.title = label;
  b.setAttribute("aria-label", label);
  b.addEventListener("click", (e) => { e.stopPropagation(); action(); });
  return b;
}

/* The flip button in a card's header. Taps anywhere on the card, header
   included, are handled by the listeners on #grid and #outlook; this adds only
   the button — the visible hint, and what a keyboard can reach. */
function headAction(c, label, action){
  const head = c.querySelector(".card-head");
  head.title = label;
  head.appendChild(flipBtn(label, action));
}

/* Speed against the plan rate, as a bar under the figure.

   The thresholds are fractions of the plan, not fixed Mbps: download and
   upload run on scales an order of magnitude apart, and a rule written for
   one paints the other permanently red. As fractions, "most of what I pay
   for" means the same thing in both.

   No plan rate, no bar — without a ceiling a bar has nothing to be a
   fraction of, and a full-looking one would be a lie. */
const SPEED_GOOD = 0.8;          // at or above this much of the plan
const SPEED_FAIR = 0.5;

function speedBar(v, cap){
  if (v == null || !cap) return null;
  const frac = Math.max(0, Math.min(1, v / cap));
  const tone = frac >= SPEED_GOOD ? "green" : frac >= SPEED_FAIR ? "yellow" : "red";
  const wrap = el("div", "gauge");
  const fill = el("div", "fill " + tone);
  fill.style.width = (frac * 100).toFixed(1) + "%";
  wrap.appendChild(fill);
  return wrap;
}

/* Latency across the window, idle against loaded. The band between the two
   lines is the bufferbloat, and it is the point of the plot: a line can test
   at full speed and still be unusable, and that shows up here as a thick
   band rather than a low number. Failed tests break the line and get a
   marker of their own, since a hole in the history is worth seeing. */
function netPlot(pts, tone){
  const W = 100, H = 46, top = 4, base = H - 6;   // the strip below holds labels
  const wrap = el("div", "mid netplot");
  const seen = pts.filter(p => p.ping != null || p.loaded != null);
  if (seen.length < 2) {
    wrap.appendChild(caption("Not enough tests yet"));
    return wrap;
  }
  const n = pts.length;
  const x = (i) => n === 1 ? W/2 : i/(n-1)*W;
  let hi = 0;
  for (const p of pts) hi = Math.max(hi, p.ping || 0, p.loaded || 0);
  hi = Math.max(50, hi*1.15);
  // Log scale, because one bad hour is ten times the normal figure and a
  // linear axis would press every good hour flat against the baseline —
  // losing exactly the band this plot exists to show. Decade rules give the
  // eye something absolute to read the curve against.
  const LO = 1;                                   // 1 ms floor
  const span = Math.log(hi/LO);
  const y = (v) => base - (Math.log(Math.max(v, LO)/LO)/span)*(base - top);

  // Each series is drawn in runs, so a failed test leaves a gap rather than a
  // straight line pretending the connection was fine across it.
  const line = (key) => {
    let d = "", pen = false;
    pts.forEach((p, i) => {
      if (p[key] == null) { pen = false; return; }
      d += (pen ? "L" : "M") + x(i).toFixed(2) + " " + y(p[key]).toFixed(2) + " ";
      pen = true;
    });
    return d.trim();
  };
  const band = () => {
    let d = "", run = [];
    const flush = () => {
      if (run.length > 1) {
        d += "M" + run.map(r => r[0].toFixed(2)+" "+r[1].toFixed(2)).join("L") +
             "L" + run.slice().reverse()
                      .map(r => r[0].toFixed(2)+" "+r[2].toFixed(2)).join("L") + "Z";
      }
      run = [];
    };
    pts.forEach((p, i) => {
      if (p.ping == null || p.loaded == null) { flush(); return; }
      run.push([x(i), y(p.loaded), y(p.ping)]);
    });
    flush();
    return d;
  };

  let marks = "";
  pts.forEach((p, i) => {
    const xi = x(i).toFixed(2);
    if (!p.ok)
      marks += '<line x1="'+xi+'" y1="'+top+'" x2="'+xi+'" y2="'+base+'" ' +
        'stroke="var(--red)" stroke-width="1.2" stroke-dasharray="2 2" ' +
        'vector-effect="non-scaling-stroke"/>';
    else if (p.loss)
      marks += '<line x1="'+xi+'" y1="'+top+'" x2="'+xi+'" y2="'+(top+4)+'" ' +
        'stroke="var(--red)" stroke-width="2" vector-effect="non-scaling-stroke"/>';
  });

  const decades = [10, 100, 1000].filter(v => v < hi);
  let rules = "";
  for (const v of decades)
    rules += '<line x1="0" y1="'+y(v).toFixed(2)+'" x2="'+W+'" y2="'+y(v).toFixed(2)+
      '" stroke="var(--rule)" stroke-dasharray="1 3" '+
      'vector-effect="non-scaling-stroke"/>';

  wrap.innerHTML =
    '<svg class="plot" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+
      rules+
      '<line x1="0" y1="'+base+'" x2="'+W+'" y2="'+base+'" stroke="var(--rule)" '+
        'vector-effect="non-scaling-stroke"/>'+
      marks+
      '<path d="'+band()+'" fill="var(--'+tone+')" fill-opacity=".22" stroke="none"/>'+
      '<path d="'+line("loaded")+'" fill="none" stroke="var(--'+tone+')" '+
        'stroke-width="1.6" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>'+
      '<path d="'+line("ping")+'" fill="none" stroke="var(--cold)" '+
        'stroke-width="1.6" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>'+
    '</svg>';

  const label = (text, css) => {
    const nd = el("div", "ax", esc(text));
    Object.assign(nd.style, css);
    wrap.appendChild(nd);
  };
  for (const v of decades)
    // Below the rule, not above it: the curve rides just over each decade,
    // so a label above would sit on top of the line it is labelling.
    label(v + " ms", {left:"0", top:(y(v)/H*100).toFixed(1)+"%",
                      transform:"translateY(15%)"});
  // Hung off the axis rather than the bottom of the box: the plot is stretched
  // to whatever height the card has left, and a strip measured in viewBox
  // units would drift further from the axis the taller the card gets.
  const foot = {top:(base/H*100).toFixed(1)+"%", transform:"translateY(20%)"};
  const oldest = pts.find(p => p.at);
  if (oldest) label(ago(Date.now()/1000 - oldest.at) + " ago",
                    Object.assign({left:"0"}, foot));
  label("now", Object.assign({right:"0"}, foot));
  return wrap;
}

/* The back of the card: what the line has actually been doing, test by test. */
function netDetail(b, n){
  const pts = Array.isArray(n.history) ? n.history : [];
  if (!pts.length) {
    b.appendChild(el("div","mid"));
    b.appendChild(caption("No test history yet"));
    b.appendChild(el("div","mid"));
    return;
  }
  const worst = (key) => {
    const vals = pts.map(p => p[key]).filter(v => v != null);
    return vals.length ? Math.max(...vals) : null;
  };
  const bloats = pts.filter(p => p.ping != null && p.loaded != null)
                    .map(p => p.loaded - p.ping);
  const peak = bloats.length ? Math.max(...bloats) : null;
  const tone = peak != null && peak > BLOAT_BAD ? "red" : "accent";
  const failed = pts.filter(p => !p.ok && !p.tool).length;
  const skipped = pts.filter(p => p.tool).length;
  const loss = worst("loss");
  const downs = pts.map(p => p.down).filter(v => v != null);
  const ups = pts.map(p => p.up).filter(v => v != null);
  const range = (a) => a.length < 2 ? null
    : netMb(Math.min(...a)) + "–" + netMb(Math.max(...a));

  b.appendChild(caption("Latency — idle vs under load", "faint"));
  b.appendChild(netPlot(pts, tone));
  // Short labels: three of them share a card, and a phone card is narrow.
  // The qualifier goes on the sub-line rather than into the label.
  b.appendChild(cells([
    {k:"Load", v:peak == null ? DASH : sign(peak, 0), u:"ms", small:true,
     sub:"worst", tone:(peak != null && peak > BLOAT_BAD) ? "red" : null},
    {k:"Loss", v:loss == null ? DASH : fg(loss), u:"%", small:true,
     sub:"worst", tone:loss ? "red" : null},
    {k:"Failed", v:String(failed), small:true,
     sub:"of " + pts.length + (skipped ? " · " + skipped + " didn't run" : ""),
     tone:failed ? "red" : null},
  ]));
  b.appendChild(cells([
    {k:"Down", v:downs.length ? netMb(n.avg_down) : DASH, u:"Mbps", small:true,
     sub:range(downs)},
    {k:"Up",   v:ups.length ? netMb(n.avg_up) : DASH, u:"Mbps", small:true,
     sub:range(ups)},
  ]));
  const bits = [pts.length + " test" + (pts.length === 1 ? "" : "s") +
                " over " + spanWords(n.window_h)];
  if (n.server) bits.push("via " + n.server);
  b.appendChild(caption(bits.join(" · "), "faint"));
}

/* A way into Speedtest Tracker itself, for the detail this card will not
   show. It belongs on the back whether or not there is any history yet —
   with none, it is the only thing there worth tapping. Not on the TV, where
   a second browser tab is no use to a remote. */
function netLink(n){
  const href = lanLink(n.url);
  if (!href) return null;
  const a = el("a", "linkbtn out");
  a.href = href;
  a.target = "_blank";
  a.rel = "noopener noreferrer";
  a.textContent = "Speedtest Tracker \u2197";
  // The card turns over when tapped anywhere, so this keeps its own tap,
  // exactly as the flip button does.
  a.addEventListener("click", (e) => e.stopPropagation());
  a.draggable = false;
  return a;
}

/* The server reaches its own services over the loopback address, which means
   nothing in a browser on another device. Anything pointed at this machine is
   rewritten to whatever address this page was opened on, so the link works
   from the sofa as well as from the NAS. */
function lanLink(url){
  if (!url) return "";
  try {
    const u = new URL(url, location.href);
    if (["127.0.0.1", "localhost", "0.0.0.0", "[::1]", "::1"].includes(u.hostname))
      u.hostname = location.hostname;
    return u.href;
  } catch (e) { return ""; }
}

function buildInternet(s){
  const n = s.internet || {};
  if (!n.available) {
    const {card:c, body:b} = card("internet","Internet","\u21c5","cold",srcHealth(n));
    b.appendChild(el("div","mid"));
    b.appendChild(caption(n.error || "Speedtest unavailable"));
    b.appendChild(el("div","mid"));
    return c;
  }

  // Two faces in one card. card() builds a head and a body, which is exactly
  // what a face needs, so borrow its children and drop the wrapper it came in.
  const c = el("div","card flip");
  c.id = "card-internet";
  if (netFlipped) c.classList.add("flipped");
  const flipper = el("div","flipper");
  c.appendChild(flipper);
  // The back carries no glyph: the arrows say "this is the internet card",
  // which the face you just turned over already told you.
  const face = (cls, glyph, label, to) => {
    const {card:tmp, body} = card("internet","Internet",glyph,"cold",srcHealth(n));
    const f = el("div","face " + cls);
    while (tmp.firstChild) f.appendChild(tmp.firstChild);
    // A tap anywhere on the card turns it over — the grid listener below the
    // outlook's. Header-only was the first version, on the reasoning that a
    // card which turns over when brushed is worse than one that needs aiming;
    // on the TV's pointer the header proved too small a target, and the owner
    // chose the whole card. Nothing on either face is clickable, so a tap
    // cannot have meant anything else. The button stays, off the TV — a hint,
    // and the part a keyboard can reach.
    const head = f.querySelector(".card-head");
    head.title = label;
    head.appendChild(flipBtn(label, () => netFlip(to)));
    flipper.appendChild(f);
    return body;
  };

  const b = face("front", "\u21c5", "Show the test history", true);
  const back = face("back", "", "Back to the summary", false);

  const tone = NET_TONE[n.status] || "muted";
  const pct = (v, plan) => (v == null || !plan) ? null
    : Math.round(v / plan * 100) + "% of " + Math.round(plan);

  const speeds = cells([
    {k:"Download", v:netMb(n.down), u:"Mbps", sub:pct(n.down, n.plan_down)},
    {k:"Upload",   v:netMb(n.up),   u:"Mbps", sub:pct(n.up, n.plan_up)},
  ], {grow:true});
  // Appended rather than passed through cells(): every other card in the
  // dashboard uses that helper unchanged, and one card wanting a bar is not
  // reason enough to grow the shared shape.
  const speedCells = speeds.querySelectorAll(".cell");
  [[n.down, n.plan_down], [n.up, n.plan_up]].forEach(([v, cap], i) => {
    const bar = speedBar(v, cap);
    if (bar) speedCells[i].appendChild(bar);
  });
  b.appendChild(speeds);

  b.appendChild(caption(NET_WORD[n.status] || "Unknown"));
  b.querySelector(".caption").style.color = "var(--" + tone + ")";

  const issues = Array.isArray(n.issues) ? n.issues : [];
  const list = el("div","sub");
  list.style.textAlign = "center";
  list.innerHTML = issues.length
    ? issues.map(esc).join("<br>")
    : esc("Nothing flagged in " + spanWords(n.window_h));
  if (issues.length) list.style.color = "var(--" + tone + ")";
  b.appendChild(list);

  b.appendChild(cells([
    {k:"Latency",   v:n.ping == null ? DASH : fg(n.ping), small:true, u:"ms"},
    {k:"Jitter",    v:n.jitter == null ? DASH : fg(n.jitter), small:true, u:"ms"},
    // "Under load" needs half again the width of its quarter-card cell on a
    // phone, and no font size that stays readable closes that gap. "Load" is
    // what the detail side already calls this number, so the two agree.
    {k:"Load", v:n.bloat == null ? DASH : sign(n.bloat, 0), small:true, u:"ms",
     tone:(n.bloat != null && n.bloat > BLOAT_BAD) ? "red" : null},
    {k:"Loss",      v:n.loss == null ? DASH : fg(n.loss), small:true, u:"%",
     tone:(n.loss != null && n.loss > 1) ? "red" : null},
  ]));

  const bits = [];
  if (n.isp) bits.push(n.isp);
  if (n.at) bits.push("tested " + ago(Date.now()/1000 - n.at) + " ago");
  if (n.avg_down != null)
    bits.push("avg " + netMb(n.avg_down) + " Mbps / " + n.tests + " tests");
  b.appendChild(caption(bits.join(" · ") || "Speedtest Tracker", "faint"));

  netDetail(back, n);
  const week = el("a", "linkbtn week");
  week.href = "#";
  week.textContent = "The last week";
  week.addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); toggleNet(true); });
  week.draggable = false;
  back.appendChild(week);
  const link = netLink(n);
  if (link) back.appendChild(link);
  return c;
}

/* Active weather alerts, worst first. */
/* ?testalert renders sample alerts so the banner can be checked without
   waiting for real weather. ?testalert alone shows one of every severity
   (worst three fit); ?testalert=minor,unknown picks specific ones. */
const SAMPLE_ALERTS = {
  extreme:  ["Tornado Warning",      "Tornado warning for northern McHenry County until 9:15 PM"],
  severe:   ["Severe Thunderstorm Warning", "Sixty mph gusts and quarter-size hail moving east at 40 mph"],
  moderate: ["Winter Weather Advisory", "Three to five inches of snow expected through Tuesday morning"],
  minor:    ["Flood Advisory",       "Minor flooding of low-lying roads along the Kishwaukee River"],
  unknown:  ["Special Weather Statement", "Patchy dense fog reducing visibility below a quarter mile"],
};
let TEST_ALERTS = (() => {          // let: /testall changes it as it loops
  const q = new URLSearchParams(location.search);
  if (!q.has("testalert")) return null;
  const sample = SAMPLE_ALERTS;
  const want = (q.get("testalert") || "").split(",").map(x => x.trim().toLowerCase())
                 .filter(x => x in sample);
  const keys = want.length ? want : ["extreme","severe","moderate","minor","unknown"];
  return sampleAlerts(keys);
})();

function sampleAlerts(keys){
  const sample = SAMPLE_ALERTS;
  const rank = {extreme:4, severe:3, moderate:2, minor:1, unknown:0};
  const hours = {extreme:1, severe:2, moderate:20, minor:50, unknown:0};
  return keys.map(k => ({
    event: sample[k][0], headline: sample[k][1], preview: true,
    ends: hours[k] ? new Date(Date.now() + hours[k] * 36e5).toISOString() : null,
    sender: "NWS Chicago IL",
    severity: k.charAt(0).toUpperCase() + k.slice(1), rank: rank[k],
  })).sort((a, b) => b.rank - a.rank);
}

/* When an alert stops, in words — "until 7:00 AM", "until tomorrow 7:00 AM",
   "until Sat 7:00 AM". NWS's own headline says this too, but last, after the
   event name a second time and the issue time, so on a narrow screen the end
   time was the part that got cut off. */
function alertUntil(a){
  const d = new Date(a.ends || a.expires || NaN);
  if (isNaN(d)) return "";
  const now = new Date(), tom = new Date(now);
  tom.setDate(now.getDate() + 1);
  const t = d.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
  const day = d.toDateString() === now.toDateString() ? ""
    : d.toDateString() === tom.toDateString() ? "tomorrow "
    : d - now > 6 * 864e5 ? d.toLocaleDateString([], {month:"short", day:"numeric"}) + " "
    : d.toLocaleDateString([], {weekday:"short"}) + " ";
  return "until " + day + t;
}

function renderAlerts(s){
  const host = document.getElementById("alerts");
  const list = TEST_ALERTS || (s.alerts && s.alerts.alerts) || [];
  if (!list.length) { host.className = ""; host.replaceChildren(); measureChrome(); return; }
  host.className = "show";
  host.replaceChildren(...list.slice(0, 3).map(a => {
    const n = el("div", "alert sev-" + (a.severity || "unknown").toLowerCase());
    // Our own short line rather than NWS's sentence. With no end time at all,
    // the headline is the only thing left to say, so it stands in. A preview
    // says so in the part that never gives way.
    const what = (a.preview ? "PREVIEW · " : "") + (alertUntil(a) || a.headline || "");
    n.innerHTML = '<span class="ev">' + esc(a.event) + '</span>' +
      (what ? '<span class="hl">' + esc(what) + '</span>' : '') +
      (a.sender ? '<span class="src">' + esc(a.sender) + '</span>' : '');
    return n;
  }));
  measureChrome();
}

let cfg = null;                     // last /api/config payload
let paused = false;                 // hold the 2 s re-render while dragging

async function loadConfig(){
  try {
    const r = await fetch("api/config", {cache:"no-store"});
    if (r.ok) cfg = await r.json();
  } catch (e) { /* the dashboard still runs on the server's defaults */ }
  return cfg;
}

async function saveConfig(patch, statusEl){
  try {
    const r = await fetch("api/config", {
      method: "POST",
      headers: {"Content-Type": "application/json", "X-Tempest-Config": "1"},
      body: JSON.stringify(patch),
    });
    const body = await r.json().catch(() => ({}));
    if (!r.ok || body.ok === false) throw new Error(body.error || ("HTTP " + r.status));
    cfg = body;
    if (statusEl) { statusEl.className = "state ok"; statusEl.textContent = "Saved."; }
    poll();
    return true;
  } catch (e) {
    if (statusEl) { statusEl.className = "state bad"; statusEl.textContent = "Could not save — " + e.message; }
    return false;
  }
}

function renderSettings(){
  const host = document.getElementById("settings");

    '<p class="note">Tick the cards you want, drag to reorder. ' +
    'This layout is shared by every screen — the TV included.</p>';

  const list = el("div","cardlist");

    const row = el("div","cardrow");
    row.draggable = true;
    row.dataset.card = name;
    row.innerHTML = '<span class="grip">⠿</span>' +
      '<span class="nm">' + esc(name) + '</span>' +
      '<input type="checkbox"' + (on.includes(name) ? " checked" : "") + '>';

  }
  wireRowDrag(list);

  const status = el("div","state");
  const apply = el("button","primary","Save layout");
  apply.addEventListener("click", () => {
    const picked = [...list.querySelectorAll(".cardrow")]

  });
  const applyRow = el("div","row");
  applyRow.append(apply, status);
  sheet.appendChild(applyRow);

  // ── secrets ───────────────────────────────────────────────────────────
  // One helper for both keys: reveal toggle, paste checks, and never
  // rendering the stored value, because the server does not return it.
  const secretField = (opts) => {
    const wrap = el("div");
    wrap.innerHTML = '<h2>' + esc(opts.title) + '</h2>' +
                     '<p class="note">' + opts.note + '</p>';

    const field = document.createElement("input");
    field.type = "password";
    field.autocomplete = "off";
    field.spellcheck = false;
    field.placeholder = opts.isSet ? "Already configured — type to replace it"
                                   : opts.placeholder;

    const EYE = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none">' +
      '<path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z" ' +
      'stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="12" r="3" ' +
      'stroke="currentColor" stroke-width="1.7"/>';
    const EYE_OPEN = EYE + '</svg>';
    const EYE_SHUT = EYE + '<path d="M4 20 20 4" stroke="currentColor" ' +
      'stroke-width="1.7" stroke-linecap="round"/></svg>';

    const eye = el("button", null, "");
    eye.type = "button";
    eye.style.cssText = "padding:.5em .7em;line-height:0";
    eye.setAttribute("aria-label", "Show");
    eye.innerHTML = EYE_OPEN;
    eye.addEventListener("click", () => {
      const show = field.type === "password";
      field.type = show ? "text" : "password";
      eye.innerHTML = show ? EYE_SHUT : EYE_OPEN;
      eye.setAttribute("aria-pressed", show ? "true" : "false");
      field.focus();
    });

    const hint = el("div","state");
    field.addEventListener("input", () => {
      const v = field.value;
      if (!v) { hint.className = "state"; hint.textContent = ""; return; }
      const notes = [v.length + " characters"];
      let bad = false;
      if (v !== v.trim()) { notes.push("leading or trailing space — trimmed on save"); bad = true; }
      if (/\s/.test(v.trim())) { notes.push("contains a space in the middle"); bad = true; }
      if (/[\u2018\u2019\u201c\u201d]/.test(v)) { notes.push("contains a curly quote"); bad = true; }
      hint.className = "state" + (bad ? " bad" : " ok");
      hint.textContent = notes.join(" · ");
    });

    const state = el("div","state",
                     opts.isSet ? "Status: configured." : "Status: not set.");
    const reset = () => {
      field.value = ""; hint.className = "state"; hint.textContent = "";
      field.type = "password"; eye.innerHTML = EYE_OPEN;
    };
    const save = el("button","primary","Save");
    save.addEventListener("click", async () => {
      if (!field.value.trim()) {
        state.className = "state bad"; state.textContent = "Nothing to save.";
        return;

      const patch = {}; patch[opts.field] = field.value;
      const ok = await saveConfig(patch, state);
      reset();
      if (ok) { state.className = "state ok"; state.textContent = opts.savedText; }
    });
    const clear = el("button", null, "Clear");
    clear.addEventListener("click", async () => {
      const patch = {}; patch[opts.field] = "";
      const ok = await saveConfig(patch, state);
      reset();
      if (ok) { state.className = "state"; state.textContent = "Status: not set."; }
    });

    const row = el("div","row");
    row.append(field, eye, save, clear);
    wrap.append(row, hint, state);
    return wrap;
  };

  sheet.appendChild(secretField({
    title: "WeatherFlow token",

      'start instead of only counting from when this started running. Get ' +
      'one at <a href="https://tempestwx.com/settings/tokens" target="_blank" ' +
      'rel="noopener noreferrer" style="color:var(--accent)">tempestwx.com</a>. ' +
      'Stored on the server and never sent back to a browser, including this one.',
  }));

  sheet.appendChild(secretField({
    title: "Pollen key",
    field: "pollen_key",
    isSet: !!(cfg && cfg.pollen_key_set),
    placeholder: "Paste your Google Pollen API key",
    savedText: "Saved. Fetching pollen.",
    note: 'Optional, and only needed for the Pollen card. No free keyless ' +
      'source covers North America — Open-Meteo\'s pollen model is Europe ' +
      'only. Enable the Pollen API in a ' +
      '<a href="https://console.cloud.google.com/" target="_blank" ' +
      'rel="noopener noreferrer" style="color:var(--accent)">Google Cloud</a> ' +
      'project and paste the key here for tree, grass and weed counts plus ' +
      'which plants are in season. Handled exactly like the token above.',
