  sheet.appendChild(secretField({
    title: "Speedtest token",
    field: "speedtest_token",
    isSet: !!(cfg && cfg.speedtest_token_set),
    placeholder: "Paste your Speedtest Tracker API token",
    savedText: "Saved. Fetching results.",
    note: 'Optional, and only needed for the Internet card. Create one under ' +
      'Profile \u2192 API tokens in your own Speedtest Tracker, with the ' +
      'results:read ability. The instance URL is set with ' +
      '<code>TEMPEST_SPEEDTEST_URL</code>; only the token lives here, ' +
      'handled exactly like the two above.',
  }));

  if (cfg && cfg.backfill && cfg.backfill.status && cfg.backfill.status !== "off") {
    const b = cfg.backfill;
    sheet.appendChild(el("div","state",
      "Backfill: " + b.status + (b.added ? " — " + b.added + " observations merged" : "") +
      (b.error ? " (" + b.error + ")" : "")));
  }
  host.replaceChildren(sheet);
}

/* Drag rows in the settings list. */
function wireRowDrag(list){
  let src = null;
  list.addEventListener("dragstart", e => {
    src = e.target.closest(".cardrow");
    if (!src) return;
    src.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
    try { e.dataTransfer.setData("text/plain", src.dataset.card); } catch (x) {}
  });
  list.addEventListener("dragend", () => {
    if (src) src.classList.remove("dragging");
    [...list.children].forEach(c => c.classList.remove("drag-over"));
    src = null;
  });
  list.addEventListener("dragover", e => {
    e.preventDefault();
    const over = e.target.closest(".cardrow");
    if (!over || over === src) return;
    [...list.children].forEach(c => c.classList.toggle("drag-over", c === over));
  });
  list.addEventListener("drop", e => {
    e.preventDefault();
    const over = e.target.closest(".cardrow");
    if (!over || !src || over === src) return;
    const rows = [...list.children];
    list.insertBefore(src, rows.indexOf(src) < rows.indexOf(over)
                           ? over.nextSibling : over);
    [...list.children].forEach(c => c.classList.remove("drag-over"));
  });
}

/* Drag the cards on the dashboard itself. */
function wireCardDrag(){
  let src = null;
  grid.addEventListener("dragstart", e => {
    src = e.target.closest(".card");
    if (!src) return;
    paused = true;                       // do not re-render mid-drag
    src.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
    try { e.dataTransfer.setData("text/plain", src.id); } catch (x) {}
  });
  grid.addEventListener("dragover", e => {
    if (!src) return;
    e.preventDefault();
    const over = e.target.closest(".card");
    [...grid.children].forEach(c => c.classList.toggle("drop-target",
                                                        c === over && c !== src));
  });
  grid.addEventListener("drop", e => {
    if (!src) return;
    e.preventDefault();
    const over = e.target.closest(".card");
    if (over && over !== src) {
      const kids = [...grid.children];
      grid.insertBefore(src, kids.indexOf(src) < kids.indexOf(over)
                             ? over.nextSibling : over);
    }
    [...grid.children].forEach(c => c.classList.remove("drop-target"));
  });
  grid.addEventListener("dragend", () => {
    if (src) src.classList.remove("dragging");
    [...grid.children].forEach(c => c.classList.remove("drop-target"));
    src = null;
    paused = false;
    const order = [...grid.children]
      .map(c => c.id.replace("card-", ""))
      .map(n => n === "bolt" ? "lightning" : n === "sky" ? "astronomy"
              : n === "pres" ? "pressure" : n === "temp" ? "temperature"
              : n === "rain" ? "rainfall" : n === "fc" ? "forecast" : n)
      .filter(n => (cfg && cfg.cards || []).includes(n));
    if (order.length && !TESTALL) saveConfig({slots: order});
  });
}

/* The full ten days the forecast feed already returns — the Forecast card
   only has room for three. Built as one card the size of the grid, from the
   Forecast card's own parts: the range of every day drawn as a plot across
   the top, so a warm spell or a cold snap is visible before any number is
   read, and the ten days underneath in the same strip the small card uses
   for its three. */
function renderOutlook(){
  const host = document.getElementById("outlook");
  const s = last || {};
  const fc = s.forecast || {};
  const days = fc.days || [];
  const {card:c, body:b} = card("outlook","Ten-day outlook","day-sunny","yellow",
                                srcHealth(fc));
  headAction(c, "Back to the cards", () => toggleOutlook(false));
  if (!fc.available || !days.length) {
    b.appendChild(el("div","mid"));
    b.appendChild(caption(fc.error || "Forecast unavailable"));
    b.appendChild(el("div","mid"));
    host.replaceChildren(c);
    return;
  }

  const todayIso = new Date().toISOString().slice(0, 10);
  const dateOf = (iso) => { const p = iso.split("-").map(Number);
                            return new Date(p[0], p[1] - 1, p[2]); };
  b.appendChild(outlookPlot(days, s.temp_normal_c, dateOf));

  const strip = el("div","fc-strip");
  for (const d of days) {
    const w = wmo(d.code, true);
    const cell = el("div","fc-day" + (d.date === todayIso ? " today" : ""));
    cell.innerHTML =
      '<div class="k">' + esc(d.date === todayIso ? "Today" : weekday(d.date)) + '</div>' +
      '<div class="date">' + esc(dateOf(d.date).toLocaleDateString([],
                              {month:"short", day:"numeric"})) + '</div>' +
      '<div class="fc-ico">' + wi(w.glyph) + '</div>' +
      '<div class="fc-hl"><span class="red">' + esc(fg(temp(d.tmax_c))) +
        '</span><span class="sep">/</span><span class="cold">' +
        esc(fg(temp(d.tmin_c))) + '</span></div>' +
      '<div class="fc-pop">' + (d.pop == null ? "" : esc(d.pop + "%")) + '</div>';
    cell.title = w.label;
    strip.appendChild(cell);
  }
  b.appendChild(strip);

  // The one-line reading the other cards end on: where the extremes fall.
  // Ten days hold two of most weekdays, so the day carries its date.
  const name = (d) => d.date === todayIso ? "today"
    : weekday(d.date) + " " + dateOf(d.date).getDate();
  const pick = (key, best) => days.filter(d => d[key] != null)
    .reduce((a, d) => a == null || best(d[key], a[key]) ? d : a, null);
  const warm = pick("tmax_c", (v, a) => v > a);
  const cold = pick("tmin_c", (v, a) => v < a);
  const wet  = pick("pop",    (v, a) => v > a);
  const bits = [];
  if (warm) bits.push("Warmest " + fg(temp(warm.tmax_c)) + "° " + name(warm));
  if (cold) bits.push("Coolest " + fg(temp(cold.tmin_c)) + "° " + name(cold));
  if (wet && wet.pop > 0) bits.push("Wettest " + wet.pop + "% " + name(wet));
  b.appendChild(caption(bits.join(" · ") || (fc.source || "")));
  host.replaceChildren(c);
  fitCards();                // render() skips its own pass while this is up
}

/* Highs and lows across the ten days, the band between them filled, with
   the normal range for the time of year behind — the same encoding as the
   Temperature trace, so a run of days above the grey band reads the same
   way there as it does here. Points sit at the centre of each column so
   they line up with the day cells underneath. */
function outlookPlot(days, normal, dateOf){
  const W = 100, H = 46, pad = 5, n = days.length;
  const wrap = el("div","outplot");
  const x = (i) => (i + 0.5) / n * W;

  let lo = Infinity, hi = -Infinity;
  for (const d of days) {
    if (d.tmax_c != null) hi = Math.max(hi, d.tmax_c);
    if (d.tmin_c != null) lo = Math.min(lo, d.tmin_c);
  }
  if (!isFinite(lo) || !isFinite(hi)) { wrap.appendChild(caption("No range")); return wrap; }
  let bHi = null, bLo = null;
  if (normal) {
    bHi = days.map(d => monthlyAt(normal.hi, dateOf(d.date)));
    bLo = days.map(d => monthlyAt(normal.lo, dateOf(d.date)));
    for (const v of bHi) hi = Math.max(hi, v);
    for (const v of bLo) lo = Math.min(lo, v);
  }
  if (hi - lo < 3) { const m = (hi + lo) / 2; lo = m - 1.5; hi = m + 1.5; }
  const y = (v) => H - pad - (v - lo) / (hi - lo) * (H - 2 * pad);
  const at = (v, i) => x(i).toFixed(2) + " " + y(v).toFixed(2);

  let rules = "";
  for (let i = 1; i < n; i++) {
    const rx = (i / n * W).toFixed(2);
    rules += '<line x1="'+rx+'" y1="0" x2="'+rx+'" y2="'+H+'" '+
      'stroke="var(--rule)" stroke-dasharray="1 3" vector-effect="non-scaling-stroke"/>';
  }
  let bandArt = "";
  if (bHi) {
    const top = bHi.map(at), bot = bLo.map(at);
    const edge = (pt) => '<path d="M'+pt.join("L")+'" fill="none" '+
      'stroke="var(--label)" stroke-width="1" stroke-dasharray="3 3" '+
      'opacity=".55" vector-effect="non-scaling-stroke"/>';
    bandArt = '<path d="M'+top.join("L")+'L'+bot.slice().reverse().join("L")+'Z" '+
                'fill="var(--label)" fill-opacity=".10" stroke="none"/>'+
              edge(top) + edge(bot);
  }
  const his = days.map((d, i) => d.tmax_c == null ? null : at(d.tmax_c, i));
  const los = days.map((d, i) => d.tmin_c == null ? null : at(d.tmin_c, i));
  const line = (pts, tone) => '<path d="' +
    pts.map((p, i) => p == null ? "" : (i && pts[i-1] != null ? "L" : "M") + p).join("") +
    '" fill="none" stroke="var(--'+tone+')" stroke-width="2.4" ' +
    'stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>';
  const both = days.map((d, i) => d.tmax_c != null && d.tmin_c != null ? i : -1)
                   .filter(i => i >= 0);
  const fill = both.length > 1
    ? '<path d="M' + both.map(i => his[i]).join("L") + "L" +
      both.slice().reverse().map(i => los[i]).join("L") + 'Z" ' +
      'fill="var(--amber)" fill-opacity=".14" stroke="none"/>'
    : "";

  wrap.innerHTML =
    '<svg class="plot" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+
      bandArt + rules + fill + line(his, "red") + line(los, "cold") +
    '</svg>';
  if (bHi) {
    wrap.insertAdjacentHTML("beforeend",
      normLabel(bHi, days, y, H, n) + normLabel(bLo, days, y, H, n));
  }
  return wrap;
}

/* The dashed band is the normal range for the time of year, and it used to
   carry no label while the plot's corners carried its scale — so people read
   the scale figures as the normals. Each dashed line now says what it is, at
   whichever end of the plot, and on whichever side of the line, keeps it
   furthest from the forecast lines. */
function normLabel(band, days, y, H, n){
  const gap = (i) => {
    const d = days[i], v = band[i];
    const near = [d.tmax_c, d.tmin_c].filter(t => t != null)
      .map(t => ({t, off: Math.abs(t - v)}))
      .sort((a, b) => a.off - b.off)[0];
    return {i, v, near};
  };
  const ends = [gap(0), gap(n - 1)];
  const room = (e) => e.near ? e.near.off : Infinity;
  const e = room(ends[1]) > room(ends[0]) ? ends[1] : ends[0];
  const top = y(e.v) / H * 100;
  // Sit on the side of the line away from the nearest forecast line, unless
  // that would push the label out of the plot.
  let above = !e.near || e.near.t < e.v;
  if (above && top < 12) above = false;
  if (!above && top > 88) above = true;
  return '<span class="ax norm' + (e.i ? " end" : "") + (above ? " above" : "") + '" ' +
         'style="top:' + top.toFixed(2) + '%">normal ' +
         esc(String(Math.round(temp(e.v)))) + '°</span>';
}

/* The Internet page: a week of tests, fetched when the page is opened.

   The card answers "is the line all right now?". This answers the questions
   that need a week to ask: is it getting worse, does it fall over at the same
   time every day, is the slow afternoon unusual. Speed is plotted against the
   plan, and latency idle against latency under load, because a line that
   tests fast and buckles under load is the one that ruins calls. */
let netWeek = null, netWeekAt = 0, netWeekBusy = false;
const NET_WEEK_MS = 4 * 60 * 1000;

async function loadNetWeek(force){
  if (netWeekBusy) return netWeek;
  if (!force && netWeek && Date.now() - netWeekAt < NET_WEEK_MS) return netWeek;
  netWeekBusy = true;
  try {
    const r = await fetch("api/internet?days=7", {cache: "no-store"});
    netWeek = await r.json();
    netWeekAt = Date.now();
  } catch (e) {
    netWeek = {available: false, error: "Could not reach the dashboard server"};
  } finally {
    netWeekBusy = false;
  }
  if (document.body.classList.contains("show-net")) renderNetPage();
  return netWeek;
}

const netMed = (vals) => {
  const v = vals.filter(x => x != null).sort((a, b) => a - b);
  return v.length ? v[Math.floor(v.length / 2)] : null;
};

function renderNetPage(){
  const host = document.getElementById("netpage");
  const s = last || {};
  const n = s.internet || {};
  const w = netWeek || {};
  const {card: c, body: b} = card("net", "Internet", "⇅", "cold", srcHealth(n));
  headAction(c, "Back to the cards", () => toggleNet(false));
  if (!w.available) {
    b.appendChild(el("div", "mid"));
    b.appendChild(caption(w.error || "Loading the last week…"));
    const link = netLink(n);
    if (link) b.appendChild(link);
    b.appendChild(el("div", "mid"));
    host.replaceChildren(c);
    return;
  }
  const pts = w.points || [];
  const ok = pts.filter(p => p.ok);
  const failed = pts.filter(p => !p.ok && !p.tool).length;
  const skipped = pts.filter(p => p.tool).length;
  const bloats = ok.filter(p => p.ping != null && p.loaded != null)
                   .map(p => p.loaded - p.ping);
  const worstBloat = bloats.length ? Math.max(...bloats) : null;
  const worstLoss = ok.reduce((m, p) => p.loss != null && p.loss > m ? p.loss : m, 0);

  b.appendChild(cells([
    {k: "Down", v: netMb(netMed(ok.map(p => p.down))), u: "Mbps", small: true,
     sub: "median of " + ok.length},
    {k: "Up", v: netMb(netMed(ok.map(p => p.up))), u: "Mbps", small: true,
     sub: "median"},
    {k: "Under load", v: worstBloat == null ? DASH : sign(worstBloat, 0), u: "ms",
     small: true, sub: "worst", tone: (worstBloat != null && worstBloat > BLOAT_BAD) ? "red" : null},
    {k: "Loss", v: worstLoss ? fg(worstLoss) : "0", u: "%", small: true,
     sub: "worst", tone: worstLoss ? "red" : null},
    {k: "Failed", v: String(failed), small: true,
     sub: "of " + pts.length + (skipped ? " · " + skipped + " didn't run" : ""),
     tone: failed ? "red" : null},
  ]));

  const plots = el("div", "netplots");
  plots.appendChild(netWeekPlot(pts, "speed", n));
  plots.appendChild(netWeekPlot(pts, "latency", n));
  b.appendChild(plots);

  // The last handful of tests, newest first, each linking to its own result.
  const rows = el("div", "tests");
  const head = el("div", "row head");
  head.innerHTML = '<span>When</span><span class="n">Down</span><span class="n">Up</span>' +
    '<span class="n">Ping</span><span class="n drop">Loss</span><span></span>';
  rows.appendChild(head);
  for (const p of pts.slice(-6).reverse()) {
    const r = el("div", "row" + (p.ok || p.tool ? "" : " bad"));
    const link = p.url ? '<a href="' + esc(p.url) + '" target="_blank" ' +
      'rel="noopener noreferrer" title="This test on speedtest.net">↗</a>' : '<span></span>';
    r.innerHTML =
      '<span>' + esc(dayClock(p.at)) + '</span>' +
      '<span class="n">' + esc(p.ok ? netMb(p.down) : p.tool ? "didn't run" : "failed") + '</span>' +
      '<span class="n">' + esc(p.ok ? netMb(p.up) : DASH) + '</span>' +
      '<span class="n">' + esc(p.ping == null ? DASH : fg(p.ping)) + '</span>' +
      '<span class="n drop">' + esc(p.loss == null ? DASH : fg(p.loss)) + '</span>' +
      link;
    rows.appendChild(r);
  }
  b.appendChild(rows);

  const bits = [pts.length + " tests over " + spanWords(w.days * 24)];
  if (n.isp) bits.push(n.isp);
  b.appendChild(caption(bits.join(" · "), "faint"));
  const link = netLink(n);
  if (link) b.appendChild(link);
  host.replaceChildren(c);
  fitCards();
}

/* One week-long plot: either speed against the plan, or latency idle against
   latency under load. Failed tests are marked on the floor — a gap in a line
   says "no reading", and the difference matters. */
function netWeekPlot(pts, kind, n){
  const W = 100, H = 30, pad = 3;
  const wrap = el("div", "netplot");
  const times = pts.map(p => p.at);
  const t0 = Math.min(...times), t1 = Math.max(...times);
  const x = (t) => t1 === t0 ? W / 2 : ((t - t0) / (t1 - t0)) * W;
  const speed = kind === "speed";
  const series = speed
    ? [["down", "cold"], ["up", "accent"]]
    : [["ping", "green"], ["loaded", "red"]];
  let hi = 0;
  for (const p of pts) for (const [key] of series)
    if (p[key] != null) hi = Math.max(hi, p[key]);
  if (speed && n.plan_down) hi = Math.max(hi, n.plan_down);
  if (!isFinite(hi) || hi <= 0) hi = 1;
  const y = (v) => H - pad - (v / hi) * (H - 2 * pad);
  const line = (key, tone) => {
    let d = "", pen = false;
    for (const p of pts) {
      if (p.tool) continue;                      // never ran: no reading, no gap
      if (p[key] == null) { pen = false; continue; }
      d += (pen ? "L" : "M") + x(p.at).toFixed(2) + " " + y(p[key]).toFixed(2);
      pen = true;
    }
    return d ? '<path d="' + d + '" fill="none" stroke="var(--' + tone + ')" ' +
      'stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" ' +
      'vector-effect="non-scaling-stroke"/>' : "";
  };
  let art = "";
  if (speed && n.plan_down)
    art += '<path d="M0 ' + y(n.plan_down).toFixed(2) + ' H' + W + '" fill="none" ' +
      'stroke="var(--label)" stroke-width="1" stroke-dasharray="3 3" opacity=".5" ' +
      'vector-effect="non-scaling-stroke"/>';
  if (!speed)
    art += '<path d="M0 ' + y(BLOAT_BAD).toFixed(2) + ' H' + W + '" fill="none" ' +
      'stroke="var(--red)" stroke-width="1" stroke-dasharray="3 3" opacity=".45" ' +
      'vector-effect="non-scaling-stroke"/>';
  for (const p of pts)
    if (!p.ok)
      art += '<path d="M' + x(p.at).toFixed(2) + ' ' + (H - 1.2) + ' V' + H + '" ' +
        'stroke="var(--' + (p.tool ? "label" : "red") + ')" stroke-width="2" ' +
        'vector-effect="non-scaling-stroke"/>';
  const dayTicks = [];
  for (let t = Math.ceil(t0 / 86400) * 86400; t <= t1; t += 86400) dayTicks.push(t);
  for (const t of dayTicks)
    art += '<path d="M' + x(t).toFixed(2) + ' 0 V' + H + '" stroke="var(--rule)" ' +
      'stroke-dasharray="1 3" vector-effect="non-scaling-stroke"/>';

  wrap.innerHTML =
    '<svg class="plot" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">' +
      art + series.map(([k, tone]) => line(k, tone)).join("") +
    '</svg>' +
    '<span class="ax hi">' + esc(speed ? netMb(hi) + " Mbps" : Math.round(hi) + " ms") + '</span>' +
    '<span class="ax lo">0</span>' +
    '<span class="tag">' + (speed
      ? 'Down <b style="color:var(--cold)">—</b> Up <b style="color:var(--accent)">—</b>'
      : 'Idle <b style="color:var(--green)">—</b> Loaded <b style="color:var(--red)">—</b>') +
    '</span>';
  return wrap;
}

let leavingNet = false;

function toggleNet(force, fromHistory){
  const open = document.body.classList.contains("show-net");
  const on = force != null ? force : !open;
  if (!fromHistory) {
    const ours = !!(history.state && history.state.netpage);
    if (!on && ours) {
      if (!leavingNet) { leavingNet = true; history.back(); }
      return;
    }
    if (on && !ours) history.pushState({netpage: true}, "");
  }
  const swap = () => {
    document.body.classList.toggle("show-net", on);
    if (on) {
      document.body.classList.remove("show-map", "show-settings", "show-outlook");
      renderNetPage();
      loadNetWeek();
    }
    document.getElementById("netpage").setAttribute("aria-hidden", on ? "false" : "true");
    document.getElementById("netBtn").setAttribute("aria-pressed", on ? "true" : "false");
  };
  if (document.startViewTransition) document.startViewTransition(swap);
  else swap();
}

/* ── render loop ─────────────────────────────────────────────────────── */
let last = null;

/* /testall — a loop through every picture the dashboard can show, for a TV
   or a visitor: the rain from light to the ark, the alert banner, the pollen
   faces, the tree in rising wind, the Internet card turned over and the
   ten-day outlook. It works on a copy of the live state and changes nothing
   stored — the card order it shows is its own, dragging is off, and nothing
   is saved. Clicking the tag moves on; the arrow keys go either way. ?dwell=N
   makes it advance by itself every N seconds instead. */
const TESTALL = /\/testall$/.test(location.pathname);
const TESTALL_DWELL = Math.max(0, Number(new URLSearchParams(location.search).get("dwell")) || 0) * 1000;
const TESTALL_SLOTS = ["rainfall", "lightning", "pollen", "wind", "internet", "forecast"];
const TESTALL_STEPS = [
  {label: "Light rain", rain: "light"},
  {label: "Moderate rain", rain: "moderate"},
  {label: "Heavy rain — duck weather", rain: "heavy"},
  {label: "Violent rain — the ark", rain: "violent", dwell: 2},
  {label: "Hail", rain: "hail"},
  {label: "Snow", rain: "snow"},
  {label: "Heavy snow — snowman weather", rain: "heavysnow"},
  {label: "Blizzard — stay inside", rain: "blizzard"},
  {label: "Freezing rain", rain: "freezing"},
  {label: "Sleet", rain: "sleet"},
  {label: "Lightning — a storm nearby", storm: "nearby"},
  {label: "Lightning — overhead", storm: "overhead"},
  {label: "Lightning — quiet, and the kite", storm: "kite"},
  {label: "Alerts — the three worst", alerts: ["extreme", "severe", "moderate"]},
  {label: "Alerts — minor and unknown", alerts: ["minor", "unknown"]},
  ...[0, 1, 2, 3, 4, 5].map(i => ({label: "Pollen — " + POLLEN_WORDS[i], pollen: i})),
  {label: "Wind — calm", wind: 0.3},
  {label: "Wind — a breeze", wind: 3.5},
  {label: "Wind — strong", wind: 9},
  {label: "Wind — a gale", wind: 19},
  // Turned over without the half-minute timer that turns it back, since a
  // step now lasts until the next click.
  {label: "Internet card, turned over",
   enter: () => { netFlip(true); clearTimeout(netFlipTimer); }, leave: () => netFlip(false)},
  {label: "Ten-day outlook",
   enter: () => toggleOutlook(true), leave: () => toggleOutlook(false)},
];
let testStep = -1, rawLast = null;

function testallApply(s){
  const st = TESTALL_STEPS[testStep];
  if (!st) return s;
  s = JSON.parse(JSON.stringify(s));
  s.slots = TESTALL_SLOTS;
  if (st.pollen != null) {
    const v = st.pollen;
    s.pollen = Object.assign({}, s.pollen, {available: true, error: "",
      tree: v, grass: Math.max(0, v - 2), weed: Math.max(0, v - 1), categories: {}});
  }
  if (st.wind != null) {
    s.obs = Object.assign({}, s.obs, {wind_avg_ms: st.wind, wind_gust_ms: st.wind * 1.4});
  }
  return s;
}

function testallNext(dir = 1){
  const prev = TESTALL_STEPS[testStep];
  if (prev && prev.leave) prev.leave();
  const n = TESTALL_STEPS.length;
  testStep = ((testStep + dir) % n + n) % n;
  const st = TESTALL_STEPS[testStep];
  TEST_RAIN = st.rain ? rainPreset(st.rain) : null;
  TEST_STORM = st.storm ? stormPreset(st.storm) : null;
  TEST_ALERTS = st.alerts ? sampleAlerts(st.alerts) : null;
  document.getElementById("testtag").textContent =
    "TEST " + (testStep + 1) + "/" + n + " · " + st.label + "  \u203a";
  if (st.enter) st.enter();
  if (rawLast) render(testallApply(rawLast));
  clearTimeout(testallNext.timer);
  if (TESTALL_DWELL)
    testallNext.timer = setTimeout(testallNext, TESTALL_DWELL * (st.dwell || 1));
}
const grid = document.getElementById("grid");

function render(s){
  last = s;
  if (paused) return;                       // a drag is in progress
  if (document.body.classList.contains("show-map") ||
      document.body.classList.contains("show-settings") ||
      document.body.classList.contains("show-net") ||
      document.body.classList.contains("show-outlook")) {
    if (document.body.classList.contains("show-outlook")) {
      // A wall display left on the outlook goes back to the cards by itself.
      if (document.body.classList.contains("tv") &&
          Date.now() - outlookSince > OUTLOOK_IDLE_MS && !TESTALL) toggleOutlook(false);
      else renderOutlook();
    }
    updateFooter(s);
    return;                                   // cards are hidden; skip the work
  }
  const scroll = window.scrollY;
  const slots = (s.slots && s.slots.length) ? s.slots
    : ["temperature","wind","pressure","rainfall","astronomy","forecast"];
  const cards = slots.map(name => {
    const c = (CARD_BUILDERS[name] || buildBlank)(s);
    c.draggable = !TESTALL;
    c.title = "Drag to rearrange";
    return c;
  });
  grid.replaceChildren(...cards);
  // keep the grid balanced when fewer than six cards are shown
  if (window.matchMedia("(max-width:720px)").matches) {
    grid.style.removeProperty("grid-template-columns");
    grid.style.removeProperty("grid-template-rows");
  } else {
    // Keep cards roughly card-shaped whatever the count: two across up to
    // four, three up to nine, four beyond that.
    const n = cards.length;
    const cols = n <= 1 ? 1 : n <= 4 ? 2 : n <= 9 ? 3 : 4;
    grid.style.gridTemplateColumns = "repeat(" + cols + ",1fr)";
    grid.style.gridTemplateRows =
      "repeat(" + Math.ceil(cards.length / cols) + ",1fr)";
  }
  window.scrollTo(0, scroll);
  renderAlerts(s);
  updateFooter(s);
  fitCards();
}

function updateFooter(s){
  document.getElementById("footdot").className = "dot " + s.health;
  document.getElementById("station").textContent =
    s.station_name || (s.demo ? "Demo station" : "Waiting for a hub");
  const meta = [];
  if (s.obs.battery != null) meta.push(s.obs.battery.toFixed(2) + " V");
  const mode = s.demo ? "Demo"
    : {live:"Live", stale:"Stale", offline:"Offline", waiting:"Waiting"}[s.health];
  meta.push(mode + " · " + (s.last_type || "no packets") + " · UDP :" + s.port);
  if (s.age_s != null) meta.push("updated " + ago(s.age_s) + " ago");
  document.getElementById("meta").textContent = meta.join("   ·   ");

  const banner = document.getElementById("banner");
  if (s.source_error) {
    banner.textContent = s.source_error;
    banner.classList.add("show");
  } else if (s.source_alive === false) {
    banner.textContent = "The hub listener stopped — the server is restarting it.";
    banner.classList.add("show");
  } else if (s.health === "waiting" && s.uptime_s > 60 && !s.demo) {
    // The classic deployment failure: the host cannot see the broadcasts.
    banner.textContent = "No hub packets after " + ago(s.uptime_s) +
      " on UDP :" + s.port + " — the hub broadcasts, so this host must be on " +
      "the same subnet, and a Docker container must use host networking.";
    banner.classList.add("show");
  } else if (s.health === "offline") {
    banner.textContent = "No packets for " + ago(s.age_s) +
      " — the hub may be offline or off this subnet.";
    banner.classList.add("show");
  } else banner.classList.remove("show");
}

function tickClock(){
  const now = new Date();
  document.getElementById("clock").textContent =
    now.toLocaleTimeString([], {hour:"numeric", minute:"2-digit", second:"2-digit"});
  document.getElementById("date").textContent =
    now.toLocaleDateString([], {weekday:"short", month:"short", day:"numeric"});
}

/* The hub sends rapid_wind every ~3 s, but the full snapshot is only polled
   every 2 s. This asks for just the wind far more often — a few dozen bytes —
   so the compass tracks the station rather than the poll clock. */
async function pollWind(){
  try {
    const res = await fetch("api/wind", {cache:"no-store"});
    if (!res.ok) return;
    const w = await res.json();
    if (w.dir == null || windDial.shown == null) return;
    setWindTarget(w.dir);
    if (w.ms != null) windDial.speedTarget = w.ms;
    startWindDial();
    const dir = document.querySelector("#card-wind .wind-dir");
    if (dir) dir.innerHTML = '<span class="accent">' + compass(w.dir) +
                             '</span> ' + Math.round(w.dir) + "\u00b0";
  } catch (e) { /* the 2 s snapshot poll reports connection trouble */ }
}

/* Watchdog. This page is meant to sit on a TV unattended for weeks, where
   the failure that matters is the silent one: the NAS reboots, or the tab is
   frozen and thawed, and the page sits there showing stale numbers with
   nobody to notice. Polling alone recovers from a brief blip, but not from a
   page whose scripts have got into a bad state — only a reload does that.

   Two triggers: sustained loss of contact, and a very long uptime, which
   also clears whatever a browser accumulates over weeks of rebuilding the
   DOM every two seconds. Reloads are rate-limited across page loads so a
   server that is genuinely down can never cause a reload loop. */
const WATCH = {
  startedAt: Date.now(),
  failingSince: null,
  failAfterMs: 4 * 60 * 1000,        // out of contact this long -> reload
  maxUptimeMs: 24 * 60 * 60 * 1000,  // refresh a long-running display daily
  minGapMs: 5 * 60 * 1000,           // never reload more often than this
};

function lastReloadAt(){
  try { return Number(sessionStorage.getItem("reloadedAt") || 0); }
  catch (e) { return 0; }
}

function watchdogReload(why){
  const since = Date.now() - lastReloadAt();
  if (since < WATCH.minGapMs) return;       // do not spin
  if (document.visibilityState === "hidden") return;   // pointless while hidden
  try { sessionStorage.setItem("reloadedAt", String(Date.now())); } catch (e) {}
  console.warn("watchdog: reloading —", why);
  location.reload();
}

function watchdogTick(){
  const now = Date.now();
  if (WATCH.failingSince && now - WATCH.failingSince > WATCH.failAfterMs) {
    watchdogReload("no contact for " + Math.round((now - WATCH.failingSince) / 60000) + "m");
    return;
  }
  // Only refresh on age when things are healthy, so this never competes
  // with the failure path or interrupts someone mid-look.
  if (!WATCH.failingSince && now - WATCH.startedAt > WATCH.maxUptimeMs &&
      !document.body.classList.contains("show-settings")) {
    watchdogReload("up for 24h");
  }
}

let failures = 0;
/* A dashboard left open polls for data but never re-fetches itself, so it goes
   on running the HTML and CSS it started with however many times the server is
   rebuilt beneath it — a wall display can show a stale interface for weeks and
   look perfectly healthy doing it, because the numbers on it are current. The
   server sends a digest of the page it would serve; when that stops matching
   the page we are, the update has landed and we are the old one. */
let uiId = null;
function checkUi(s){
  if (!s.ui) return;                       // server too old to say
  if (uiId == null) { uiId = s.ui; return; }
  if (s.ui === uiId) return;
  // Not mid-drag and not mid-settings: reloading would throw away a token
  // half-typed or a card half-moved. The next poll will catch it once they
  // are done, which is soon enough for a change that already shipped.
  if (paused || document.body.classList.contains("show-settings")) return;
  location.reload();
}

async function poll(){
  try {
    const res = await fetch("api/state", {cache:"no-store"});
    if (!res.ok) throw new Error("HTTP " + res.status);
    const s = await res.json();
    if (!Object.keys(prefs).length) loadPrefs(s.units);
    failures = 0;
    WATCH.failingSince = null;
    checkUi(s);
    rawLast = s;
    render(TESTALL ? testallApply(s) : s);
  } catch (e) {
    failures++;
    if (WATCH.failingSince == null) WATCH.failingSince = Date.now();
    if (failures > 2) {
      const banner = document.getElementById("banner");
      const mins = Math.round((Date.now() - WATCH.failingSince) / 60000);
      banner.textContent = "Lost contact with the dashboard server — retrying" +
        (mins >= 1 ? " (" + mins + "m; reloading at " +
                     Math.round(WATCH.failAfterMs / 60000) + "m)" : "…");
      banner.classList.add("show");
      document.getElementById("footdot").className = "dot offline";
    }
  }
}

/* On a phone each card is sized to the screen minus the footer. Guessing that
   height goes wrong as Safari shows and hides its toolbars, so measure the
   footer we actually rendered and hand it to the CSS. */
function measureChrome(){
  if (!window.matchMedia("(max-width:720px)").matches) return;
  const f = document.querySelector("footer");
  if (!f) return;
  // The footer and, while there are any, the alerts sitting on it: both are
  // sticky, so together they are what overlays the scroll viewport. The grid
  // gap is accounted for in the CSS.
  const foot = Math.ceil(f.getBoundingClientRect().height);
  const al = document.getElementById("alerts");
  const alerts = al && al.classList.contains("show")
    ? Math.ceil(al.getBoundingClientRect().height) : 0;
  const root = document.documentElement.style;
  if (root.getPropertyValue("--foot") !== foot + "px") root.setProperty("--foot", foot + "px");
  if (root.getPropertyValue("--chrome") !== (foot + alerts) + "px")
    root.setProperty("--chrome", (foot + alerts) + "px");
}

/* ── chrome ──────────────────────────────────────────────────────────── */
function applyTheme(t){
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem("theme", t); } catch (e) {}
}
function toggleTheme(){
  applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
}
function setTv(on){
  document.body.classList.toggle("tv", on);
  const url = new URL(location.href);
  if (on) url.searchParams.set("tv", "1"); else url.searchParams.delete("tv");
  history.replaceState(history.state, "", url);   // keep the outlook's entry
}

/* The map is a third-party embed (Windy — free, no account, no key). It is
   the one part of the dashboard that needs internet on the *viewing* device;
   everything else is served by the NAS. Nothing loads until first opened. */
function windyUrl(lat, lon, zoom){
  const q = new URLSearchParams({
    lat: lat.toFixed(4), lon: lon.toFixed(4),
    detailLat: lat.toFixed(4), detailLon: lon.toFixed(4),
    zoom: String(zoom), level: "surface", overlay: "radar", product: "radar",
    menu: "", message: "", marker: "true", calendar: "now",
    type: "map", location: "coordinates", detail: "",
    metricWind: prefs.wind === "km/h" ? "km/h" : prefs.wind === "kts" ? "kt"
                : prefs.wind === "m/s" ? "m/s" : "mph",
    metricTemp: prefs.temp === "°C" ? "°C" : "°F",
  });
  return "https://embed.windy.com/embed2.html?" + q.toString();
}

let mapLoaded = false;
function ensureMap(){
  if (mapLoaded) return;
  const host = document.getElementById("map");
  const lat = last && last.lat, lon = last && last.lon;
  if (lat == null || lon == null) {
    host.innerHTML = '<div class="placeholder">Set the station location on ' +
      'the server (--lat / --lon) to show the map.</div>';
    return;                                  // retry if coords arrive later
  }
  const f = document.createElement("iframe");
  f.src = windyUrl(lat, lon, 8);
  f.loading = "lazy";
  f.referrerPolicy = "no-referrer";
  f.title = "Weather radar map";
  host.replaceChildren(f);
  mapLoaded = true;
}

function toggleMap(force){
  const swap = () => {
    const on = force != null ? force : !document.body.classList.contains("show-map");
    document.body.classList.toggle("show-map", on);
    if (on) document.body.classList.remove("show-outlook", "show-settings");
    document.getElementById("map").setAttribute("aria-hidden", on ? "false" : "true");
    document.getElementById("mapBtn").setAttribute("aria-pressed", on ? "true" : "false");
    if (on) ensureMap();
  };
  if (document.startViewTransition) document.startViewTransition(swap);
  else swap();
}

function toggleSettings(force){
  const swap = () => {
    const on = force != null ? force
      : !document.body.classList.contains("show-settings");
    document.body.classList.toggle("show-settings", on);
    if (on) document.body.classList.remove("show-map", "show-outlook");
    document.getElementById("settings").setAttribute("aria-hidden", on ? "false" : "true");
    document.getElementById("setBtn").setAttribute("aria-pressed", on ? "true" : "false");
    if (on) renderSettings();
  };
  if (document.startViewTransition) document.startViewTransition(swap);
  else swap();
}

/* The outlook is a page of its own as far as the browser is concerned: opening
   it pushes a history entry, so the Back button — the LG remote's, a phone's
   swipe — closes it without anyone having to aim at anything. Every other way
   out (the header, Escape, a tap on the TV, the idle timer) goes back through
   that same entry, so history and the screen never disagree. leavingOutlook
   stops two exits in the same moment from going back two steps. */
let leavingOutlook = false;
let outlookSince = 0;       // last input while the outlook was up, for the idle return
const OUTLOOK_IDLE_MS = 3 * 60 * 1000;

function toggleOutlook(force, fromHistory){
  const open = document.body.classList.contains("show-outlook");
  const on = force != null ? force : !open;
  if (!fromHistory) {
    const ours = !!(history.state && history.state.outlook);
    if (!on && ours) {
      if (!leavingOutlook) { leavingOutlook = true; history.back(); }
      return;                               // popstate does the closing
    }
    if (on && !ours) history.pushState({outlook: true}, "");
  }
  if (on) outlookSince = Date.now();
  const swap = () => {
    document.body.classList.toggle("show-outlook", on);
    if (on) {
      document.body.classList.remove("show-map", "show-settings");
      renderOutlook();
    }
    document.getElementById("outlook").setAttribute("aria-hidden", on ? "false" : "true");
    document.getElementById("outBtn").setAttribute("aria-pressed", on ? "true" : "false");
  };
  if (document.startViewTransition) document.startViewTransition(swap);
  else swap();
}
document.getElementById("outBtn").addEventListener("click", () => toggleOutlook());
document.getElementById("netBtn").addEventListener("click", () => toggleNet());

window.addEventListener("popstate", () => {
  leavingOutlook = false;
  leavingNet = false;
  const outlook = !!(history.state && history.state.outlook);
  if (outlook !== document.body.classList.contains("show-outlook"))
    toggleOutlook(outlook, true);
  const net = !!(history.state && history.state.netpage);
  if (net !== document.body.classList.contains("show-net"))
    toggleNet(net, true);
});

/* The whole outlook is the way back, header included: nothing on it is
   clickable, and the header alone is a thin strip for a remote's pointer. It
   began TV-only and was widened to every screen by the owner's choice. The
   flip button stops its own click, so it cannot fire this as well. */
document.getElementById("outlook").addEventListener("click", () => {
  toggleOutlook(false);
});

/* And the way in: the whole Forecast card opens the outlook, not just its
   header — on the TV, where the header is a hard target for a remote's
   pointer, and everywhere else too, by the owner's choice. One listener on
   the grid, since the card itself is rebuilt every two seconds. The header
   is part of the card; its flip button stops its own click. */
document.getElementById("grid").addEventListener("click", (e) => {
  if (!e.target.closest("#card-fc")) return;
  toggleOutlook(true);
});

/* A tap is not a grab. Cards act on a tap anywhere now, and a card is also
   something you press, hold and drag — so a press held half a second and let
   go without moving was opening the outlook when someone meant to move the
   card, and a browser that fires a click after a drag would do the same. This
   sits in the capture phase on the grid, ahead of every card's own handlers,
   and swallows any click that was really a hold or the end of a drag.
   Keyboard activation (detail 0) has no press to measure and is let through. */
const HOLD_MS = 500;
let pressAt = 0, dragEndAt = 0;
grid.addEventListener("pointerdown", () => { pressAt = Date.now(); }, true);
grid.addEventListener("dragend", () => { dragEndAt = Date.now(); }, true);
grid.addEventListener("click", (e) => {
  if (e.detail === 0) return;
  const now = Date.now();
  if (now - pressAt >= HOLD_MS || now - dragEndAt < 300) {
    e.stopPropagation();
    e.preventDefault();
  }
}, true);

/* The Internet card turns over from a tap anywhere on it, either face. Only a
   card that can turn: when Speedtest is unavailable it is a single face. The
   headers are part of it; the flip buttons stop their own clicks. */
document.getElementById("grid").addEventListener("click", (e) => {
  if (!e.target.closest("#card-internet.flip")) return;
  netFlip(!netFlipped);
});

// Any input counts as someone still looking.
for (const ev of ["pointermove", "pointerdown", "keydown", "wheel", "touchstart"])
  document.addEventListener(ev, () => { outlookSince = Date.now(); }, {passive: true});

document.getElementById("setBtn").addEventListener("click", async () => {
  if (!cfg) await loadConfig();
  toggleSettings();
});
document.getElementById("mapBtn").addEventListener("click", () => toggleMap());
document.getElementById("themeBtn").addEventListener("click", toggleTheme);
document.getElementById("tvBtn").addEventListener("click",
  () => setTv(!document.body.classList.contains("tv")));
document.addEventListener("keydown", (e) => {
  if (e.key === "t") toggleTheme();
  if (e.key === "f") setTv(!document.body.classList.contains("tv"));
  if (e.key === "w") toggleMap();
  if (e.key === "d") toggleOutlook();
  if (e.key === "n") toggleNet();
  if (e.key === "Escape" && document.body.classList.contains("show-net"))
    toggleNet(false);
  if (e.key === "Escape" && document.body.classList.contains("show-outlook"))
    toggleOutlook(false);
  if (e.key === "s") { if (!cfg) loadConfig().then(() => toggleSettings());
                       else toggleSettings(); }
  if (e.key === "Escape" && document.body.classList.contains("show-settings"))
    toggleSettings(false);
  if (e.key === "Escape" && document.body.classList.contains("show-map"))
    toggleMap(false);
});

(function init(){
  let saved = null;
  try { saved = localStorage.getItem("theme"); } catch (e) {}
  applyTheme(saved === "light" ? "light" : "dark");
  if (new URLSearchParams(location.search).has("tv")) setTv(true);
  if (TESTALL) {
    document.body.classList.add("testall");
    document.getElementById("testtag").addEventListener("click", () => testallNext(1));
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") testallNext(1);
      if (e.key === "ArrowLeft") testallNext(-1);
    });
    testallNext();
  }
  // The page reloads itself after a deploy. If it was on the outlook, the
  // history entry survived the reload; put the outlook back to match it.
  if (history.state && history.state.outlook) toggleOutlook(true, true);
  if (history.state && history.state.netpage) toggleNet(true, true);
  loadPrefs(null);
  tickClock();
  setInterval(tickClock, 1000);
  loadConfig();
  wireCardDrag();
  poll();
  setInterval(poll, 2000);
  setInterval(pollWind, 900);
  setInterval(watchdogTick, 20000);
  // A tab thawed after being frozen may hold minutes-old data; check at once.
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") { poll(); watchdogTick(); }
  });
  measureChrome();
  addEventListener("orientationchange", () => setTimeout(measureChrome, 250));
  let fitJob = null;
  addEventListener("resize", () => {
    measureChrome();
    clearTimeout(fitJob);
    fitJob = setTimeout(() => { fitCache.clear(); fitCards(); }, 120);
  });
})();
</script>
</body>
